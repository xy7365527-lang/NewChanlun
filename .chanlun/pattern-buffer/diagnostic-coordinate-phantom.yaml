formal_pattern: |
  当诊断指标 D 满足：
    (a) D 度量的对象与生产判据（AncOK/A_t/持仓准入）度量同一对象 X
    (b) D 走诊断路径自建坐标系（重建树 elem_depth / restore overlay）
    (c) 生产判据走生产路径坐标系（work parent 链 / 同一份 A_t）
    (d) 两坐标系不一致
  则 D 是**坐标系伪证**——指标值（如 14166）在生产坐标系下不可达，误导归因（看似修复成功/腿已激活，实则真准入=0）。
  这是 635 号"运动员当裁判"在诊断维度的复现：诊断指标自证准入 = 运动员（诊断路径）当裁判（生产路径的代理）。
  消除条件：诊断指标必须走生产同坐标系——同一份 work parent 链 / 同一份 A_t，禁止诊断路径自建重建树/overlay 另算。
candidate_skill_section:
  target_skill: 待 promote（frequency 达 3 时由 skill-crystallizer 评估独立新建 vs 并入既有守卫纪律）
  proposed_section: |
    ## 诊断坐标系≠生产坐标系伪证检测

    诊断指标若走诊断路径自建坐标系（重建树/overlay），其值在生产坐标系下不可达 → 伪证误导归因。

    ### 检查清单（每次新增/读诊断指标时）
    1. 该诊断指标度量的对象，是否与生产判据（AncOK/A_t）度量同一对象？
    2. 若是，诊断路径是否走生产同坐标系（同一 work parent 链 / 同一 A_t）？
    3. 若诊断路径自建重建树/restore overlay 另算 → 坐标系伪证，指标值无意义。
    4. 异质验证：诊断指标的"修复成功"声明须走生产坐标系复测（635 运动员当裁判 + 640 异质审查）。
