formal_pattern: |
  当蜂群有"全局状态"X 满足：
    (a) X 不被任何业务工位消费（无局部消费者）
    (b) X 不被 ceremony_scan 消费
    (c) X 是 frontmatter 字段或运行时变量
  则 X 处于"scan 状态不可观测"状态——成为 Lead 盲点 = 094号审计层断裂 Gap 在工程基础设施层的复现。
  消除条件：将 X 加入 ceremony_scan 的消费器。
candidate_skill_section:
  target_skill: ceremony-scan-completeness
  proposed_section: |
    ## scan 状态不可观测模式（结晶自 429候选1+pending-001）

    无局部消费者的全局状态需要 ceremony_scan 强制消费，否则形成盲点。

    ### 检查清单（每次新增 frontmatter 字段或运行时变量时）
    1. 是否有业务工位消费此字段/变量？
    2. 若无，是否在 ceremony_scan 的消费列表中？
    3. 若都无，立即提交 pending 谱系（同 pending-001）

    ### 已知应消费但未消费列表（消费器待实装）
    - topo_effect 字段一致性
    - 推论 coverage_status
    - ARTICULATE 实装状态对齐
