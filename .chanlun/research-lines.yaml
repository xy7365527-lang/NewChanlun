#
# 设计约束（编排者确认）：
#   1. 状态转换：ceremony_scan.py 提议转换，编排者确认。ceremony 不越权。
#   2. next_action 必须结构化：ceremony_scan.py 能机器读取，不是自由文本备忘录。
#   3. 与275号局部依赖一致：每条谱系只管自己属于哪条线，全局视图是局部标注的聚合。
#
# 状态枚举：active | blocked | closed
# next_actions.type 枚举：engineering | experiment | theory | integration
# completion_check 类型：
#   - file_exists: <path>           — 文件存在即完成
#   - genealogy_settled: <keyword>  — 谱系 settled 目录中存在包含关键词的文件
#   - script_exists: <path>         — 脚本存在即完成
#   - test_pass: <pattern>          — 匹配模式的测试文件存在且通过

