  - id: signal_resolution_1s_bi_a0
    title: "信号层分辨率升级（1秒数据 + 笔级别a0）—— 主线"
    priority: P1
    status: active
    decision: "编排者 2026-06-22：根本问题在信号层递归深度不足，非操作层。路径=1秒数据+笔级别a0。"
    hypothesis_level: "L0（待 L2/L3 验证）：1秒笔a0→8-10级→中间级别滤波器展开→完整周期总和趋近Σ|涨跌幅|→完整周期>BH。这是假设不是定理，升级为检验它，否定性结果同样有价值。"
    source: "编排者 2026-06-22 /ceremony 方向 #1 + 滤波器理论重新框定"
    description: |
      理论框定（编排者）：每级别=带通滤波器，捕获自身尺度|涨跌幅|；足够递归深度→总和趋近Σ|涨跌幅|。
      当前 1分钟+线段a0 仅 5-6 级，中间级别缺失，滤波器未展开 → BTC完整周期+38.9%<<BH+1380%。
      升级两层（缺一不可）：
        (1) 数据粒度：1分钟→1秒 bar（barspec-impl 工位，nt-scope 已给 bar_spec 参数化改点 A-C，保持现有1m bit-exact回归）；
        (2) 递归底座下移：a0 线段→笔(bi)，比线段低一级，是级别数5-6→8-10的主因（filter-spec 工位出方案）。
      filter-spec 工位负责：滤波器命题形式化 + a0=笔范围厘清 + L2/L3 证伪条件设计（含"1秒笔下僵尸核心死锁是否仍发生"）。
    added_by: "编排者 /ceremony 指令"
