name: Rust job setup (#1141 / #1588)
description: >-
  #1588 把 rust-check 拆成多个并行 job 后，各 Rust job 共用的前置：记录 runner/工具链/链接器与初始资源、
  只缓存 cargo registry + git（#1141：不恢复 target）、记录缓存结果，并建好 rust/target 供遥测包装器
  的边界快照使用。须在 actions/checkout 之后调用。

runs:
  using: composite
  steps:
    # #1323：newchan_rust 依赖 pyo3 0.23（pyo3-ffi 0.23.5 最高支持 CPython 3.13）。ubuntu runner 镜像的
    #   默认 python3 已升到 3.14，pyo3-ffi build script 在编译前直接拒绝（run 40696853620）。
    #   钉 3.13（与 ci.yml test / s-sequence-1488 / s-fields-native-1488 同版本），并以 PYO3_PYTHON
    #   显式指向该解释器；不用 PYO3_USE_ABI3_FORWARD_COMPATIBILITY 绕过检查。升 pyo3 另议。
    - name: Set up Python 3.13 for pyo3 (#1323)
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Point PYO3_PYTHON at the pinned interpreter (#1323)
      shell: bash
      run: |
        echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
        "${{ steps.setup-python.outputs.python-path }}" -V

    # #1875：Boat 快照里的 rustup stable 停在快照保存那天，GitHub 托管镜像则随时升级；#1608 约定工具链随
    #   stable（新 lint 由 -D warnings 暴露），所以两种 runner 都先对齐到当前 stable，版本记录在下一步。
    - name: Align Rust toolchain with current stable (#1875)
      shell: bash
      run: flock "${RUSTUP_HOME:-$HOME/.rustup}/.stable-install.lock" sh -c 'rustup toolchain install stable --profile minimal --no-self-update && rustup default stable'

    # #1875 R4：本仓 crate 测试构建 opt-level 1（断言与溢出检查显式保持开启）；libtest 线程数与 GitHub
    #   托管 runner 的 4 核一致（Boat large 为 8 核，8 线程会放大测试里按 fd 号/计时判断的竞态，FL1/R4b）。
    - name: Optimize own crate in test builds and pin test threads (#1875 R4)
      shell: bash
      run: |
        cfg="${CARGO_HOME:-$HOME/.cargo}/config.toml"
        mkdir -p "$(dirname "$cfg")"
        flock "$cfg.lock" bash -c 'grep -qxF "[profile.dev]" "$1" 2>/dev/null || printf "[profile.dev]\nopt-level = 1\ndebug-assertions = true\noverflow-checks = true\n" >> "$1"' _ "$cfg"
        echo "RUST_TEST_THREADS=4" >> "$GITHUB_ENV"
        cat "$cfg"

    - name: Record runner, toolchain, linker, and initial resources (#1141)
      shell: bash
      working-directory: rust
      run: |
        set -x
        echo "github_sha=$GITHUB_SHA"
        echo "runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH"
        echo "image_os=${ImageOS:-unset} image_version=${ImageVersion:-unset} image_release=${ImageRelease:-unset}"
        cat /etc/os-release
        uname -a
        rustc -vV
        cargo -V
        rustup show active-toolchain
        command -v cc
        readlink -f "$(command -v cc)"
        cc --version
        rust_sysroot="$(rustc --print sysroot)"
        rust_host="$(rustc -vV | awk '/^host:/ {print $2}')"
        rust_lld="$rust_sysroot/lib/rustlib/$rust_host/bin/rust-lld"
        if test -x "$rust_lld"; then
          "$rust_lld" -flavor gnu --version
        else
          echo "bundled_rust_lld=not-found path=$rust_lld"
        fi
        if command -v ld.bfd; then
          ld.bfd --version
        fi
        printf 'fn main() {}\n' > "$RUNNER_TEMP/rust-linker-probe.rs"
        rustc --print link-args "$RUNNER_TEMP/rust-linker-probe.rs" -o "$RUNNER_TEMP/rust-linker-probe"
        nproc
        lscpu
        free -b
        df -B1 -T .
        du -sx -B1 target 2>/dev/null || true

    # #1141：三轮都在 default-target test 链接阶段失败，且受害 bin 每轮漂移；
    # run 32315548218 在 rust-lld signal 7 后明确报 ENOSPC。根因是磁盘耗尽，
    # 不是已证实的固定对象损坏或 rust-lld regression。处置只压低磁盘峰值：
    # 不恢复 target、不生成 incremental、测试串行编译；runner/toolchain/linker 不钉死。
    # #1588：拆 job 后每个 job 在独立 runner 上，各自只编自己那档 feature，磁盘峰值低于拆前单 job。
    - name: Cache cargo registry + git only (#1141)
      id: cargo-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-${{ runner.environment }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.environment }}-cargo-registry-v1-

    # #1875：只在 CI 里给第三方依赖开优化（本仓 crate 仍为 debug，debug-assertions/溢出检查不变；
    #   release 档本就 opt-level 3，不受影响）。debug 测试的长单测（tb02w 单线程约 40–75 分钟）大量时间
    #   耗在 -O0 的 bundled SQLite（C）、sha2、serde_json 上；同一提交实测 tb02w 75→46 分钟，全部指纹不变
    #   （run 41829351939 对 41784385074）。写在 $CARGO_HOME，不改仓内 Cargo.toml；幂等且加锁，同一台机器
    #   上多个作业共用 CARGO_HOME 时不会重复追加（重复的表会让 cargo 解析失败）。
    - name: Optimize third-party dependencies in test builds (#1875)
      shell: bash
      run: |
        cfg="${CARGO_HOME:-$HOME/.cargo}/config.toml"
        mkdir -p "$(dirname "$cfg")"
        flock "$cfg.lock" bash -c 'grep -qF "[profile.dev.package.\"*\"]" "$1" 2>/dev/null || printf "[profile.dev.package.\"*\"]\nopt-level = 2\n" >> "$1"' _ "$cfg"
        cat "$cfg"

    # 遥测包装器的边界快照对 `du target` 失败即判红；拆 job 后首个 cargo 步可能就是被包装的那一步，
    # 此时 target 尚不存在，故预先建空目录（不影响构建产物）。
    - name: Record cache result and post-cache resources (#1141)
      shell: bash
      working-directory: rust
      run: |
        echo "cache_primary_key=${{ runner.os }}-${{ runner.environment }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}"
        echo "cache_hit=${{ steps.cargo-cache.outputs.cache-hit }}"
        mkdir -p target
        free -b
        df -B1 -T .
        du -sx -B1 target 2>/dev/null || true
