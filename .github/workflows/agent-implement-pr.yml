name: Agent Implement PR
# #1110 AC-3：PR 上 `agent:implement` label 触发的 implement-PR 修正入口（评审意见落地）。
# `pull_request_target` + `types: [labeled]`：label 事件在 base 上下文、带 secret、不依赖
# PR merge commit。信任闸 = 只有仓库写权限者（maintainer）能打 label；本仓私有、
# issue-tracker 口径「PRs as a request surface: no」⟹ 无外部/fork PR 面，label 事件不会被
# 不可信 PR 内容自动触发。工蜂 checkout head.sha 是有意的：需看并修正 PR 分支。
#
# #1128：implement-pr 与 issue implement 共用同一模型 registry（默认 Claude /
# 显式 `agent:model:deepseek-v4-pro`）。Detect model route 步运行时实读 PR labels 后
# grep -qx 精确匹配，只选择注入哪一条固定 Secret（Claude 或 DeepSeek）；大小写变体
# 与 TS registry 一样 fail-loud，不用 pull_request_target label 快照/contains 路由
# （contains 大小写不敏感，且 #1173 实测快照在 if 中求值不可靠）。
# EVENT_PAYLOAD 只传 labels.*.name 数组；allowlist 与未知/冲突标签的 fail-loud 在
# shared/agent.ts。

on:
  pull_request_target:
    types: [labeled]

jobs:
  implement-pr:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Refuse closed PR
        if: github.event.pull_request.state != 'open'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run: PR #${PR_NUMBER} is not open."

      - name: Transition labels
        if: github.event.pull_request.state == 'open'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        if: github.event.pull_request.state == 'open'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare branch
        if: github.event.pull_request.state == 'open'
        run: |
          git fetch origin main:main || git fetch origin main
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        if: github.event.pull_request.state == 'open'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: github.event.pull_request.state == 'open'
        run: npm ci

      - name: Typecheck agent-workflows
        if: github.event.pull_request.state == 'open'
        run: npm run typecheck

      # pull_request_target 的 label 事件快照在 if 条件里评估不可靠；与 agent-review.yml
      # 同型改运行时实读当前 PR labels，grep -qx 精确匹配（区分大小写），和 TS registry
      # 的 allowlist 精确查表同一口径；不用 contains（大小写不敏感）。
      - name: Detect model route
        if: github.event.pull_request.state == 'open'
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'agent:model:deepseek-v4-pro'; then
            echo "use_deepseek=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_deepseek=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code (default route)
        if: github.event.pull_request.state == 'open' && steps.route.outputs.use_deepseek != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # DeepSeek 工蜂 = Prime Agent CLI（与 .sandcastle/Dockerfile 同版本/同 tarball）。
      - name: Install Prime Agent (DeepSeek v4-pro route)
        if: github.event.pull_request.state == 'open' && steps.route.outputs.use_deepseek == 'true'
        run: npm install -g https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/releases/v0.7.2/prime-agent-0.7.2.tgz

      # 两个 run step 互斥，只把所选模型的固定 Secret 注入进程 env；
      # 未选中的模型凭据不进入 agent 子进程，也不会被转发给 remote-child。
      - name: Run implement-PR agent (Claude default)
        if: github.event.pull_request.state == 'open' && steps.route.outputs.use_deepseek != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/implement-pr/implement-pr.ts

      - name: Run implement-PR agent (DeepSeek v4-pro)
        if: github.event.pull_request.state == 'open' && steps.route.outputs.use_deepseek == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/implement-pr/implement-pr.ts

      - name: Push branch
        if: github.event.pull_request.state == 'open' && success()
        run: |
          if [ "$(cat "${RUNNER_TEMP}/has_commits.txt")" != "true" ]; then
            echo "No commits to push."
            exit 0
          fi
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement-PR run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post thread replies
        if: github.event.pull_request.state == 'open' && success()
        env:
          REPLIES: ${{ runner.temp }}/implement_thread_replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Post inline comments
        if: github.event.pull_request.state == 'open' && success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_new_inline_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".[$i].path" "$COMMENTS")
            line=$(jq -r ".[$i].line" "$COMMENTS")
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f commit_id="$head_sha" \
              -f path="$path" \
              -F line="$line" \
              -f side="RIGHT" \
              -f body="$body"
          done

      - name: Post top-level comments
        if: github.event.pull_request.state == 'open' && success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_top_level_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      - name: Mark blocked on failure
        if: github.event.pull_request.state == 'open' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          # shellcheck disable=SC2016  # 反引号是评论正文里的 Markdown，不是命令替换
          printf '`agent:implement` PR run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && github.event.pull_request.state == 'open'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
