name: CI macOS

# #1394 根裁定 A：会话保留量读数（financial_session.rs 的 heap_probe：
#   Δmalloc_zone_statistics(NULL).size_in_use − Δsqlite3_memory_used）与 peer uid（getpeereid）
#   只在 macOS 实现。保留量读数是产品资源门（retained cap）的读数，产品不为 Linux 另设近似读数
#   （#804：同一判定不得在两个平台有两种读数），Linux 上诚实地 MissingDependency/拒绝。
#   因此依赖它们的 v3::financial_session（全部用例）在 ci.yml 的 Linux 步里 --skip，由本作业在
#   生产平台 macOS 上真跑；economic_session / session_transport / session_protocol 的库测试也在
#   这里全量执行一遍，其中的 macOS 专属分支只在这里覆盖（Linux 一侧见 ci.yml G-1 步）。
#
# 触发（私有库 macOS 分钟按 10 倍计费，不跟随每次 push）：
#   - push main 且改动命中下列路径（含本文件自身）；
#   - workflow_dispatch；
#   - 手动触发 ci.yml 时，ci.yml 的 macos-session 作业以 workflow_call 调用本文件，一次触发拿全套读数。
# 估时：冷缓存 debug 编译约 6–10 min，两步执行约 5–8 min（本机该模块 29 条 wall 283 s，3 核 runner 估计）。
on:
  workflow_dispatch:
    inputs:
      issue1716_real_s_only:
        description: '只跑 #1716 真实 S 内容域 cap 消费正控作业，跳过已有读数的 macos-session'
        type: boolean
        default: false
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'rust/src/bin/s_session_v3/financial_session*'
      - 'rust/src/economic_session/**'
      - 'rust/src/session_transport.rs'
      - 'rust/src/session_protocol.rs'
      - '.github/workflows/ci-macos.yml'

jobs:
  macos-session:
    if: ${{ !inputs.issue1716_real_s_only }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      # newchan_rust 依赖的 pyo3 0.23 最高支持 CPython 3.13；macos-latest 的默认 python3 已是 3.14，
      #   pyo3-ffi 的 build script 直接拒绝（run 38504744953 两步都在编译前失败）。钉 3.12，与本机
      #   构建所见版本一致（pyo3-build-config：version=3.12）。
      - name: Set up Python 3.12 for pyo3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # run-cargo-with-telemetry.sh 用的是 Linux 的 free/df -B1，本作业直接调用 cargo，只记录基础环境。
      - name: Record runner and toolchain
        run: |
          set -x
          echo "github_sha=$GITHUB_SHA"
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          rustc -vV
          cargo -V
          command -v python3
          python3 -VV
          df -h .

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-

      - name: cargo test — v3::financial_session（macOS 保留量读数与 peer uid，#1394 根裁定 A）
        run: cargo test --locked --features s_session --bin s_structure_session v3::financial_session

      - name: cargo test — economic_session / session_transport / session_protocol 库测试（#1394 G-1）
        if: always()
        run: cargo test --locked --features s_session --lib -- economic_session session_transport session_protocol

      # #1716：tb03b-finance/4 内容域 cap 激活。economic-session/2 要求 E、B:alpha、B:beta 各占一个本地
      #   可写固定容量 HFS+ 卷（store.rs 载体门）；按 #1394 已批载体合同各建一个 24 MiB 临时镜像
      #   （容量约 25 MB，低于已批 max_staged_bytes 32153600）。先跑 Rust 内容域测试，再用同一批原件
      #   跑 E 正式服务进程的 SIGKILL 恢复驱动；原件上传为 artifact，镜像用后卸载。
      - name: "cargo test + 服务故障 — #1716 tb03b-finance/4 内容域 cap 激活（三个临时固定容量 HFS+ 卷）"
        if: always()
        run: |
          root=/tmp/tb1716-hfs
          rm -rf "$root"; mkdir -p "$root/fixtures" "$root/evidence"
          detach_all() {
            for owner in e alpha beta; do
              [ -d "$root/$owner" ] && cp -p "$root/$owner"/*.db* "$root/evidence/" 2>/dev/null
              [ -d "$root/$owner" ] && hdiutil detach "$root/$owner" -force || true
            done
          }
          trap detach_all EXIT
          carriers=""
          for owner in e alpha beta; do
            hdiutil create -size 24m -fs HFS+ -volname "tb1716-$owner" -type UDIF "$root/$owner.dmg"
            mkdir "$root/$owner"
            hdiutil attach "$root/$owner.dmg" -mountpoint "$root/$owner" -nobrowse
            carriers="$carriers${carriers:+:}$root/$owner"
          done
          mount | grep tb1716 || true
          df -k "$root/e" "$root/alpha" "$root/beta" | tee "$root/evidence/df.txt"
          TB03B_TEST_ROOT="$root/fixtures" TB1716_HFS_CARRIERS="$carriers" \
            cargo test --locked --features s_session --lib -- --ignored --exact \
            economic_session::finance::tests::content_domain_cap_activation_on_fixed_carriers --nocapture
          cargo build --locked --features s_session --bin e_economic_session --bin b_chong_session
          shasum -a 256 target/debug/e_economic_session target/debug/b_chong_session | tee "$root/evidence/binaries.sha256"
          python3 -B ../s_session/tests/tb03b_cap_service_faults.py --fixtures "$root/fixtures" \
            --carriers "$carriers" --binaries target/debug --output "$root/service-faults"

      - name: "Upload #1716 内容域原件"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1716-content-domain-${{ github.sha }}
          path: |
            /tmp/tb1716-hfs/fixtures
            /tmp/tb1716-hfs/service-faults
            /tmp/tb1716-hfs/evidence
          if-no-files-found: warn

  # #1716 /4 正控：S 侧单 bar 真实 S3 夹具导出库（#1717 PR #1736 同一导出测试），测试内起停 release
  #   s_structure_session 的 financial-serve 只读会话；manifest 冻结 SessionClosure 读法，reader_resources 八项与
  #   E/B response_timeout_ms 3000 保持原值。两 B Prepare 后 E 激活 cap 版本 2，Reserve 实际消费该版本。
  #   E、B:alpha、B:beta 各占一个 24 MiB 临时 HFS+ 卷（同上）。原件（会话回执、stdout/stderr、证据 JSON）总上传。
  #   随后同一批卷上以 debug E/B 正式服务进程经 Unix socket 消费同一新 cap（含 E Reserve、B:alpha Commit 提交后
  #   SIGKILL 的新进程恢复），卸载前把三卷原库复制进 work/carrier-dbs 一并上传。
  issue1716-real-s:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 for pyo3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-

      - name: cargo test — issue 1716 真实 S 内容域 /4 cap 消费正控（单 bar 会话读法，三个临时固定容量 HFS+ 卷）
        run: |
          root="$RUNNER_TEMP/tb1716-real-s"
          mkdir -p "$root/work" "$root/s3" "$root/mnt"
          detach_all() {
            for owner in e alpha beta; do
              mkdir -p "$root/work/carrier-dbs/$owner"
              [ -d "$root/mnt/$owner" ] && cp -p "$root/mnt/$owner"/*.db* "$root/work/carrier-dbs/$owner/" 2>/dev/null || true
              [ -d "$root/mnt/$owner" ] && hdiutil detach "$root/mnt/$owner" -force || true
            done
          }
          trap detach_all EXIT
          carriers=""
          for owner in e alpha beta; do
            hdiutil create -size 24m -fs HFS+ -volname "tb1716-$owner" -type UDIF "$root/mnt/$owner.dmg"
            mkdir "$root/mnt/$owner"
            hdiutil attach "$root/mnt/$owner.dmg" -mountpoint "$root/mnt/$owner" -nobrowse
            carriers="$carriers${carriers:+:}$root/mnt/$owner"
          done
          df -k "$root/mnt/e" "$root/mnt/alpha" "$root/mnt/beta"
          TB1717_S_EXPORT="$root/s3/export.json" cargo test --locked --features s_session --bin s_structure_session -- \
            --ignored --exact v3::financial_session::tests::export_real_s3_fixture_for_economic_content_domain
          cargo build --release --locked --features s_session --bin s_structure_session
          ls -l target/release/s_structure_session
          TB03B_TEST_ROOT="$root/work" TB1716_HFS_CARRIERS="$carriers" TB1716_S_EXPORT="$root/s3/export.json" \
            TB1716_S_BINARY="$PWD/target/release/s_structure_session" \
            cargo test --locked --features s_session --lib -- --ignored --exact --nocapture \
            economic_session::finance::tests::real_s::content_domain_activated_cap_consumed_by_real_s_reserve
          cargo build --locked --features s_session --bin e_economic_session --bin b_chong_session
          ls -l target/debug/e_economic_session target/debug/b_chong_session
          TB03B_TEST_ROOT="$root/work" TB1716_HFS_CARRIERS="$carriers" TB1716_S_EXPORT="$root/s3/export.json" \
            TB1716_S_BINARY="$PWD/target/release/s_structure_session" TB1716_ECON_BINARIES="$PWD/target/debug" \
            cargo test --locked --features s_session --lib -- --ignored --exact --nocapture \
            economic_session::finance::tests::real_s::content_domain_activated_cap_consumed_through_formal_sockets

      - name: 上传 issue 1716 /4 消费正控原件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1716-real-s-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tb1716-real-s/work
            ${{ runner.temp }}/tb1716-real-s/s3
          if-no-files-found: warn
