            sequence_ops_match_approved_independent_vector \
            sequence_ops_match_write_sequence_oracle_across_shapes \
            sequence_empty_result_is_persisted_and_readable \
            sequence_concat_empty_and_split_boundaries \
            sequence_split_then_concat_restores_root \
            sequence_ops_write_only_reachable_nodes \
            sequence_split_at_canonical_boundary_writes_nothing \
            sequence_rejects_wrong_nodes_and_lengths \
            sequence_concat_rejects_length_overflow_on_repeated_subtree \
            sequence_ops_stay_within_hard_bounds_on_repeated_subtree \
            sequence_hard_bound_is_enforced_negative_control \
            sequence_ops_read_and_write_scale_with_height \
            sequence_rebuild_suffix_matches_elementwise_append_and_writes_only_reachable \
            sequence_rebuild_suffix_rejects_keep_beyond_count
          if [[ "$FEATURES" == s_session ]]; then
            require_passed sequence \
              sequence_allocation_entry_refuses_unsupported_owned_build_without_plain_fallback \
              sequence_rebuild_suffix_allocation_entry_refuses_unsupported_owned_build_without_plain_fallback
          else
            require_passed sequence \
              local_memo_allocation::owned_sequence_independent_vectors_cut_join_and_append_match_plain_bytes_and_trace \
              local_memo_allocation::owned_sequence_compressed_noncanonical_cut_grow_and_source_errors_release_local_memo \
              local_memo_allocation::owned_sequence_bad_nodes_preserve_first_error_and_read_order \
              local_memo_allocation::owned_rebuild_suffix_matches_independent_vectors_plain_trace_and_reachable_nodes \
              local_memo_allocation::owned_rebuild_suffix_matches_write_sequence_across_replacement_shapes \
              local_memo_allocation::owned_rebuild_suffix_stack_grow_refusal_and_source_sink_errors_release_to_baseline \
              local_memo_allocation::owned_rebuild_suffix_rejects_corrupt_deep_reused_subtrees_and_terminal
          fi
          run_suite memo --bin s_structure_session v3::generation::tests::sequence_
          require_passed memo \
            v3::generation::tests::sequence_sync_plain_matches_full_oracle_and_writes_only_reachable \
            v3::generation::tests::sequence_sync_plain_errors_preserve_keys_and_root_without_full_fallback
          if [[ "$FEATURES" == s_session ]]; then
            require_passed memo v3::generation::tests::sequence_keys_some_without_owned_build_refuses_plain_fallback
          else
            require_passed memo \
              v3::generation::tests::sequence_sync_owned_matches_full_oracle_and_writes_only_reachable \
              v3::generation::tests::sequence_sync_owned_errors_release_stack_and_preserve_keys_and_root \
              v3::generation::tests::sequence_sync_rebuild_stack_uses_keys_ledger_and_propagates_refusal_until_discard \
              v3::generation::tests::sequence_keys_empty_sync_freezes_actual_mode_and_same_ledger_until_discard \
              v3::generation::tests::sequence_keys_owned_growth_counts_old_and_new_blocks_preserves_failure_and_drops_on_discard \
              v3::generation::tests::sequence_keys_first_reserve_or_node_failure_does_not_freeze_ledger_and_plain_discard_reuses_capacity
          fi
          run_suite oracle --bin s_structure_session v3::generation::tests::oracle_
          require_passed oracle \
            v3::generation::tests::oracle_prefix_parity_two_prefixes \
            v3::generation::tests::oracle_historical_revision_parity \
            v3::generation::tests::oracle_incremental_second_generation_parity
          run_suite prepared --bin s_structure_session v3::prepared::tests::real_nonempty_commits_bind_history_and_revision_to_true_control_and_sources
          require_passed prepared v3::prepared::tests::real_nonempty_commits_bind_history_and_revision_to_true_control_and_sources
      # #1488：固定 metadata 字段增量的 20 个新锁；Plain 适用 10 个，Owned 必须全部具名执行。
      # 与既有序列步骤独立，即使旧锁失败仍收本片证据；任何一步失败仍保留 job 红态。
      - name: Run fixed candidate, commit rollback and shared path locks (#1488)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          sha256sum src/s_content/path.rs src/bin/s_session_v3/object_index.rs src/bin/s_session_v3/prepared.rs src/bin/s_session_v3/generation.rs
          case "$FEATURES" in
            s_session|s_session,s_allocation_json_testonly) ;;
            *) echo "::error::Unexpected fixed-field feature set: $FEATURES"; exit 1 ;;
          esac
          run_logged() {
            local phase=$1
            shift
            set +e
            "$@" 2>&1 | tee "$RUNNER_TEMP/1488-$phase.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            echo "phase=$phase command_exit_code=${statuses[0]} tee_exit_code=${statuses[1]}"
            printf 'phase=%s command_exit_code=%s tee_exit_code=%s\n' "$phase" "${statuses[0]}" "${statuses[1]}" >> "$RUNNER_TEMP/1488-exit-codes.log"
            if (( statuses[0] != 0 )); then return "${statuses[0]}"; fi
            return "${statuses[1]}"
          }
          run_suite() {
            local suite=$1 filter=$2 binary
            shift 2
            run_logged "$suite-build" cargo test --offline --locked -j 6 --features "$FEATURES" --no-run --message-format=json "$@"
            binary=$(python3 - "$RUNNER_TEMP/1488-$suite-build.log" <<'PY'
          import json, os, pathlib, sys
          artifacts = set()
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (item.get("reason") == "compiler-artifact"
                      and item.get("profile", {}).get("test")
                      and item.get("executable")):
                  artifacts.add(item["executable"])
          if len(artifacts) != 1:
              raise SystemExit(f"expected one test executable, got {sorted(artifacts)}")
          binary = pathlib.Path(artifacts.pop()).resolve()
          target = pathlib.Path(os.environ["CARGO_TARGET_DIR"]).resolve()
          if not binary.is_relative_to(target) or not binary.is_file() or not os.access(binary, os.X_OK):
              raise SystemExit("test executable is absent or outside this job target")
          print(binary)
          PY
            )
            sha256sum "$binary" > "$RUNNER_TEMP/1488-$suite-binary.log"
            cat "$RUNNER_TEMP/1488-$suite-binary.log"
            run_logged "$suite-list" "$binary" "$filter" --list --format pretty
            run_logged "$suite" "$binary" "$filter" --format pretty --color never --show-output
            sha256sum --check "$RUNNER_TEMP/1488-$suite-binary.log"
          }
          require_passed() {
            local suite=$1 test_name
            shift
            for test_name in "$@"; do
              grep -Fx "$test_name: test" "$RUNNER_TEMP/1488-$suite-list.log" || {
                echo "::error::Missing listed test in $suite: $test_name"
                return 1
              }
              grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/1488-$suite.log" || {
                echo "::error::Missing passed test in $suite: $test_name"
                return 1
              }
            done
          }
          run_suite fixed-bin fixed_ --bin s_structure_session
          require_passed fixed-bin \
            v3::object_index::tests::fixed_candidate_plain_wire_trigger_corrupts_generated_then_late_exact_refuses \
            v3::object_index::tests::fixed_candidate_plain_second_object_failure_rolls_back_and_retries_full_plan \
            v3::object_index::tests::fixed_candidate_plain_same_entry_full_nodes_and_actual_reads_as_legacy \
            v3::object_index::tests::fixed_candidate_plain_reidentified_metadata_slot_schema_and_late_null_refuse \
            v3::object_index::tests::fixed_candidate_multiple_fault_first_error_matches_legacy_before_wire \
            v3::object_index::tests::fixed_candidate_plain_fresh_generated_deep_leaf_and_independent_internal_refuse \
            v3::prepared::tests::fixed_fields_plain_four_real_commits_match_legacy_all_rows_nodes_receipts_and_roots \
            v3::prepared::tests::fixed_fields_plain_real_second_commit_fk_failure_rolls_back_every_persistent_row
          if [[ "$FEATURES" == s_session,s_allocation_json_testonly ]]; then
            require_passed fixed-bin \
              v3::object_index::tests::fixed_candidate_owned_wire_trigger_corrupts_generated_then_late_exact_refuses \
              v3::object_index::tests::fixed_candidate_owned_second_object_failure_rolls_back_and_retries_full_plan \
              v3::object_index::tests::fixed_candidate_owned_same_entry_full_nodes_actual_reads_and_release \
              v3::object_index::tests::fixed_candidate_owned_reidentified_metadata_slot_schema_and_late_null_refuse \
              v3::object_index::tests::fixed_candidate_owned_fresh_generated_deep_leaf_and_independent_internal_refuse \
              v3::object_index::tests::fixed_candidate_owned_retained_text_and_clone_charge_original_not_foreign_ledger \
              v3::object_index::tests::fixed_candidate_owned_scalar_refusal_releases_all_local_owners_without_fallback \
              v3::prepared::tests::fixed_fields_owned_four_real_commits_match_legacy_all_rows_nodes_receipts_and_roots \
              v3::prepared::tests::fixed_fields_owned_real_second_commit_fk_failure_rolls_back_every_persistent_row
          fi
          run_suite fixed-path s_content::path::fixed_fields_tests --lib
          require_passed fixed-path \
            s_content::path::fixed_fields_tests::fixed_fields_exact_matches_existing_refs_and_rejects_before_read_above_bound \
            s_content::path::fixed_fields_tests::fixed_metadata_missing_errors_follow_consumption_order_not_schema_scan
          if [[ "$FEATURES" == s_session,s_allocation_json_testonly ]]; then
            require_passed fixed-path s_content::path::fixed_fields_tests::fixed_fields_owner_full_capacity_has_zero_global_allocations_and_zero_ledger_delta
          fi
      # #1488 A/B/C：独立冻结包只组合验证，不注册生产 Runtime 增量入口。
      - name: Compile and run exact A B C locks (#1488)
        if: ${{ !cancelled() }}
