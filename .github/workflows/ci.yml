name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # #324：LFS 对象**不在** checkout 里拉（不写 lfs: true）。
        #   .chanlun/block-topology/relations.jsonl 是 125 MB 的 LFS 对象；
        #   GitHub 免费额度 = 1 GB/月 LFS 流量 ⟹ lfs: true 每 run 必下 125 MB，
        #   约 8 run 就把整月额度打爆，且 checkout 发生在 cache 恢复之前，
        #   缓存永不命中。改成 checkout(不拉) → 恢复 .git/lfs 缓存 → git lfs pull：
        #   缓存命中时 pull 零下载，仅缓存 miss（LFS 指针变更）时才走一次 125 MB。

      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          # 指针内容变了才重下：relations.jsonl 的 LFS pointer 哈希即对象身份。
          key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}-${{ hashFiles('.chanlun/block-topology/relations.jsonl') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Fetch LFS objects
        # pull 失败时 relations.jsonl 停留为 pointer；tests/conftest.py 的
        # real_relations_usable 守卫会显式 skip 并打印原因，不会静默通过。
        continue-on-error: true
        run: git lfs pull

      - name: Grep gate — window-binding artifacts banned (G1)
        run: '! grep -rn "P101_TAG\|P101_MULTI\|cert_bsp_tag" rust/src/theta_v0/'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # #297：nautilus_trader 的 manylinux wheel 单体 182.5 MB，冷装占安装段大头。
          #   pip 的 HTTP cache 兜住它 ⟹ 二次跑起该 wheel 不再走网络。
          cache: pip
          cache-dependency-path: pyproject.toml

      # #297：newchan_rust 是本仓 rust/ 的 PyO3 扩展（maturin backend，
      #   rust/Cargo.toml crate-type = ["cdylib","rlib"]）。默认 feature 的依赖树只有
      #   28 个 crate（nautilus-* 全是 optional，仅 nautilus/backtest_bin feature 才拉），
      #   本机 macOS arm64 实测冷编译（registry 已暖）11.7s、target 产物 92 MB。
      #   ⟹ 缓存 registry + target 后二次跑接近零成本；CI ubuntu 2 核未实测，
      #   照实预估首跑 1.5–3 min（含 crates.io 下载 + maturin wheel 拉取）。
      #   前提：GitHub 托管 ubuntu runner 镜像自带 Rust 工具链（cargo/rustc stable），
      #   本步不另装；若某天镜像去掉 Rust，这里需补 rust-toolchain 安装步。
      - name: Cache cargo (registry + newchan_rust target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/newchan-rust-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        # #297 collection error 双真因（票体误并为一因，这里分列）：
        #   (1) tests/test_trading_system_skeleton.py
        #       → trading_system/execution/__init__.py → lmt_executor.py:18 顶层
        #         `from nautilus_trader.model.enums import ...` ⟹ 需 nautilus_trader。
        #       nautilus_trader **不在本仓**（.gitignore:93 明写 /nautilus_trader/ 是上游
        #       独立克隆，不作子模块入库），必须从 PyPI 装。
        #   (2) tests/test_topology/test_cross_national_pipeline.py
        #       → src/newchan/topology/cross_national_pipeline.py:39 顶层 `import newchan_rust`
        #       ⟹ 需本仓 rust/ 的 PyO3 扩展，与 nautilus 无关。
        #
        # 装法取舍（两案，取 A）：
        #   A. 预编 wheel（本步采用）——PyPI 已发 cp313 manylinux_2_35_x86_64 wheel
        #      （1.229.0，182.5 MB；ubuntu-latest glibc ≥ 2.35 满足），一行 pip install
        #      即可，**完全绕开 nautilus 的 Rust 源码编译**。
        #   B. 源码编译（未采用）——sdist 9 MB，但要拉 nautilus 全 Rust workspace，
        #      CI 上分钟级到十分钟级，无收益。
        #   版本锁 1.229.0：对齐本机上游克隆 ~/Projects/NewChanlun/nautilus_trader 的版本，
        #   避免 CI 随 PyPI 最新版（现 1.230.0）漂移。requires-python <3.15,>=3.12 与本 job 的 3.13 相容。
        #
        # 本机实测耗时（macOS arm64 / Python 3.13.9 / pip cache 暖；CI ubuntu 2 核会更慢）：
        #   pip install -e ".[test]"            1m16s
        #   pip install nautilus_trader==1.229  17.7s（含 156 MB macOS wheel 下载）
        #   pip install ./rust（maturin 冷编）   11.7s
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "nautilus_trader==1.229.0"
          CARGO_TARGET_DIR="$HOME/.cache/newchan-rust-target" pip install ./rust

      - name: Build and install newchan_rust extension
        run: pip install ./rust

      - name: Run tests with coverage
        # -rs 是 #324 的 090 要求：显式打印 skip 原因。
        run: pytest -m "not slow" --tb=short -q -rs --cov=newchan --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # #438：`cargo check --all-targets` 对 `required-features = ["backtest_bin"]`
  # 的 9 个 bin 是静默跳过（不报错不警告），曾造成合并后终态验证"全绿"却掩盖
  # 3×E0432 真实编译错误（#295 修复从未到达 main 即为一例）。本 job 补上被跳过
  # 的那一半验收面，使"required-features 的 bin 未被任何标准命令编译过"这类
  # 假绿在结构上不可再发生——无需人记得多带一个 flag。
  #
  # 覆盖边界（诚实披露，非本 job 职责；#471 于 2026-07-27 终态复验）：
  #   - 本 job 只保证「会被编译」，不保证「编译通过」。
  #   - 当前实测阻断：零。
  #   - 历史阻断（仍列出以闭合披露谱系，当前已修复）：
  #     1) `p108_interval_probe::main` 曾按结构字段读取枚举化后的 `OwnerRef`，
  #        产生 2×E0609（#470，af4d864c02，已修复，复验不再出现）。
  #     2) `econ_oddeven_diagnosis::collect_signals` 曾沿用旧 `LevelState` 初始化与
  #        `Rc<Vec<_>>` 访问方式，产生 E0277、2×E0308、E0063
  #        （#471，已修复，复验不再出现）。
  #     3) `pi_bsp_timing_cli_args_tests` 曾被当作独立 bin crate 编译，crate 根的
  #        `use super::{parse_cli_args, CliArgs}` 产生 E0433，且缺 `main` 产生 E0601；
  #        这是 default-targets 级阻断（#468，44a20222c4，已修复，复验不再出现）。
  #     4) `pure_bsp_timing::main` 对 `LevelState::bsp` 的旧迭代方式曾产生 E0277
  #        （#311，已修复，复验不再出现）。
  #     5) `pi_theta_fill_loop_overlay` 消费的 `coverage::TwStepCtx` re-export
  #        曾被误标 `#[cfg(test)]`，产生 E0422（#452，已修复，复验不再出现）。
  #   - 因此当前本 job 预期全绿；若 required-features 面再漂移，将从
  #     "静默跳过"变成"可见地失败"，并让修复状态随复验同步更新。
  rust-check:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Test cargo telemetry wrapper (#1141)
        run: ../.github/scripts/test-run-cargo-with-telemetry.sh

      - name: Record runner, toolchain, linker, and initial resources (#1141)
        run: |
          set -x
          echo "github_sha=$GITHUB_SHA"
          echo "runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH"
          echo "image_os=${ImageOS:-unset} image_version=${ImageVersion:-unset} image_release=${ImageRelease:-unset}"
          cat /etc/os-release
          uname -a
          rustc -vV
          cargo -V
          rustup show active-toolchain
          command -v cc
          readlink -f "$(command -v cc)"
          cc --version
          rust_sysroot="$(rustc --print sysroot)"
          rust_host="$(rustc -vV | awk '/^host:/ {print $2}')"
          rust_lld="$rust_sysroot/lib/rustlib/$rust_host/bin/rust-lld"
          if test -x "$rust_lld"; then
            "$rust_lld" -flavor gnu --version
          else
            echo "bundled_rust_lld=not-found path=$rust_lld"
          fi
          if command -v ld.bfd; then
            ld.bfd --version
          fi
          printf 'fn main() {}\n' > "$RUNNER_TEMP/rust-linker-probe.rs"
          rustc --print link-args "$RUNNER_TEMP/rust-linker-probe.rs" -o "$RUNNER_TEMP/rust-linker-probe"
          nproc
          lscpu
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      # #1141：三轮都在 default-target test 链接阶段失败，且受害 bin 每轮漂移；
      # run 32315548218 在 rust-lld signal 7 后明确报 ENOSPC。根因是磁盘耗尽，
      # 不是已证实的固定对象损坏或 rust-lld regression。处置只压低磁盘峰值：
      # 不恢复 target、不生成 incremental、两档测试串行；runner/toolchain/linker 不钉死。
      - name: Cache cargo registry + git only (#1141)
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-

      - name: Record cache result and post-cache resources (#1141)
        run: |
          echo "cache_primary_key=${{ runner.os }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}"
          echo "cache_hit=${{ steps.cargo-cache.outputs.cache-hit }}"
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      - name: cargo check — default targets（required-features 未启用的 bin 不在内）
        run: |
          set -x
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true
          cargo check --all-targets
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      - name: cargo check — backtest_bin feature（#438：闭合 required-features 盲区）
        run: |
          set -x
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true
          cargo check --all-targets --features backtest_bin
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      - name: cargo fmt --check（#611：归零后防回潮）
        run: |
          set -x
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true
          rustup component add rustfmt
          cargo fmt --all -- --check
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      # #810：`cargo check` 只保证编译、从不执行——34 个 Lean↔Rust parity 断言与
      # `rust/tests/nest_isolation_guard.rs` 的「违规即测试红」此前只编译不运行，
      # 锁形同虚设（成因定案见 #799 净发现①、#806）。
      #
      # #993 已把历史上的两条 parity 失败修绿；当前本步预期全绿，任何失败都是真回归。
      # 本候选尚未完成两次远端 workflow_dispatch 验证，也没有当前 runner 上的可靠耗时；
      # 须逐轮记录 rust-check job 与两档 cargo test 的实际耗时，再据此裁 timeout。
      # 既有 #[ignore]（theta_v0_fixture_drift、profile_*、oddeven_*_diagnosis 等
      # 需要 BTC 全量数据或 --release 的用例）维持现状，不在 #810 范围内摘除。
      # #1404：成员来源回归先执行，避免已登记的默认域失败使本片新锁被跳过。
      - name: cargo test — TB-02-C member source binding
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --bin s_structure_session tb02c_member_relations_bind_only_the_member_sources --jobs 1

      - name: cargo test — default targets
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --all-targets --jobs 1

      # #1370：s_session 的 required-features 不在 default/backtest_bin 中启用。
      # 运行正式 S bin 的回归测试，不能只编译或以默认目标的通过代替。
      # 默认目标一步带着已登记的既有红（main 上 3 个），失败会让其后各步被跳过；
      #   本步此前因此从未在 CI 执行，照本文件既有写法加 if: always()。
      # #1394 根裁定 A：v3::financial_session 依赖只在 macOS 实现的会话保留量读数（heap_probe）与
      #   peer uid（getpeereid），Linux 上 Session::start 诚实地报 MissingDependency。这批用例在本步
      #   --skip，由 .github/workflows/ci-macos.yml 的 macOS 作业在生产平台真跑（手动触发本 CI 时经
      #   下方 macos-session 作业一并执行；push main 由该文件自身的 paths 过滤触发）。
      - name: cargo test — s_session 正式结构会话（#1370）
        if: always()
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --bin s_structure_session --jobs 1 -- --skip v3::financial_session

      # #1394 C：内容编码在 s_session feature 下供多个 owner 共用；只测 S bin 不会执行库测试。
      # #1394 整合 C-1：本步与下一步不依赖「default targets」与 s_session bin 两步的结果；
      #   已登记的默认域既有红会让这两步被跳过，故照本文件既有写法加 if: always()。
      #   job 结论仍由失败的那一步决定，本条不掩盖它。
      - name: cargo test — 完整内容编码与共享图校验（#1394）
        if: always()
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --lib --jobs 1 s_content

      - name: cargo test — 内容向量、持久序列与累计资源（#1394）
        if: always()
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --test s_content_contract --test s_content_sequence --test s_content_job --test s_content_path --jobs 1

      # #1394 G-1：economic_session（含 P-14 读法锁、finance、content_store、store、finance_transport）
      #   与 session_transport / session_protocol 的库测试此前没有任何 CI 步执行。2026-10-14 在 Linux
      #   （glibc 2.36 容器）实跑：74 过、7 忽略（需 HFS 载体或外部夹具）、0 败，无需 --skip；只在 macOS
      #   编译的 1 条（half_close_during_large_frame_drain_observes_actual_eof）与各 macOS 专属分支由
      #   ci-macos.yml 作业覆盖。
      - name: cargo test — economic_session / session_transport / session_protocol 库测试（#1394 G-1）
        if: always()
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --lib --jobs 1 -- economic_session session_transport session_protocol

      # #1394/#1481：s_capture_native_testonly 特性下才编译的测试（2026-10-14 计：lib 26、S bin 174）此前从未编译、
      #   从未执行（state.rs 测试调用漏传 cfg 参数，开特性即 E0061）。只跑「开特性后新增」的测试，其余同名同体测试
      #   已在上面 s_session 步执行；新增集合为空即失败。本机端到端（四次编译加执行）约 9 min；CI 估 20–25 min。
      - name: cargo test — s_capture_native_testonly 特性新增的测试（#1394）
        if: always()
        run: ../.github/scripts/run-cargo-with-telemetry.sh ../.github/scripts/test-feature-delta.sh s_capture_native_testonly

      # #1394 整合（根裁定 A）：v3 history 的 Owned 文本/分配原型用例只在 s_allocation_json_testonly
      #   构建编译；只编译不执行的锁按无锁计（#799），故单列一步执行。不依赖前面各步的产物。
      - name: cargo test — v3 history Owned 分配原型（s_allocation_json_testonly，#1394）
        if: always()
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session,s_allocation_json_testonly --bin s_structure_session v3::history --jobs 1

      - name: cargo test — backtest_bin feature（econ_oddeven_diagnosis.rs 仅在此 feature 下编译）
        if: always()
        # 2026-08-16 磁盘实撞（#993 收口轮）：三轮 runner 爆盘（No space left on device）——
        # --all-targets 在 feature 下额外编 56 个探针 bin 的 test 目标（各链 nautilus 套件，
        # 本地实测 debug 全 target 55G ⟹ 14G 盘必爆）。改 --lib：backtest 模块测试（含
        # econ_oddeven_diagnosis）全在 lib 内；tests/ 与 bins 已由 default 步覆盖——零覆盖损失。
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --lib --features backtest_bin --jobs 1

  # #1406 C7a：已审 WE-5 驱动的六轨真实 E/B 运行，独立于其它 Rust job。
  # 仅本次专属分支显式 dispatch 时运行；失败不重试，不变更冻结输入或驱动原时限。
  c7a-runtime-1406:
    name: "#1406 C7a 六轨与 Resolve 恢复"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1406-c5-ci-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache cargo registry + git only (#1406 C7a)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Record toolchain and runner resources (#1406 C7a)
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          cargo -V
          rustup show active-toolchain
          free -b
          df -B1 -T /tmp
      - name: Build real E/B binaries and run six C7a trajectories (#1406)
        run: python3 -B .github/scripts/run-c7a-remote.py --artifacts "$RUNNER_TEMP/c7a-artifacts"
      - name: Upload C7a build, runtime and recovery evidence (#1406)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1406-c7a-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c7a-artifacts/
          if-no-files-found: error

  # #1406 C5 v4：普通整库步之外单独执行固定 HFS ignored 锁；不扩大源码尾差白名单。
  c5-hfs-1406:
    name: "#1406 C5 固定 HFS checkpoint 与失败清理"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1406-c5-ci-20261015'
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache cargo registry + git only (#1406 C5 HFS)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-
      - name: Compile, run exact HFS lock, detach and preserve raw image (#1406 C5)
        timeout-minutes: 33
        shell: bash
        run: |
          python3 -B - <<'PY'
          """#1406 C5：仅 GitHub macOS runner 执行的固定 HFS 具名锁监督器。"""
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import runpy
          import shutil
          import signal
          import stat
          import subprocess
          import sys
          import tempfile
          import time

          TEST = "economic_session::content_store::tb03c_c5_stage_tests::c5_h2_real_hfs_checkpoint_failure_keeps_committed_cleanup_list_and_reconciles"
          MIB = 1024 * 1024
          ACTIVE_SECONDS = 1500
          CLEANUP_END_SECONDS = 1860
          ARCHIVE_END_SECONDS = 1920
          RECEIPT_END_SECONDS = 1950
          GROUP_SECONDS = 15
          # step 1980s / job 2100s：最终回执后分别另留 30s / 150s，不借给活跃工作。
          ARCHIVE = r'''
          import hashlib, json, pathlib, shutil, stat, sys
          image, folder = map(pathlib.Path, sys.argv[1:3])
          metadata = json.loads(sys.argv[3])
          if not stat.S_ISREG(image.lstat().st_mode):
              raise RuntimeError("image is not a regular file")
          def sha(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          folder.mkdir()
          before = sha(image)
          destination = folder / "carrier.dmg"
          with image.open("rb") as source, destination.open("xb") as target:
              shutil.copyfileobj(source, target, 1024 * 1024)
          if sha(destination) != before or sha(image) != before:
              raise RuntimeError("detached image bytes changed")
          with (folder / "MANIFEST.json").open("x") as stream:
              json.dump({**metadata, "sha256": before, "bytes": destination.stat().st_size}, stream)
              stream.write("\n")
          '''
          INVENTORY = r'''
          import hashlib, json, pathlib, sys
          root, excluded = pathlib.Path(sys.argv[1]), sys.argv[2]
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and not path.name.startswith(excluded):
                  with path.open("rb") as stream:
                      sha = hashlib.file_digest(stream, "sha256").hexdigest()
                  rows.append({"path": str(path.relative_to(root)), "sha256": sha, "bytes": path.stat().st_size})
          with (root / "evidence/ARTIFACTS.json").open("x") as stream:
              json.dump(rows, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          '''
          # guardian 在实际命令结束后仍存活；主监督器从不 poll/reap 它，直到自有组清理完。
          GUARD = r'''
          import json, pathlib, signal, subprocess, sys
          receipt = pathlib.Path(sys.argv[1])
          result = {"exit_code": None, "error": None}
          try:
              result["exit_code"] = subprocess.run(sys.argv[2:], check=False).returncode
          except BaseException as error:
              result["error"] = repr(error)
          temporary = receipt.with_suffix(".tmp")
          with temporary.open("x") as stream:
              json.dump(result, stream)
          temporary.replace(receipt)
          while True:
              signal.pause()
          '''


          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)


          def save(path, value):
              with path.open("x") as stream:
                  json.dump(value, stream, ensure_ascii=False, indent=2)
                  stream.write("\n")


          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()


          def budget_left(deadline, maximum, label):
              value = deadline - time.monotonic()
              require(value > 0, label + " 期限耗尽")
              return min(maximum, value)


          def members(group, deadline):
              raw = subprocess.check_output(["ps", "-axo", "pid=,pgid=,stat=,rss="], text=True,
                                            timeout=budget_left(deadline, 5, "进程清单"))
              require(time.monotonic() < deadline, "进程清单在期限后返回")
              result = []
              for line in raw.splitlines():
                  pid, pgid, state, rss = line.split()
                  if int(pgid) == group:
                      result.append({"pid": int(pid), "pgid": int(pgid), "state": state, "rss_kib": int(rss)})
              return result


          def cleanup_group(proc, completed, deadline):
              report = {"complete": False, "events": [], "errors": [], "descendants_after_command": []}
              try:
                  before = members(proc.pid, deadline)
                  if completed:
                      report["descendants_after_command"] = [r for r in before if r["pid"] != proc.pid]
                  for sig in (signal.SIGTERM, signal.SIGKILL):
                      live = [r for r in members(proc.pid, deadline) if not r["state"].startswith("Z")]
                      if not live:
                          break
                      report["events"].append({"signal": int(sig), "members": live})
                      try:
                          os.killpg(proc.pid, sig)
                      except ProcessLookupError:
                          pass
                      until = min(time.monotonic() + 3, deadline)
                      while time.monotonic() < until:
                          if not any(not r["state"].startswith("Z") for r in members(proc.pid, deadline)):
                              break
                          time.sleep(budget_left(deadline, 0.05, "组清理"))
                  remaining = members(proc.pid, deadline)
                  require(not any(not r["state"].startswith("Z") for r in remaining), "自有进程组仍有活进程")
                  # 非直属后代由 macOS launchd 回收；先核它们消失，再 reap 仍保留身份的 guardian。
                  until = min(time.monotonic() + 3, deadline)
                  while any(r["pid"] != proc.pid for r in remaining) and time.monotonic() < until:
                      time.sleep(budget_left(deadline, 0.05, "组清理"))
                      remaining = members(proc.pid, deadline)
                  require(not any(r["pid"] != proc.pid for r in remaining), "自有后代尚未回收")
                  report["guardian_exit"] = proc.wait(timeout=budget_left(deadline, 2, "guardian 回收"))
                  report["guardian_reaped"] = True
                  require(time.monotonic() < deadline, "组清理在期限后返回")
                  report["complete"] = True
              except BaseException as error:
                  report["errors"].append(repr(error))
                  # guardian 尚未 reap，PGID 身份仍由本次 Popen 保留。期限耗尽也仅终止自有组；
                  # 不再启动 ps，也不以无界 wait 侵占归档余量；complete 保持 false。
                  try:
                      if not report.get("guardian_reaped", False) and proc.returncode is None:
                          os.killpg(proc.pid, signal.SIGKILL)
                          if time.monotonic() < deadline:
                              report["guardian_exit"] = proc.wait(timeout=budget_left(deadline, 2, "失败回收"))
                              report["guardian_reaped"] = True
                  except BaseException as fallback_error:
                      report["errors"].append(repr(fallback_error))
              return report


          class Runner:
              def __init__(self, root, scratch, evidence):
                  self.root, self.scratch, self.evidence = root, scratch, evidence
                  self.sequence = 0
                  self.cleanup_complete = True
                  self.started = time.monotonic()
                  self.deadline = self.started + ACTIVE_SECONDS
                  self.phase_ends = {"active": self.deadline, "cleanup": self.started + CLEANUP_END_SECONDS,
                                     "archive": self.started + ARCHIVE_END_SECONDS,
                                     "receipt": self.started + RECEIPT_END_SECONDS}

              def check_phase(self, phase):
                  require(time.monotonic() < self.phase_ends[phase], phase + " 总期限耗尽")

              def run(self, argv, label, seconds=60, env=None, cwd=None, cleanup=False, phase=None):
                  self.sequence += 1
                  prefix = self.evidence / f"{self.sequence:02d}-{label}"
                  done = prefix.with_suffix(".command.json")  # 回执不随 scratch 删除。
                  receipt = {"argv": argv, "cwd": str(cwd or self.root), "timeout_seconds": seconds,
                             "exit_code": None, "failure": None, "cleanup": None, "status": "FAIL"}
                  proc = None
                  started = time.monotonic()
                  phase = phase or ("cleanup" if cleanup else "active")
                  phase_end = self.phase_ends[phase]
                  # 清理/归档/封存不获新窗口；每条命令前给它自己的 guardian 留固定余量。
                  command_end = phase_end if phase == "active" else phase_end - GROUP_SECONDS
                  limit = min(started + seconds, command_end)
                  receipt.update(phase=phase, deadline=limit, phase_deadline=phase_end, deadline_exceeded=False)
                  with prefix.with_suffix(".stdout").open("xb") as out, prefix.with_suffix(".stderr").open("xb") as err:
                      try:
                          require(time.monotonic() < limit, "活跃监督总期限耗尽")
                          proc = subprocess.Popen([sys.executable, "-B", "-c", GUARD, str(done), *argv],
                                                  cwd=cwd or self.root, env=env, stdout=out, stderr=err,
                                                  start_new_session=True)
                          receipt["guardian_pid"] = receipt["process_group"] = proc.pid
                          while not done.exists():
                              require(time.monotonic() < limit, label + " 期限耗尽")
                              current = members(proc.pid, limit)
                              require(any(r["pid"] == proc.pid and not r["state"].startswith("Z") for r in current),
                                      "guardian 意外退出且无命令回执")
                              time.sleep(budget_left(limit, 0.25, label))
                          command = json.loads(done.read_text())
                          receipt["exit_code"] = command["exit_code"]
                          receipt["command_error"] = command["error"]
                          receipt["observed_at"] = time.monotonic()
                          receipt["deadline_exceeded"] = receipt["observed_at"] >= limit
                          require(command["error"] is None, "命令启动失败：" + str(command["error"]))
                          require(command["exit_code"] == 0, label + " 非零退出")
                          require(not receipt["deadline_exceeded"], label + " 成功回执到达时期限已耗尽")
                      except BaseException as error:
                          receipt["failure"] = repr(error)
                      finally:
                          if proc is not None:
                              group_end = self.phase_ends["cleanup"] if phase == "active" else phase_end
                              receipt["cleanup"] = cleanup_group(proc, done.exists(), min(time.monotonic() + GROUP_SECONDS, group_end))
                              self.cleanup_complete &= receipt["cleanup"]["complete"]
                  if time.monotonic() >= phase_end and receipt["failure"] is None:
                      receipt["failure"] = phase + " 总期限耗尽"
                  clean = receipt["cleanup"]
                  if receipt["failure"] is None and clean and clean["complete"] and not clean["descendants_after_command"]:
                      receipt["status"] = "PASS"
                  receipt["elapsed_seconds"] = time.monotonic() - started
                  receipt["logs"] = {suffix: {"sha256": digest(prefix.with_suffix(suffix)),
                                               "bytes": prefix.with_suffix(suffix).stat().st_size}
                                     for suffix in (".stdout", ".stderr")}
                  # 日志摘要也不能让已过阶段期限的结果成为 PASS。
                  if time.monotonic() >= phase_end:
                      receipt["status"] = "FAIL"
                      receipt["failure"] = receipt["failure"] or phase + " 回执封存时期限耗尽"
                  save(prefix.with_suffix(".receipt.json"), receipt)
                  require(receipt["status"] == "PASS", label + " 失败，详见 " + prefix.name + ".receipt.json")
                  return prefix.with_suffix(".stdout").read_bytes()


          def image_identity(info, image, mountpoint):
              matches = [v for v in info.get("images", [])
                         if Path(v.get("image-path", "")).resolve() == image]
              require(len(matches) <= 1, "同一路径的镜像身份不唯一")
              if not matches:
                  return None
              entities = matches[0].get("system-entities", [])
              mounted = [v for v in entities if v.get("mount-point") == str(mountpoint)]
              whole = [v["dev-entry"] for v in entities if re.fullmatch(r"/dev/disk[0-9]+", v.get("dev-entry", ""))]
              require(len(mounted) == 1 and len(whole) == 1, "镜像路径/挂载点/整盘身份不唯一")
              require(re.fullmatch(r"/dev/disk[0-9]+(?:s[0-9]+)+", mounted[0].get("dev-entry", ""))
                      or mounted[0].get("dev-entry") == whole[0], "挂载设备形状不符")
              require(re.fullmatch(re.escape(whole[0]) + r"(?:s[0-9]+)*", mounted[0]["dev-entry"]), "挂载设备不属于该整盘")
              return {"image": str(image), "mountpoint": str(mountpoint), "device": whole[0],
                      "mounted_device": mounted[0]["dev-entry"]}


          def interrupt(signum, _frame):
              raise RuntimeError(f"监督器收到中断 {signum}")


          def main():
              require(sys.platform == "darwin" and os.environ.get("GITHUB_ACTIONS") == "true", "仅允许 GitHub macOS runner")
              root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
              temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
              artifacts = temp / "c5-hfs-artifacts"
              artifacts.mkdir(exist_ok=False)
              evidence = artifacts / "evidence"
              evidence.mkdir()
              scratch = Path(tempfile.mkdtemp(prefix="c5-hfs-", dir=temp)).resolve()
              mountpoint, image = scratch / "mount", scratch / "carrier.dmg"
              run = Runner(root, scratch, evidence)
              final = {"status": "FAIL", "failure": None, "cleanup_failure": None,
                       "scratch": str(scratch), "artifacts": str(artifacts), "test": TEST,
                       "attach_attempted": False, "detached": False, "image_archived": False,
                       "scratch_removed": False, "source_identity": None}
              attached = None
              save(evidence / "INCOMPLETE.json", {"status": "INCOMPLETE_NOT_ACCEPTED", "started": run.started,
                   "phase_deadlines": run.phase_ends, "final_receipt_required": True})
              try:
                  for sig in (signal.SIGINT, signal.SIGTERM):
                      signal.signal(sig, interrupt)
                  checked = runpy.run_path(str(root / ".github/scripts/run-c7a-remote.py"))
                  identity = checked["source_identity"](root)
                  final["source_identity"] = identity
                  save(evidence / "configuration.json", {**identity, "test": TEST, "fixed_image_mib": 16,
                       "build_timeout_seconds": 1200, "test_timeout_seconds": 180, "tool_timeout_seconds": 60,
                       "active_window_seconds": ACTIVE_SECONDS, "cleanup_end_seconds": CLEANUP_END_SECONDS,
                       "archive_end_seconds": ARCHIVE_END_SECONDS, "receipt_end_seconds": RECEIPT_END_SECONDS,
                       "group_timeout_seconds": GROUP_SECONDS, "step_timeout_minutes": 33, "job_timeout_minutes": 35,
                       "initial_free_bytes": shutil.disk_usage(temp).free,
                       "reviewed_source": checked["REVIEWED_SOURCE"], "reviewed_tree": checked["REVIEWED_SOURCE_TREE"]})
                  run.run(["rustc", "-vV"], "rustc")
                  run.run(["cargo", "-V"], "cargo")
                  run.run(["sw_vers"], "macos")
                  env = dict(os.environ, CARGO_TARGET_DIR=str(scratch / "target"), CARGO_INCREMENTAL="0",
                             PYO3_PYTHON=sys.executable, PYTHONDONTWRITEBYTECODE="1")
                  raw = run.run(["cargo", "test", "--locked", "--features", "s_session", "--lib", "--jobs", "2",
                                 "--no-run", "--message-format=json"], "build", 1200, env, root / "rust")
                  built = []
                  for line in raw.splitlines():
                      record = json.loads(line)
                      if (record.get("reason") == "compiler-artifact" and record.get("executable")
                              and record.get("profile", {}).get("test")
                              and record.get("target", {}).get("name") == "newchan_rust"
                              and Path(record["target"]["src_path"]).resolve() == root / "rust/src/lib.rs"):
                          built.append(Path(record["executable"]).resolve(strict=True))
                  require(len(built) == 1, "必须唯一定位本库测试可执行文件")
                  executable = built[0]
                  require(executable.is_relative_to(scratch / "target") and executable.is_file(), "库测试产物越界")
                  binary_sha = digest(executable)
                  save(evidence / "test-binary.json", {"path": str(executable), "sha256": binary_sha})
                  listing = run.run([str(executable), TEST, "--exact", "--ignored", "--list"], "exact-test-list", 60, env)
                  lines = listing.decode().splitlines()
                  require([v for v in lines if v.endswith(": test")] == [TEST + ": test"], "具名 ignored 入口不是唯一一条")
                  require("1 test, 0 benchmarks" in lines, "测试发现数不是 1")
                  require(checked["source_identity"](root) == identity, "编译/发现期间来源改变")
                  require(not image.exists(), "拒绝覆盖镜像")
                  mountpoint.mkdir()
                  run.run(["hdiutil", "create", "-size", "16m", "-fs", "HFS+", "-type", "UDIF",
                           "-volname", "c5-hfs", str(image)], "create-image")
                  final["attach_attempted"] = True
                  attach = run.run(["hdiutil", "attach", "-plist", "-nobrowse", "-noautoopen",
                                    "-mountpoint", str(mountpoint), str(image)], "attach-image")
                  plistlib.loads(attach)  # 保留原 plist 日志，实际身份另核 fresh info。
                  info = plistlib.loads(run.run(["hdiutil", "info", "-plist"], "attached-info"))
                  attached = image_identity(info, image, mountpoint)
                  require(attached is not None, "找不到本次已挂载镜像")
                  require(os.path.ismount(mountpoint), "专属挂载点未实际挂载")
                  disk = plistlib.loads(run.run(["diskutil", "info", "-plist", str(mountpoint)], "carrier-info"))
                  require(disk.get("MountPoint") == str(mountpoint) and disk.get("FilesystemType") == "hfs", "实际载体不是指定 HFS 挂载点")
                  vfs = os.statvfs(mountpoint)
                  capacity = vfs.f_blocks * vfs.f_frsize
                  require(0 < capacity <= 16 * MIB, "实际载体超过原 staged/store 上限")
                  save(evidence / "carrier.json", {**attached, "statvfs_capacity": capacity,
                       "statvfs_available": vfs.f_bavail * vfs.f_frsize,
                       "sqlite_source_id": "由原 Stage::new 的固定 source-id 断言验证，不以系统 sqlite 替代"})
                  database = mountpoint / "eb.sqlite"
                  require(not database.exists(), "目标测试库必须尚不存在")
                  env["CLOSURE_CARRIER_DB"] = str(database)
                  output = run.run([str(executable), TEST, "--exact", "--ignored", "--nocapture", "--test-threads=1"],
                                   "hfs-test", 180, env)
                  text = output.decode()
                  require(re.search(r"(?m)^running 1 test$", text) is not None, "运行数不是 1")
                  require(re.search(r"(?m)^test " + re.escape(TEST) + r" \.\.\. ok$", text) is not None, "具名锁未成功")
                  require(re.search(r"(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;", text) is not None,
                          "测试结果不是恰一通过且零忽略")
                  require(digest(executable) == binary_sha, "运行期间二进制变化")
                  require(checked["source_identity"](root) == identity, "运行期间来源变化")
                  save(evidence / "test-result.json", {"test": TEST, "passed": 1, "failed": 0, "ignored": 0,
                                                       "source": identity, "binary_sha256": binary_sha})
                  run.check_phase("active")
                  final["status"] = "PASS_C5_HFS"
              except BaseException as error:
                  final["failure"] = repr(error)
                  final["status"] = "FAIL"
              finally:
                  for sig in (signal.SIGINT, signal.SIGTERM):
                      signal.signal(sig, signal.SIG_IGN)
                  try:
                      require(run.cleanup_complete, "存在未回收的自有进程组，禁止误删 scratch")
                      if final["attach_attempted"]:
                          info = plistlib.loads(run.run(["hdiutil", "info", "-plist"], "cleanup-info", cleanup=True))
                          current = image_identity(info, image, mountpoint)
                          if current is not None:
                              require(attached is None or current == attached, "镜像设备身份改变，禁止卸其它卷")
                              try:
                                  run.run(["hdiutil", "detach", current["device"]], "detach-image", cleanup=True)
                              except BaseException as normal_error:
                                  save(evidence / "normal-detach-failure.json", {"error": repr(normal_error)})
                                  final["cleanup_failure"] = repr(normal_error)
                                  final["status"] = "FAIL"  # force 仅回收，不能把原清理失败改签通过。
                                  fresh = plistlib.loads(run.run(["hdiutil", "info", "-plist"], "force-check-info", cleanup=True))
                                  remaining = image_identity(fresh, image, mountpoint)
                                  require(remaining is None or remaining == current, "卸载失败后身份改变，禁止 force")
                                  if remaining is not None:
                                      run.run(["hdiutil", "detach", "-force", current["device"]], "force-detach-image", cleanup=True)
                              final_info = plistlib.loads(run.run(["hdiutil", "info", "-plist"], "detached-info", cleanup=True))
                              require(image_identity(final_info, image, mountpoint) is None, "镜像仍在挂载表中")
                          require(not os.path.ismount(mountpoint), "专属挂载点仍然挂载，禁止复制/删除")
                      final["detached"] = True
                      run.check_phase("cleanup")
                      if image.exists():
                          metadata = {"source_identity": final["source_identity"], "detached_before_copy": True,
                                      "test_status_before_cleanup": final["status"]}
                          run.run([sys.executable, "-B", "-c", ARCHIVE, str(image), str(artifacts / "carrier-image"),
                                   json.dumps(metadata)], "archive-image", phase="archive")
                          final["image_archived"] = True
                      require(scratch.parent == temp and scratch.name.startswith("c5-hfs-") and not scratch.is_symlink(), "scratch 所属越界")
                      run.run([sys.executable, "-B", "-c", "import shutil,sys; shutil.rmtree(sys.argv[1])", str(scratch)],
                              "remove-scratch", phase="archive")
                      final["scratch_removed"] = True
                      run.check_phase("archive")
                  except BaseException as error:
                      final["cleanup_failure"] = repr(error)
                      final["status"] = "FAIL"
                  try:
                      # 清单不自摘要，也不摘要尚在写入的清单命令日志/回执；这些由最终 RESULT 绑定。
                      inventory_prefix = f"{run.sequence + 1:02d}-artifact-inventory"
                      run.run([sys.executable, "-B", "-c", INVENTORY, str(artifacts), inventory_prefix],
                              "artifact-inventory", phase="receipt")
                      final["inventory_sha256"] = digest(evidence / "ARTIFACTS.json")
                      final["inventory_receipt_sha256"] = digest(evidence / (inventory_prefix + ".receipt.json"))
                      run.check_phase("receipt")
                  except BaseException as error:
                      final["seal_failure"] = repr(error)
                      final["status"] = "FAIL"
                  final["elapsed_seconds"] = time.monotonic() - run.started
                  final["phase_deadlines"] = run.phase_ends
                  if time.monotonic() >= run.phase_ends["receipt"]:
                      final["seal_failure"] = final.get("seal_failure") or "最终回执期限耗尽"
                      final["status"] = "FAIL"
                  # 最后 30s 是失败回执/退出余量，不能延长任何成功期限；缺最终回执即不可验收。
                  save(evidence / "RESULT.json", final)
                  if time.monotonic() >= run.phase_ends["receipt"]:
                      final["status"] = "FAIL"
                      save(evidence / "SEAL-FAILED.json", {"status": "FAIL", "reason": "最终回执写入越过期限"})
              print(json.dumps(final, ensure_ascii=False))
              return 0 if final["status"] == "PASS_C5_HFS" else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
      - name: Upload C5 HFS source, test and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1406-c5-hfs-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c5-hfs-artifacts/evidence/
          if-no-files-found: error
      - name: Upload detached C5 HFS image and SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1406-c5-hfs-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c5-hfs-artifacts/carrier-image/
          # 构建或挂载前失败可能没有可封存镜像；前步骤的失败仍使 job 红。
          if-no-files-found: warn

  # #1394 根裁定 A：手动触发本 CI 时一并执行 macOS 作业（financial_session 的 macOS 读数与
  #   economic_session 等库测试），一次触发拿全套读数。push main 不经本作业，由 ci-macos.yml 自身的
  #   paths 过滤决定是否运行，控制 macOS 计费。
  macos-session:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-macos.yml

  s-observer:
    # #1372：执行只读观察、生命周期和取证边界回归；完整160输入/浏览器验收另存具名证据。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python observer and lifecycle tests
        run: python -B -m unittest discover -s s_session/tests -p 'test_tb01c_*.py' -v
      - name: TB-02-A capture deadline and cleanup tests
        run: python -B -m unittest discover -s s_session/tests -p 'test_tb02a_*.py' -v
      - name: Install TB-02-C trace comparison dependency
        run: python -m pip install -r s_session/tests/requirements-tb02c.txt
      - name: TB-02-C public contract and oracle tests
        run: python -B -m unittest discover -s s_session/tests -p 'test_tb02c_*.py' -v
      - name: Browser protocol tests
        run: node s_session/tests/test_tb01c_browser.cjs
      - name: TB-02-C observer contract tests
        run: node --test s_session/tests/test_tb02c_contract.cjs
      # #1394 C-2 裁定 1：v3（s-session/3）validate-once 锁。完整 Q3 客户端套件约 10.5 分钟不进 CI，
      #   只把这条锁连同其判据（钩子不再验、重载命中重放计费、Reader 根变化必重验）单独成套执行。
      - name: Q3 v3 validate-once lock (#1394)
        run: node --test s_session/tests/test_q3_v3_validate_once.cjs
      # #1414：TB-02-D 单元测试固定 CPython 3.14.6。s_query_integrity.py 的同次解析池只在
      #   3.14.6 / 64 位、实测 dict 布局匹配时启用；test_tb02d_parse_pool 的播种、命中与容量
      #   断言绑定该布局，其它解释器上池自动停用、断言失败而不是跳过。上面 3.11 的步骤不变，
      #   本步起本 job 的 python 即 3.14.6。下列五个模块只用标准库、仓内模块与 node，不需 pip。
      #   显式列模块而不用 discover：test_tb02d_projection_cache.py 继承 tb01c_query_tests.QueryTests，
      #   其 setUpClass 要用 --binary 传入的 S 写者二进制建库，本 job 不构建 Rust，故不进 CI，
      #   由本机以 --binary 单独实跑留收据。两个 test_tb02d_*.cjs 是需外部归档参数的离线对照探针，
      #   tb02d_{harness,runtime,verify}.py 与 tb02d_browser.cjs 是正式运行验收脚本，均不在 CI 执行。
      - name: Set up CPython 3.14.6 for TB-02-D (#1414)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - name: TB-02-D tests without the S writer binary (#1414)
        working-directory: s_session/tests
        run: |
          python -VV
          python -B -c "import sys; sys.path.insert(0, '..'); import s_readonly_server as s; print('tb02d_parse_pool_layout_matches', s._query_integrity()._CanonicalParsePool._layout_matches())"
          python -B -m unittest -v test_tb02d_contract test_tb02d_discovery test_tb02d_validate_once test_tb02d_parse_pool test_tb02d_key_reuse

  fixture-drift:
    # #265（#245 裁定）：Lean 源 → parity fixture 双向闭环的 CI 腿。
    # 锁的漂移窗口：Lean 源改了值、fixture 未重落盘时 parity 测试静默全绿。
    # 核心件 = #263 的 scripts/check_fixture_drift.py（本 job 只是把它包进 CI）。
    # formal 无 Mathlib（lakefile.toml packages=[]），构建轻：本机 macOS arm64 实测
    # 冷启动 lake build 12.2s（090 照实：CI ubuntu 未实测，预期分钟级，大头是
    # elan 工具链下载，已由 cache 兜住；若实测超 10 分钟需加 formal/.lake/build 缓存）。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('formal/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | bash -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build formal (lake build)
        # formal/lean-toolchain 固定 leanprover/lean4:v4.31.0，elan 首次调用自动装该工具链
        run: lake build
        working-directory: formal

      - name: Fixture drift check (Lean → fixtures)
        # 红时脚本自身打出字段级 diff + 每个漂移 fixture 的再生（重落盘）命令
        run: python3 scripts/check_fixture_drift.py
