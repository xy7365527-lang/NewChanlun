    needs: rust-test-s-session-extra-groups
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require all extras groups to succeed (#1722)
        env:
          EXTRAS_RESULT: ${{ needs.rust-test-s-session-extra-groups.result }}
        run: test "$EXTRAS_RESULT" = success

  rust-test-backtest-bin:
    runs-on: ubuntu-latest
    # 拆前本步约 9.3 分钟（run 39358379553）。
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-job-setup

      - name: cargo test — backtest_bin feature（econ_oddeven_diagnosis.rs 仅在此 feature 下编译）
        # 2026-08-16 磁盘实撞（#993 收口轮）：三轮 runner 爆盘（No space left on device）——
        # --all-targets 在 feature 下额外编 56 个探针 bin 的 test 目标（各链 nautilus 套件，
        # 本地实测 debug 全 target 55G ⟹ 14G 盘必爆）。改 --lib：backtest 模块测试（含
        # econ_oddeven_diagnosis）全在 lib 内；tests/ 与 bins 已由 default 步覆盖——零覆盖损失。
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --lib --features backtest_bin --jobs 1

  # #1488：独立运行两种构建的序列与真实 memo 锁，不等待 rust-check 的完整回归。
  # 依赖预取单列为联网步骤；后续 --offline 只约束测试阶段，不代表全程离线。
  s-sequence-1488:
    name: "#1488 序列与真实 memo (${{ matrix.mode }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Plain
            features: s_session
          - mode: Owned
            features: s_session,s_allocation_json_testonly
    # #1588 约定：每个 Rust job 设上限兼作挂死保护；单 feature 组编 S bin 测试 + 精确锁，对齐 rust-test-s-session-extras。
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      FEATURES: ${{ matrix.features }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache cargo registry + git only (#1488)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Record source and toolchain identity (#1488)
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          sha256sum src/s_content.rs src/s_content/sequence.rs tests/s_content_sequence.rs src/bin/s_session_v3/generation.rs
          rustc -vV
          cargo -V
          rustup show active-toolchain
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/1488-sequence-target" >> "$GITHUB_ENV"
          echo "features=$FEATURES target=$RUNNER_TEMP/1488-sequence-target"
      - name: Fetch locked dependencies (network allowed, #1488)
        run: cargo fetch --locked
      - name: Run sequence API, real memo, oracle and nonempty source locks (#1488)
        run: |
          set -euo pipefail
