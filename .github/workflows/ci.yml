# #1875 critical-path probe only: extras release-locks (r6 0ad61a9c2f: R9+R10+R11+H1)
name: CI
'on':
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust-test-s-session-extra-groups:
    name: rust-test-s-session-extras (${{ matrix.group }})
    strategy:
      fail-fast: false
      max-parallel: ${{ (vars.CI_BOAT_RUNNERS != 'off' && github.actor == 'xy7365527-lang' && github.triggering_actor == 'xy7365527-lang' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'xy7365527-lang')) && 5 || 3 }}
      matrix:
        group:
        - release-locks
    runs-on: ${{ (vars.CI_BOAT_RUNNERS != 'off' && github.actor == 'xy7365527-lang' && github.triggering_actor == 'xy7365527-lang' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'xy7365527-lang')) && 'boat-large/from=hc-gate-base' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.group == 'native' && 90 || 60 }}
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: rust
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/rust-job-setup
    - name: cargo test — TB-02-C member source binding
      if: ${{ !cancelled() && matrix.group == 'content' }}
      run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --bin s_structure_session tb02c_member_relations_bind_only_the_member_sources --jobs "${CI_CARGO_JOBS:-1}"
    - name: 编译负例 —
      if: ${{ !cancelled() && matrix.group == 'content' }}
      run: ../.github/scripts/check-compile-negatives-1394.sh
    - name: cargo test — 完整内容编码与共享图校验（#1394）
      if: ${{ !cancelled() && matrix.group == 'content' }}
      run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --lib --jobs "${CI_CARGO_JOBS:-1}" s_content
    - name: cargo test — 内容向量、持久序列与累计资源（#1394）
      if: ${{ !cancelled() && matrix.group == 'content' }}
      run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --test s_content_contract --test s_content_sequence --test s_content_job --test s_content_path --jobs "${CI_CARGO_JOBS:-1}"
    - name: cargo test — economic_session / session_transport / session_protocol 库测试（#1394 G-1）
      if: ${{ !cancelled() && matrix.group == 'economic' }}
      run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --lib --jobs "${CI_CARGO_JOBS:-1}" -- economic_session session_transport session_protocol
    - name: cargo test — s_capture_native_testonly 特性新增的测试（#1394）
      if: ${{ !cancelled() && matrix.group == 'native' }}
      run: ../.github/scripts/run-cargo-with-telemetry.sh ../.github/scripts/test-feature-delta.sh s_capture_native_testonly
    - name: cargo test — s_incremental 生产增量构建（#1640）
      if: ${{ !cancelled() && matrix.group == 'owned' }}
      env:
        S_NATIVE_SQLITE_CACHE_KIB: '262144'
      run: '../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session,s_incremental --bin s_structure_session --jobs "${CI_CARGO_JOBS:-1}" -- s_allocation:: s3_serve incremental_build_full_branch_only_at_birth build_profile pager_probe history_layout_multicut_ layout_object_index_ b2_native_owner_restore_ r9a_new_cut_manifest_ bounded_layout_cc007_ layout1_generation_'
    - name: H1 私有 FD/WAL 授权边界锁（#1481 S1D）
      if: ${{ !cancelled() && matrix.group == 'owned' }}
      run: 'set -o pipefail

        cargo test --release --locked --features s_session,s_incremental --bin s_structure_session --jobs "${CI_CARGO_JOBS_RELEASE:-4}" -- --exact v3::admission_private::fd_wal::authorization_tests::full_audit_read_actions_do_not_enable_write_attach_temp_or_unknown_exits v3::admission_private::fd_wal::authorization_tests::count_scan_reads_are_limited_to_business_tables --test-threads 1 --show-output --format pretty --color never 2>&1 | tee "$RUNNER_TEMP/1481-fd-wal.log"

        grep -Fx "test v3::admission_private::fd_wal::authorization_tests::full_audit_read_actions_do_not_enable_write_attach_temp_or_unknown_exits ... ok" "$RUNNER_TEMP/1481-fd-wal.log"

        grep -Fx "test v3::admission_private::fd_wal::authorization_tests::count_scan_reads_are_limited_to_business_tables ... ok" "$RUNNER_TEMP/1481-fd-wal.log"

        '
    - name: H1 正式准入三层对拍与调用路径锁（#1481 S1）
      if: ${{ !cancelled() && matrix.group == 'owned' }}
      run: "set -o pipefail\n# #1481 S1K：接替 history36h 的全部 h1_ release 锁，保留正式准入逐名收据。\ncargo test --release --locked --features s_session,s_incremental --bin s_structure_session --jobs \"${CI_CARGO_JOBS_RELEASE:-4}\" h1_ -- --test-threads 1 --show-output --format pretty --color never 2>&1 | tee \"$RUNNER_TEMP/1481-admission.log\"\nfor test in \\\n  h1_admission_cold_prefixes_match_full_canonical \\\n  h1_admission_cold_negative_classes_match_full_oracle \\\n  h1_admission_online_own_commits_match_full_canonical \\\n  h1_admission_foreign_sqlite_changes_retire_writer \\\n  h1_admission_cold_handoff_foreign_sqlite_commit_rejects \\\n  h1_admission_formal_accept_begin_prepare_recover_never_full_audit \\\n  h1_admission_driver_cold_recover_rebuilds_ledger_bitwise \\\n  h1_admission_driver_cold_preserves_original_node_record_gates \\\n  h1_admission_cold_real_wire_short_budget_rejects_before_write \\\n  h1_admission_prepolicy_bad_history_rejected_before_migration \\\n  h1_admission_normal_exit_same_database_new_process_restarts \\\n  h1_admission_temporary_seed_failure_same_database_new_process_restarts \\\n  h1_admission_mainonly_nonwal_prepolicy_preserves_domain \\\n  h1_admission_legacy_v1_recover_prepolicy_mainonly_rejects_unchanged \\\n  h1_admission_legacy_v1_accept_prepolicy_mainonly_rejects_unchanged \\\n  h1_admission_legacy_v1_advance_prepolicy_mainonly_rejects_unchanged \\\n  h1_admission_legacy_v2_clock_recover_prepolicy_mainonly_rejects_unchanged \\\n  h1_admission_v3_selector_advance_prepolicy_mainonly_authenticates_before_migration \\\n  h1_admission_hot_rollback_journal_rejects_before_rw_open \\\n  h1_admission_nonwal_conversion_handoff_foreign_commit_rejects\ndo\n  grep -Fx \"test v3::audit_owner::construction_tests::$test ... ok\" \"$RUNNER_TEMP/1481-admission.log\"\ndone\ncargo test --release --locked --features s_session,s_incremental --bin s_structure_session --jobs \"${CI_CARGO_JOBS_RELEASE:-4}\" h1_ledger_cache_ -- --test-threads 1 --show-output --format pretty --color never 2>&1 | tee \"$RUNNER_TEMP/1481-ledger.log\"\nfor test in \\\n  h1_ledger_cache_sidecars_are_pinned_and_physically_counted \\\n  h1_ledger_cache_registration_still_rejects_unknown_sidecars \\\n  h1_ledger_cache_substitutes_are_rejected \\\n  h1_ledger_cache_uses_original_store_cap_before_discard \\\n  h1_ledger_cache_replacement_or_new_member_is_rejected_before_discard \\\n  h1_ledger_cache_discard_releases_only_cache_pins_before_rebuild \\\n  h1_ledger_cache_conversion_stamp_rejects_changed_main_or_wal_frames\ndo\n  grep -Fx \"test v3::admission_provider::control_lock_tests::$test ... ok\" \"$RUNNER_TEMP/1481-ledger.log\"\ndone\ncargo test --release --locked --features s_session,s_incremental,s_capture_native_testonly --bin s_structure_session --jobs \"${CI_CARGO_JOBS_RELEASE:-4}\" h1_admission_ordinary_prepolicy_bad_history_rejected_before_migration -- --test-threads 1 --show-output --format pretty --color never 2>&1 | tee \"$RUNNER_TEMP/1481-ordinary.log\"\ngrep -Fx \"test v3::audit_owner::construction_tests::h1_admission_ordinary_prepolicy_bad_history_rejected_before_migration ... ok\" \"$RUNNER_TEMP/1481-ordinary.log\"\ngrep -Fx \"test v3::writer_cli::tests::h1_admission_one_shot_requires_explicit_retention_resource_file ... ok\" \"$RUNNER_TEMP/1481-admission.log\"\ncargo test --release --locked --features s_session,s_incremental --bin s_structure_session --jobs \"${CI_CARGO_JOBS_RELEASE:-4}\" -- --exact v3::admission_anchor::native_n1::tests::native_n1_s3_real_audit_charges_original_job_and_keeps_s2_accept_version_gate v3::admission_anchor::native_n1::tests::native_n1_vfs32f_real_s3_audit_seal_destroy_finish_stays_same_job --test-threads 1 --show-output --format pretty --color never 2>&1 | tee \"$RUNNER_TEMP/1481-e6.log\"\ngrep -Fx \"test v3::admission_anchor::native_n1::tests::native_n1_s3_real_audit_charges_original_job_and_keeps_s2_accept_version_gate ... ok\" \"$RUNNER_TEMP/1481-e6.log\"\ngrep -Fx \"test v3::admission_anchor::native_n1::tests::native_n1_vfs32f_real_s3_audit_seal_destroy_finish_stays_same_job ... ok\" \"$RUNNER_TEMP/1481-e6.log\"\n"
    - name: H1 SQLite commit failure locks（#1481 S1K）
      if: ${{ !cancelled() && matrix.group == 'owned' }}
      run: "set -o pipefail\ncargo test --release --locked --features s_session,s_incremental --bin s_structure_session sqlite_commit_failure --jobs \"${CI_CARGO_JOBS_RELEASE:-4}\" -- --test-threads 1 --show-output --format pretty --color never 2>&1 | tee \"$RUNNER_TEMP/1481-sqlite-commit-failure.log\"\nfor test in \\\n  v3::audit_owner::construction_tests::h1_sqlite_commit_failure_does_not_advance_clamp \\\n  v3::commit::tests::prepared_commit_sqlite_commit_failure_returns_no_receipt_and_rolls_back \\\n  v3::prepared::tests::sqlite_commit_failure_cannot_return_a_receipt_or_keep_real_prepared_state \\\n  v3::prepared::tests::native_capture_sqlite_commit_failure_retries_with_new_current_capture\ndo\n  grep -Fx \"test $test ... ok\" \"$RUNNER_TEMP/1481-sqlite-commit-failure.log\"\ndone\n"
    - name: H1 Native debug source suffix and receipt expiry locks（#1481 S1K）
      if: ${{ !cancelled() && matrix.group == 'owned' }}
      run: "set -o pipefail\ncargo test --locked --features s_session,s_incremental --bin s_structure_session --jobs \"${CI_CARGO_JOBS_RELEASE:-4}\" -- --test-threads 1 --show-output --format pretty --color never v3::driver::tests::audit_owner_incremental_normal_writes_full_oracle_and_suffix v3::source_audit::source_receipt::tests::p6_raw_receipt_expired_ 2>&1 | tee \"$RUNNER_TEMP/1481-native-debug.log\"\nfor test in \\\n  v3::driver::tests::audit_owner_incremental_normal_writes_full_oracle_and_suffix \\\n  v3::source_audit::source_receipt::tests::p6_raw_receipt_expired_before_binding_releases_budget \\\n  v3::source_audit::source_receipt::tests::p6_raw_receipt_expired_during_closure_releases_budget \\\n  v3::source_audit::source_receipt::tests::p6_raw_receipt_expired_before_consumption_releases_budget\ndo\n  grep -Fx \"test $test ... ok\" \"$RUNNER_TEMP/1481-native-debug.log\"\ndone\n"
    - name: 上传 H1 正式准入逐名日志（#1481 S1）
      if: ${{ !cancelled() && matrix.group == 'owned' }}
      uses: actions/upload-artifact@v4
      with:
        name: h1-admission-S1
        path: '${{ runner.temp }}/1481-admission.log

          ${{ runner.temp }}/1481-ledger.log

          ${{ runner.temp }}/1481-ordinary.log

          ${{ runner.temp }}/1481-fd-wal.log

          ${{ runner.temp }}/1481-e6.log

          ${{ runner.temp }}/1481-sqlite-commit-failure.log

          ${{ runner.temp }}/1481-native-debug.log

          '
        if-no-files-found: error
        overwrite: true
    - name: cargo test — v3 history Owned 分配原型（s_allocation_json_testonly，#1394）
      if: ${{ !cancelled() && matrix.group == 'owned' }}
      run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session,s_allocation_json_testonly --bin s_structure_session v3::history --jobs "${CI_CARGO_JOBS:-1}"
    - name: build release-only locks（#1640，同 issue-1488-uo-iter）
      if: ${{ !cancelled() && matrix.group == 'release-locks' }}
      run: 'set -o pipefail

        ../.github/scripts/run-cargo-with-telemetry.sh cargo test --release --locked --features s_session,s_incremental --no-run --bin s_structure_session --jobs "${CI_CARGO_JOBS_RELEASE:-4}" 2>&1 | tee ../build-release.log

        '
    - name: release-only locks (each exact, --release --ignored)（#1640）
      if: ${{ !cancelled() && matrix.group == 'release-locks' }}
      timeout-minutes: 50
      run: "set +e\nfail=0\n: > ../locks.tsv\ncargo test --release --locked --features s_session,s_incremental --bin s_structure_session -- --list --format terse --ignored > ../list-release.txt 2>&1\n# #1875 R5：产物机检的 bin 构建（单线程，约 3 分钟）与单线程的锁并行：等锁的测试进程起来（cargo 此时已放开\n#   target 目录锁）再在同一 rust/target 后台构建，结论由下一步「产物无测试钩子」收取并决定成败。\nrm -f ../artifact.rc\n# #1875 R9：Boat 上 S4 锁换 jemalloc（只改分配器，环境层，同 tmpfs TMPDIR；gate 实测 677→607 s、28 行逐位相同）。\n#   装不上即退回 glibc，日志记 s4_allocator；托管 runner 不变。\nje=\nif [ \"${RUNNER_ENVIRONMENT:-}\" = self-hosted ]; then\n  so=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2\n  [ -f \"$so\" ] || sudo -n apt-get install -y -qq libjemalloc2 >/dev/null 2>&1 || { sudo -n apt-get update -qq >/dev/null 2>&1 && sudo -n apt-get install -y -qq libjemalloc2 >/dev/null 2>&1; }\n  [ -f \"$so\" ] && : probe-no-jemalloc\nfi\necho \"s4_allocator=${je:-glibc}\"\n# #1875 R11：Boat 磁盘 fsync 慢（新盘 p50 约 0.3 s），S4 的测试库放 tmpfs（gate 同此口径）；S4 不验掉电持久性。\ns4tmp=\"${TMPDIR:-/tmp}\"\nif [ \"${RUNNER_ENVIRONMENT:-}\" = self-hosted ] && [ -d /dev/shm ]; then s4tmp=$(mktemp -d /dev/shm/s4lock.XXXXXX); fi\necho \"s4_tmpdir=$s4tmp\"\nsetsid nohup bash -c 'for _ in $(seq 120); do pgrep -f \"deps/s_structure_session-[0-9a-f]+ --ignored --exact\" >/dev/null && break; sleep 1; done\n  ../.github/scripts/run-cargo-with-telemetry.sh cargo build --release --locked --features s_session,s_incremental --bin s_structure_session --jobs \"${CI_CARGO_JOBS:-1}\" \\\n    && ../.github/scripts/check-prod-artifact-hooks.sh target/release/s_structure_session\n  echo $? > ../artifact.rc.tmp && mv ../artifact.rc.tmp ../artifact.rc' > ../artifact.log 2>&1 < /dev/null &\ntotal=0\nwhile IFS= read -r t; do\n  [ -z \"$t\" ] && continue\n  case \"$t\" in \\#*) continue;; esac\n  total=$((total + 1))\n  log=\"../out-release-$(echo $t | tr ':/' '__').log\"\n  if ! grep -qx \"$t: test\" ../list-release.txt; then echo -e \"$t\\tNOT_LISTED_RELEASE\" >> ../locks.tsv; fail=1; continue; fi\n  TMPDIR=$s4tmp LD_PRELOAD=$je timeout 2700 cargo test --release --locked --features s_session,s_incremental --bin s_structure_session -- --ignored --exact \"$t\" --test-threads 1 > \"$log\" 2>&1\n  rc=$?\n  cat \"$log\"\n  if [ $rc -eq 0 ] && grep -q \"test result: ok. 1 passed\" \"$log\"; then echo -e \"$t\\tPASS_RELEASE\" >> ../locks.tsv; else echo -e \"$t\\tFAIL_RELEASE($rc)\" >> ../locks.tsv; fail=1; fi\ndone < ../.github/1488-uo-release-locks.txt\nif [ \"$total\" -eq 0 ]; then echo \"::error title=Empty release-only lock list::nothing was executed\"; fail=1; fi\ncat ../locks.tsv\nexit $fail\n"
    - name: 生产增量 release 产物无测试钩子（#1640）
      if: ${{ !cancelled() && matrix.group == 'release-locks' }}
      timeout-minutes: 30
      run: 'until [ -f ../artifact.rc ]; do sleep 5; done

        cat ../artifact.log

        exit "$(cat ../artifact.rc)"

        '
    - name: Upload release-only lock logs（#1640）
      if: ${{ always() && matrix.group == 'release-locks' }}
      uses: actions/upload-artifact@v4
      with:
        name: release-only-locks-${{ github.run_id }}
        path: 'build-release.log

          list-release.txt

          locks.tsv

          out-release-*.log

          '
        if-no-files-found: warn
