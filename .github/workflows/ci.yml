          require_passed native-fields \
            v3::object_index::tests::native_candidate_fields_component_exact_metadata_slot_and_late_null_gates \
            v3::object_index::tests::native_candidate_fields_internal_record_json_edge_gate_and_real_wire_sql_failure
          run_suite native-union native_candidate_union --bin s_structure_session
          require_passed native-union \
            v3::object_index::tests::native_candidate_union_second_root_errors_have_no_put_or_future_wire_repair_and_budget_refuses \
            v3::object_index::tests::native_candidate_union_real_generations_match_plan_and_reduce_sql_reads \
            v3::prepared::tests::native_candidate_union_four_real_commits_match_ordinary_roots_rows_and_revision
          run_suite native-path s_content::path::fixed_fields_tests --lib
          require_passed native-path \
            s_content::path::fixed_fields_tests::fixed_fields_exact_matches_existing_refs_and_rejects_before_read_above_bound \
            s_content::path::fixed_fields_tests::fixed_metadata_missing_errors_follow_consumption_order_not_schema_scan
      - name: Compile and run exact Native A B C locks (#1488)
        if: ${{ !cancelled() }}
        run: python3 ../.github/scripts/run-1488-delta-ci.py --mode Native --output "$RUNNER_TEMP/1488-abc-Native"
      - name: Upload Native fixed-field lock logs (#1488)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: 1488-fields-Native
          path: |
            ${{ runner.temp }}/1488-*.log
            ${{ runner.temp }}/1488-abc-Native/
          # 同 #1588 约定：单 job re-run 时替换首次尝试已传的同名产物。
          overwrite: true
          if-no-files-found: error

  # #1394 根裁定 A：手动触发本 CI 时一并执行 macOS 作业（financial_session 的 macOS 读数与
  #   economic_session 等库测试），一次触发拿全套读数。push main 不经本作业，由 ci-macos.yml 自身的
  #   paths 过滤决定是否运行，控制 macOS 计费。
  macos-session:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-macos.yml

  s-observer:
    # #1372：执行只读观察、生命周期和取证边界回归；完整160输入/浏览器验收另存具名证据。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python observer and lifecycle tests
        run: python -B -m unittest discover -s s_session/tests -p 'test_tb01c_*.py' -v
      - name: TB-02-A capture deadline and cleanup tests
        run: python -B -m unittest discover -s s_session/tests -p 'test_tb02a_*.py' -v
      - name: '#1716 formal consumption driver cleanup outcome'
        run: python -B -m unittest discover -s s_session/tests -p 'test_tb1716_*.py' -v
      - name: Install TB-02-C trace comparison dependency
        run: python -m pip install -r s_session/tests/requirements-tb02c.txt
      - name: TB-02-C public contract and oracle tests
        run: python -B -m unittest discover -s s_session/tests -p 'test_tb02c_*.py' -v
      - name: Browser protocol tests
        run: node s_session/tests/test_tb01c_browser.cjs
      - name: TB-02-B version and root-set contracts (#1405)
        run: |
          python -B -m unittest discover -s s_session/tests -p 'test_tb02b_contract.py' -v
          node --test s_session/tests/test_tb02b_contract.cjs
          node s_session/tests/build_tb01c_browser.cjs --check
      - name: TB-02-C observer contract tests
        run: node --test s_session/tests/test_tb02c_contract.cjs
      # #1394 C-2 裁定 1：v3（s-session/3）validate-once 锁。完整 Q3 客户端套件约 10.5 分钟不进 CI，
      #   只把这条锁连同其判据（钩子不再验、重载命中重放计费、Reader 根变化必重验）单独成套执行。
      - name: Q3 v3 validate-once lock (#1394)
        run: node --test s_session/tests/test_q3_v3_validate_once.cjs
      - name: TB-02-W terminal and cursor contract tests (#1420)
        if: ${{ !cancelled() }}
        working-directory: s_session/tests
        run: python -B -m unittest -v test_tb02w_contract
      - name: TB-02-W modular observer contract tests (#1420)
        if: ${{ !cancelled() }}
        run: node --test s_session/tests/test_tb02w_contract.cjs
      # #1414：TB-02-D 单元测试固定 CPython 3.14.6。s_query_integrity.py 的同次解析池只在
      #   3.14.6 / 64 位、实测 dict 布局匹配时启用；test_tb02d_parse_pool 的播种、命中与容量
      #   断言绑定该布局，其它解释器上池自动停用、断言失败而不是跳过。上面 3.11 的步骤不变，
      #   本步起本 job 的 python 即 3.14.6。下列五个模块只用标准库、仓内模块与 node，不需 pip。
      #   显式列模块而不用 discover：test_tb02d_projection_cache.py 继承 tb01c_query_tests.QueryTests，
      #   其 setUpClass 要用 --binary 传入的 S 写者二进制建库，本 job 不构建 Rust，故不进 CI，
      #   由本机以 --binary 单独实跑留收据。两个 test_tb02d_*.cjs 是需外部归档参数的离线对照探针，
      #   tb02d_{harness,runtime,verify}.py 与 tb02d_browser.cjs 是正式运行验收脚本，均不在 CI 执行。
      - name: Set up CPython 3.14.6 for TB-02-D (#1414)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - name: TB-02-D tests without the S writer binary (#1414)
        working-directory: s_session/tests
        run: |
          python -VV
          python -B -c "import sys; sys.path.insert(0, '..'); import s_readonly_server as s; print('tb02d_parse_pool_layout_matches', s._query_integrity()._CanonicalParsePool._layout_matches())"
          python -B -m unittest -v test_tb02d_contract test_tb02d_discovery test_tb02d_validate_once test_tb02d_parse_pool test_tb02d_key_reuse

  fixture-drift:
    # #265（#245 裁定）：Lean 源 → parity fixture 双向闭环的 CI 腿。
    # 锁的漂移窗口：Lean 源改了值、fixture 未重落盘时 parity 测试静默全绿。
    # 核心件 = #263 的 scripts/check_fixture_drift.py（本 job 只是把它包进 CI）。
    # formal 无 Mathlib（lakefile.toml packages=[]），构建轻：本机 macOS arm64 实测
    # 冷启动 lake build 12.2s（090 照实：CI ubuntu 未实测，预期分钟级，大头是
    # elan 工具链下载，已由 cache 兜住；若实测超 10 分钟需加 formal/.lake/build 缓存）。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('formal/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | bash -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build formal (lake build)
        # formal/lean-toolchain 固定 leanprover/lean4:v4.31.0，elan 首次调用自动装该工具链
        run: lake build
        working-directory: formal

      - name: Fixture drift check (Lean → fixtures)
        # 红时脚本自身打出字段级 diff + 每个漂移 fixture 的再生（重落盘）命令
        run: python3 scripts/check_fixture_drift.py

  sandcastle-ts:
    # #1588：Sandcastle 编排层（.sandcastle/*.ts|mts）类型检查与 node:test 单测。
    # 含评审提示体积闸（review-context）与本机 cargo 垫片（cargo-guard）回归；
    # 此前这些测试只在本机跑，CI 不覆盖。nc-remote 静态核在 runner 上无该脚本时 skip。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: typecheck (tsconfig.sandcastle.json)
        run: npm run typecheck
      - name: node:test — .sandcastle/*.test.{ts,mts}
        run: npx tsx --test .sandcastle/*.test.ts .sandcastle/*.test.mts
