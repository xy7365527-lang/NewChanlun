name: CI

on:
  push:
    branches: [main-rewritten]
  pull_request:
    branches: [main-rewritten]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # #324：LFS 对象**不在** checkout 里拉（不写 lfs: true）。
        #   .chanlun/block-topology/relations.jsonl 是 125 MB 的 LFS 对象；
        #   GitHub 免费额度 = 1 GB/月 LFS 流量 ⟹ lfs: true 每 run 必下 125 MB，
        #   约 8 run 就把整月额度打爆，且 checkout 发生在 cache 恢复之前，
        #   缓存永不命中。改成 checkout(不拉) → 恢复 .git/lfs 缓存 → git lfs pull：
        #   缓存命中时 pull 零下载，仅缓存 miss（LFS 指针变更）时才走一次 125 MB。

      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          # 指针内容变了才重下：relations.jsonl 的 LFS pointer 哈希即对象身份。
          key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}-${{ hashFiles('.chanlun/block-topology/relations.jsonl') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Fetch LFS objects
        # pull 失败时 relations.jsonl 停留为 pointer；tests/conftest.py 的
        # real_relations_usable 守卫会显式 skip 并打印原因，不会静默通过。
        continue-on-error: true
        run: git lfs pull

      - name: Grep gate — window-binding artifacts banned (G1)
        run: '! grep -rn "P101_TAG\|P101_MULTI\|cert_bsp_tag" rust/src/theta_v0/'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # #297：nautilus_trader 的 manylinux wheel 单体 182.5 MB，冷装占安装段大头。
          #   pip 的 HTTP cache 兜住它 ⟹ 二次跑起该 wheel 不再走网络。
          cache: pip
          cache-dependency-path: pyproject.toml

      # #297：newchan_rust 是本仓 rust/ 的 PyO3 扩展（maturin backend，
      #   rust/Cargo.toml crate-type = ["cdylib","rlib"]）。默认 feature 的依赖树只有
      #   28 个 crate（nautilus-* 全是 optional，仅 nautilus/backtest_bin feature 才拉），
      #   本机 macOS arm64 实测冷编译（registry 已暖）11.7s、target 产物 92 MB。
      #   ⟹ 缓存 registry + target 后二次跑接近零成本；CI ubuntu 2 核未实测，
      #   照实预估首跑 1.5–3 min（含 crates.io 下载 + maturin wheel 拉取）。
      #   前提：GitHub 托管 ubuntu runner 镜像自带 Rust 工具链（cargo/rustc stable），
      #   本步不另装；若某天镜像去掉 Rust，这里需补 rust-toolchain 安装步。
      - name: Cache cargo (registry + newchan_rust target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/newchan-rust-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        # #297 collection error 双真因（票体误并为一因，这里分列）：
        #   (1) tests/test_trading_system_skeleton.py
        #       → trading_system/execution/__init__.py → lmt_executor.py:18 顶层
        #         `from nautilus_trader.model.enums import ...` ⟹ 需 nautilus_trader。
        #       nautilus_trader **不在本仓**（.gitignore:93 明写 /nautilus_trader/ 是上游
        #       独立克隆，不作子模块入库），必须从 PyPI 装。
        #   (2) tests/test_topology/test_cross_national_pipeline.py
        #       → src/newchan/topology/cross_national_pipeline.py:39 顶层 `import newchan_rust`
        #       ⟹ 需本仓 rust/ 的 PyO3 扩展，与 nautilus 无关。
        #
        # 装法取舍（两案，取 A）：
        #   A. 预编 wheel（本步采用）——PyPI 已发 cp313 manylinux_2_35_x86_64 wheel
        #      （1.229.0，182.5 MB；ubuntu-latest glibc ≥ 2.35 满足），一行 pip install
        #      即可，**完全绕开 nautilus 的 Rust 源码编译**。
        #   B. 源码编译（未采用）——sdist 9 MB，但要拉 nautilus 全 Rust workspace，
        #      CI 上分钟级到十分钟级，无收益。
        #   版本锁 1.229.0：对齐本机上游克隆 ~/Projects/NewChanlun/nautilus_trader 的版本，
        #   避免 CI 随 PyPI 最新版（现 1.230.0）漂移。requires-python <3.15,>=3.12 与本 job 的 3.13 相容。
        #
        # 本机实测耗时（macOS arm64 / Python 3.13.9 / pip cache 暖；CI ubuntu 2 核会更慢）：
        #   pip install -e ".[test]"            1m16s
        #   pip install nautilus_trader==1.229  17.7s（含 156 MB macOS wheel 下载）
        #   pip install ./rust（maturin 冷编）   11.7s
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "nautilus_trader==1.229.0"
          CARGO_TARGET_DIR="$HOME/.cache/newchan-rust-target" pip install ./rust

      - name: Build and install newchan_rust extension
        run: pip install ./rust

      - name: Run tests with coverage
        # -rs 是 #324 的 090 要求：显式打印 skip 原因。
        run: pytest -m "not slow" --tb=short -q -rs --cov=newchan --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # #438：`cargo check --all-targets` 对 `required-features = ["backtest_bin"]`
  # 的 9 个 bin 是静默跳过（不报错不警告），曾造成合并后终态验证"全绿"却掩盖
  # 3×E0432 真实编译错误（#295 修复从未到达 main 即为一例）。本 job 补上被跳过
  # 的那一半验收面，使"required-features 的 bin 未被任何标准命令编译过"这类
  # 假绿在结构上不可再发生——无需人记得多带一个 flag。
  #
  # 覆盖边界（诚实披露，非本 job 职责；#471 于 2026-07-27 终态复验）：
  #   - 本 job 只保证「会被编译」，不保证「编译通过」。
  #   - 当前实测阻断：零。
  #   - 历史阻断（仍列出以闭合披露谱系，当前已修复）：
  #     1) `p108_interval_probe::main` 曾按结构字段读取枚举化后的 `OwnerRef`，
  #        产生 2×E0609（#470，af4d864c02，已修复，复验不再出现）。
  #     2) `econ_oddeven_diagnosis::collect_signals` 曾沿用旧 `LevelState` 初始化与
  #        `Rc<Vec<_>>` 访问方式，产生 E0277、2×E0308、E0063
  #        （#471，已修复，复验不再出现）。
  #     3) `pi_bsp_timing_cli_args_tests` 曾被当作独立 bin crate 编译，crate 根的
  #        `use super::{parse_cli_args, CliArgs}` 产生 E0433，且缺 `main` 产生 E0601；
  #        这是 default-targets 级阻断（#468，44a20222c4，已修复，复验不再出现）。
  #     4) `pure_bsp_timing::main` 对 `LevelState::bsp` 的旧迭代方式曾产生 E0277
  #        （#311，已修复，复验不再出现）。
  #     5) `pi_theta_fill_loop_overlay` 消费的 `coverage::TwStepCtx` re-export
  #        曾被误标 `#[cfg(test)]`，产生 E0422（#452，已修复，复验不再出现）。
  #   - 因此当前本 job 预期全绿；若 required-features 面再漂移，将从
  #     "静默跳过"变成"可见地失败"，并让修复状态随复验同步更新。
  rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + target（backtest_bin 拉 nautilus 系依赖较重）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check — default targets（required-features 未启用的 bin 不在内）
        run: cargo check --all-targets

      - name: cargo check — backtest_bin feature（#438：闭合 required-features 盲区）
        run: cargo check --all-targets --features backtest_bin

      - name: cargo fmt --check（#611：归零后防回潮）
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      # #810：`cargo check` 只保证编译、从不执行——34 个 Lean↔Rust parity 断言与
      # `rust/tests/nest_isolation_guard.rs` 的「违规即测试红」此前只编译不运行，
      # 锁形同虚设（成因定案见 #799 净发现①、#806）。
      #
      # ⚠ 本步落地时的诚实状态（2026-07-30，090 照实）：当前主线上
      #   `theta_v0_classifier_parity` 有 **2 条断言为红**
      #   （`type1_buy_broke_and_diverge_matches_lean_istype1` /
      #    `signal_extraction_emits_no_second_class_only`）——Lean 与 Rust 对
      #   「一类买点」判得不一样。**这是教义分歧不是实现 bug**，已立 #811，
      #   在 map #787 第二批买卖点概念票裁定之前 **不许修绿、不许加 #[ignore]、
      #   不许把它踢出本命令**。⟹ 本步接入后 CI 会红，且是**有意为之的红**：
      #   从「绿但测的是旧树」变成「红但是真的」。
      #
      # 耗时（本地实测，另一棵树上量得，量级参考）：default 干净重建 ~40s、
      # 增量 ~7s；backtest_bin 增量 ~59s（含 nautilus 依赖）。两步合计 <2min，
      # 与既有两步 cargo check 同预算 ⟹ 不做慢测试分层、不做仅 main 触发。
      # 既有 #[ignore]（theta_v0_fixture_drift、profile_*、oddeven_*_diagnosis 等
      # 需要 BTC 全量数据或 --release 的用例）维持现状，不在 #810 范围内摘除。
      - name: cargo test — default targets
        run: cargo test --all-targets

      - name: cargo test — backtest_bin feature（econ_oddeven_diagnosis.rs 仅在此 feature 下编译）
        run: cargo test --all-targets --features backtest_bin

  fixture-drift:
    # #265（#245 裁定）：Lean 源 → parity fixture 双向闭环的 CI 腿。
    # 锁的漂移窗口：Lean 源改了值、fixture 未重落盘时 parity 测试静默全绿。
    # 核心件 = #263 的 scripts/check_fixture_drift.py（本 job 只是把它包进 CI）。
    # formal 无 Mathlib（lakefile.toml packages=[]），构建轻：本机 macOS arm64 实测
    # 冷启动 lake build 12.2s（090 照实：CI ubuntu 未实测，预期分钟级，大头是
    # elan 工具链下载，已由 cache 兜住；若实测超 10 分钟需加 formal/.lake/build 缓存）。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('formal/lean-toolchain') }}

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | bash -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build formal (lake build)
        # formal/lean-toolchain 固定 leanprover/lean4:v4.31.0，elan 首次调用自动装该工具链
        run: lake build
        working-directory: formal

      - name: Fixture drift check (Lean → fixtures)
        # 红时脚本自身打出字段级 diff + 每个漂移 fixture 的再生（重落盘）命令
        run: python3 scripts/check_fixture_drift.py
