name: '#1419 三项精确候选验证 v2'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-1419-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 冻结来源、构建一次、三项逐名执行
        timeout-minutes: 40
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CARGO_INCREMENTAL: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B .github/scripts/run-1419-targeted-ci.py
      - name: 保存全部原件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1419-targeted-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/1419-targeted-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error
          include-hidden-files: true