name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# #1588（出处 PR #1485 的 Codex P2）：同一 PR 新推送即取消旧 run，免得过时 run 占满 runner。
#   非 PR 事件（push main、手动触发）的组键带 run_id，各自独占一组：既不取消、也不互相排队。
#   若组键用 github.ref，push main 虽不 cancel-in-progress，但同组只保留一个 pending，
#   连续合入时夹在中间的那次 run 会被新 run 顶替取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # #324：LFS 对象**不在** checkout 里拉（不写 lfs: true）。
        #   .chanlun/block-topology/relations.jsonl 是 125 MB 的 LFS 对象；
        #   GitHub 免费额度 = 1 GB/月 LFS 流量 ⟹ lfs: true 每 run 必下 125 MB，
        #   约 8 run 就把整月额度打爆，且 checkout 发生在 cache 恢复之前，
        #   缓存永不命中。改成 checkout(不拉) → 恢复 .git/lfs 缓存 → git lfs pull：
        #   缓存命中时 pull 零下载，仅缓存 miss（LFS 指针变更）时才走一次 125 MB。

      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          # 指针内容变了才重下：relations.jsonl 的 LFS pointer 哈希即对象身份。
          key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}-${{ hashFiles('.chanlun/block-topology/relations.jsonl') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Fetch LFS objects
        # pull 失败时 relations.jsonl 停留为 pointer；tests/conftest.py 的
        # real_relations_usable 守卫会显式 skip 并打印原因，不会静默通过。
        continue-on-error: true
        run: git lfs pull

      - name: Grep gate — window-binding artifacts banned (G1)
        run: '! grep -rn "P101_TAG\|P101_MULTI\|cert_bsp_tag" rust/src/theta_v0/'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # #297：nautilus_trader 的 manylinux wheel 单体 182.5 MB，冷装占安装段大头。
          #   pip 的 HTTP cache 兜住它 ⟹ 二次跑起该 wheel 不再走网络。
          cache: pip
          cache-dependency-path: pyproject.toml

      # #297：newchan_rust 是本仓 rust/ 的 PyO3 扩展（maturin backend，
      #   rust/Cargo.toml crate-type = ["cdylib","rlib"]）。默认 feature 的依赖树只有
      #   28 个 crate（nautilus-* 全是 optional，仅 nautilus/backtest_bin feature 才拉），
      #   本机 macOS arm64 实测冷编译（registry 已暖）11.7s、target 产物 92 MB。
      #   ⟹ 缓存 registry + target 后二次跑接近零成本；CI ubuntu 2 核未实测，
      #   照实预估首跑 1.5–3 min（含 crates.io 下载 + maturin wheel 拉取）。
      #   前提：GitHub 托管 ubuntu runner 镜像自带 Rust 工具链（cargo/rustc stable），
      #   本步不另装；若某天镜像去掉 Rust，这里需补 rust-toolchain 安装步。
      - name: Cache cargo (registry + newchan_rust target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/newchan-rust-target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        # #297 collection error 双真因（票体误并为一因，这里分列）：
        #   (1) tests/test_trading_system_skeleton.py
        #       → trading_system/execution/__init__.py → lmt_executor.py:18 顶层
        #         `from nautilus_trader.model.enums import ...` ⟹ 需 nautilus_trader。
        #       nautilus_trader **不在本仓**（.gitignore:93 明写 /nautilus_trader/ 是上游
        #       独立克隆，不作子模块入库），必须从 PyPI 装。
        #   (2) tests/test_topology/test_cross_national_pipeline.py
        #       → src/newchan/topology/cross_national_pipeline.py:39 顶层 `import newchan_rust`
        #       ⟹ 需本仓 rust/ 的 PyO3 扩展，与 nautilus 无关。
        #
        # 装法取舍（两案，取 A）：
        #   A. 预编 wheel（本步采用）——PyPI 已发 cp313 manylinux_2_35_x86_64 wheel
        #      （1.229.0，182.5 MB；ubuntu-latest glibc ≥ 2.35 满足），一行 pip install
        #      即可，**完全绕开 nautilus 的 Rust 源码编译**。
        #   B. 源码编译（未采用）——sdist 9 MB，但要拉 nautilus 全 Rust workspace，
        #      CI 上分钟级到十分钟级，无收益。
        #   版本锁 1.229.0：对齐本机上游克隆 ~/Projects/NewChanlun/nautilus_trader 的版本，
        #   避免 CI 随 PyPI 最新版（现 1.230.0）漂移。requires-python <3.15,>=3.12 与本 job 的 3.13 相容。
        #
        # 本机实测耗时（macOS arm64 / Python 3.13.9 / pip cache 暖；CI ubuntu 2 核会更慢）：
        #   pip install -e ".[test]"            1m16s
        #   pip install nautilus_trader==1.229  17.7s（含 156 MB macOS wheel 下载）
        #   pip install ./rust（maturin 冷编）   11.7s
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "nautilus_trader==1.229.0"
          CARGO_TARGET_DIR="$HOME/.cache/newchan-rust-target" pip install ./rust

      - name: Build and install newchan_rust extension
        run: pip install ./rust

      - name: Run tests with coverage
        # -rs 是 #324 的 090 要求：显式打印 skip 原因。
        run: pytest -m "not slow" --tb=short -q -rs --cov=newchan --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # #438：`cargo check --all-targets` 对 `required-features = ["backtest_bin"]`
  # 的 9 个 bin 是静默跳过（不报错不警告），曾造成合并后终态验证"全绿"却掩盖
  # 3×E0432 真实编译错误（#295 修复从未到达 main 即为一例）。本 job 补上被跳过
  # 的那一半验收面，使"required-features 的 bin 未被任何标准命令编译过"这类
  # 假绿在结构上不可再发生——无需人记得多带一个 flag。
  #
  # 覆盖边界（诚实披露，非本 job 职责；#471 于 2026-07-27 终态复验）：
  #   - 本 job 只保证「会被编译」，不保证「编译通过」。
  #   - 当前实测阻断：零。
  #   - 历史阻断（仍列出以闭合披露谱系，当前已修复）：
  #     1) `p108_interval_probe::main` 曾按结构字段读取枚举化后的 `OwnerRef`，
  #        产生 2×E0609（#470，af4d864c02，已修复，复验不再出现）。
  #     2) `econ_oddeven_diagnosis::collect_signals` 曾沿用旧 `LevelState` 初始化与
  #        `Rc<Vec<_>>` 访问方式，产生 E0277、2×E0308、E0063
  #        （#471，已修复，复验不再出现）。
  #     3) `pi_bsp_timing_cli_args_tests` 曾被当作独立 bin crate 编译，crate 根的
  #        `use super::{parse_cli_args, CliArgs}` 产生 E0433，且缺 `main` 产生 E0601；
  #        这是 default-targets 级阻断（#468，44a20222c4，已修复，复验不再出现）。
  #     4) `pure_bsp_timing::main` 对 `LevelState::bsp` 的旧迭代方式曾产生 E0277
  #        （#311，已修复，复验不再出现）。
  #     5) `pi_theta_fill_loop_overlay` 消费的 `coverage::TwStepCtx` re-export
  #        曾被误标 `#[cfg(test)]`，产生 E0422（#452，已修复，复验不再出现）。
  #   - 因此当前本 job 预期全绿；若 required-features 面再漂移，将从
  #     "静默跳过"变成"可见地失败"，并让修复状态随复验同步更新。
  # #1588：原 rust-check 单 job 串行全部 Rust 步，main run 39358379553 全程约 2h10m（150 分钟上限只剩 20 分钟）。
  # 拆成下列并行 job，每个 job 独立 runner、独立磁盘（#1141 磁盘峰值随之下降），步骤与命令逐条保留：
  #   rust-check                      编译检查 + fmt + 两个 CI 脚本自测
  #   rust-test-default               cargo test 默认目标
  #   rust-test-s-session (shard i)   s_session bin 测试按测试名分片（test-shard.py，并集 == 全集当场断言）
  #   rust-test-s-session-coverage    汇总各片产物，再断言一次并集 == 全集、各片执行集 == 分配集
  #   rust-test-s-session-extras      s_session 的 TB-02-C、库/集成测试、TestOnly 特性增量、v3 history
  #   rust-test-backtest-bin          backtest_bin feature 的库测试
  # 拆前 s_session bin 一步 89 分钟里，执行占 88 分钟、编译约 1 分钟；其中两条测试独占尾部
  # （tb02w_killed_case_two_scan_budget_resume_and_recover 约 69 分钟、tb02c_persistent_first_kind_and_normal_recovery
  # 约 49 分钟），其余 505 条在开跑 41 分钟内全部结束。分片后最长 job 的下限即最慢那条测试本身。
  # 拆后实测：最长 job 为只含 tb02w 的分片，耗时主要看 runner 机型——
  # PR run 39382771454 落在 EPYC 9V45，tb02w 1755s、job 31 分钟；PR run 39386754336 落在 EPYC 7763，tb02w 3877s、job 67 分钟。
  # 拆前 timeout 150（7e914f1e55，容纳单 job 全程）；拆后按各 job 实测分别设上限，仍兼作 #1406 挂死保护。
  rust-check:
    runs-on: ubuntu-latest
    # #1406 防遥测采样进程挂死的上限；本 job 拆后只剩检查类步骤，正常约 3 分钟。
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Test cargo telemetry wrapper (#1141)
        run: ../.github/scripts/test-run-cargo-with-telemetry.sh

      - name: Test s_session shard planner (#1588)
        run: python3 ../.github/scripts/test_test_shard.py -v

      - uses: ./.github/actions/rust-job-setup

      # #1608：告警清零后防回潮——三档 cargo check 以 -D warnings 运行，任何新告警即红。
      #   依赖由 cargo 以 --cap-lints 处理，不受影响。工具链未钉死：stable 新增 lint 也会在此暴露，
      #   届时按真信号修，不得回退为整体 allow。
      - name: cargo check — default targets（required-features 未启用的 bin 不在内）
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -x
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true
          cargo check --all-targets
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      - name: cargo check — backtest_bin feature（#438：闭合 required-features 盲区）
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -x
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true
          cargo check --all-targets --features backtest_bin
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      - name: cargo check — s_session feature（#1608：S 会话面告警此前只在 test 步骤编译、不设门）
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -x
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true
          cargo check --all-targets --features s_session
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

      # #1640（ADR 0042 D1）：S 写者增量生产构建；testonly = 增量 + 测试钩子，此步只验生产形态。
      - name: cargo check — s_session,s_incremental 生产增量构建（#1640）
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets --features s_session,s_incremental

      # #1640 §2.3 第 2 层：生产增量构建不含测试钩子（源码机检，不编译）。
      - name: 生产增量构建无测试钩子（#1640）
        working-directory: .
        run: python3 .github/scripts/check-prod-no-test-hooks.py

      # #1640 §2.3 第 2 层检查器自身的单测（cfg 求值、ROOTS、门控判定）。
      - name: 生产增量构建无测试钩子检查器单测（#1640）
        working-directory: .
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_prod_no_test_hooks*.py'

      - name: cargo fmt --check（#611：归零后防回潮）
        run: |
          set -x
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true
          rustup component add rustfmt
          cargo fmt --all -- --check
          free -b
          df -B1 -T .
          du -sx -B1 target 2>/dev/null || true

  # #810：`cargo check` 只保证编译、从不执行——34 个 Lean↔Rust parity 断言与
  # `rust/tests/nest_isolation_guard.rs` 的「违规即测试红」此前只编译不运行，
  # 锁形同虚设（成因定案见 #799 净发现①、#806）。
  #
  # #993 已把历史上的两条 parity 失败修绿；当前本步预期全绿，任何失败都是真回归。
  # 既有 #[ignore]（theta_v0_fixture_drift、profile_*、oddeven_*_diagnosis 等
  # 需要 BTC 全量数据或 --release 的用例）维持现状，不在 #810 范围内摘除。
  rust-test-default:
    runs-on: ubuntu-latest
    # 拆前本步约 8.8 分钟（run 39358379553）。
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-job-setup

      # #1563：--no-fail-fast——lib 目标的既有红（m3_partition_synthetic_holds，归 #1487/#1493）
      # 不再让其后的 bin / tests 目标被跳过；本步仍按任一失败判红，不掩盖。
      - name: cargo test — default targets
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --all-targets --no-fail-fast --jobs 1

  # #1370：s_session 的 required-features 不在 default/backtest_bin 中启用。
  # 运行正式 S bin 的回归测试，不能只编译或以默认目标的通过代替。
  # #1394 根裁定 A：v3::financial_session 依赖只在 macOS 实现的会话保留量读数（heap_probe）与
  #   peer uid（getpeereid），Linux 上 Session::start 诚实地报 MissingDependency。这批用例在本步
  #   --skip，由 .github/workflows/ci-macos.yml 的 macOS 作业在生产平台真跑（手动触发本 CI 时经
  #   下方 macos-session 作业一并执行；push main 由该文件自身的 paths 过滤触发）。
  # #1588：按测试名分片。全集每片现场 `--list` 动态生成（不维护静态清单），按
  #   .github/scripts/s-session-test-weights.tsv 的实测耗时做 LPT 分配；权重只管均衡、不管覆盖，
  #   表外新测试取中位数权重照常入片。改片数须同时改 matrix.shard 与 S_SESSION_SHARDS。
  rust-test-s-session:
    name: rust-test-s-session (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # 最慢那片只含 tb02w 一条长测试：独占 runner 实测 31 分钟（EPYC 9V45）到 67 分钟（EPYC 7763，已见最慢机型），含编译。
    # 上限只作挂死保护，按最慢机型读数留约 40% 余量（「有余量」看实测时长，不看本值）。
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_INCREMENTAL: "0"
      S_SESSION_SHARDS: "4"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-job-setup

      - name: cargo test — s_session 正式结构会话 分片 ${{ matrix.shard }}（#1370、#1588）
        run: >-
          ../.github/scripts/run-cargo-with-telemetry.sh
          python3 ../.github/scripts/test-shard.py run
          --index ${{ matrix.shard }} --count "$S_SESSION_SHARDS"
          --weights ../.github/scripts/s-session-test-weights.tsv
          --out "$RUNNER_TEMP/s-session-shard"
          --skip v3::financial_session
          -- --locked --features s_session --bin s_structure_session --jobs 1

      - name: Upload shard plan and results (#1588)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: s-session-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/s-session-shard
          # 单片 re-run 时替换首次尝试已传的同名产物，否则重名冲突把通过的重跑判红。
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  # #1588：防漏测的第二道门。各片在自己 job 内已断言「分片两两不交、并集 == 全集」与「执行集 == 分配集」；
  #   这里拿各片实际产物再核一次，并确认各片看到的全集一致、片数齐全（某片被取消或漏传产物即红）。
  rust-test-s-session-coverage:
    runs-on: ubuntu-latest
    needs: rust-test-s-session
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    env:
      S_SESSION_SHARDS: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: s-session-shard-*
          path: ${{ runner.temp }}/s-session-shards

      - name: Verify shard union == full test set (#1588)
        run: python3 .github/scripts/test-shard.py verify --count "$S_SESSION_SHARDS" "$RUNNER_TEMP"/s-session-shards/s-session-shard-*

  # #1722：extras 串行累计触顶 60 分钟；按独立输入拆组，各组仍有 60 分钟截止。
  #   max-parallel=1 保持原 extras 同时最多一个 runner；失败不取消后续组。
  rust-test-s-session-extra-groups:
    name: rust-test-s-session-extras (${{ matrix.group }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [content, economic, native, owned]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-job-setup

      # #1404：成员来源回归单列先执行，避免已登记的默认域失败使本片新锁被跳过。
      #   #1588：该用例同时在 S bin 分片里执行（拆前即两处执行），本步保留其独立可见的信号。
      - name: cargo test — TB-02-C member source binding
        if: ${{ !cancelled() && matrix.group == 'content' }}
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --bin s_structure_session tb02c_member_relations_bind_only_the_member_sources --jobs 1

      # #1608：#1394 的两个编译负例只在 --cfg 下编译；此处断言它们仍被类型边界拒绝（E0308 落在负例块内）。
      #   放在 TB-02-C 单测之后复用已编好的 s_session 依赖；负例在类型检查阶段即失败，不做代码生成。
      - name: 编译负例 — #1394 类型边界仍拒绝旧写法（#1608）
        if: ${{ !cancelled() && matrix.group == 'content' }}
        run: ../.github/scripts/check-compile-negatives-1394.sh

      # #1394 C：内容编码在 s_session feature 下供多个 owner 共用；只测 S bin 不会执行库测试。
      - name: cargo test — 完整内容编码与共享图校验（#1394）
        if: ${{ !cancelled() && matrix.group == 'content' }}
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --lib --jobs 1 s_content

      - name: cargo test — 内容向量、持久序列与累计资源（#1394）
        if: ${{ !cancelled() && matrix.group == 'content' }}
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --test s_content_contract --test s_content_sequence --test s_content_job --test s_content_path --jobs 1

      # #1394 G-1：economic_session（含 P-14 读法锁、finance、content_store、store、finance_transport）
      #   与 session_transport / session_protocol 的库测试此前没有任何 CI 步执行。2026-10-14 在 Linux
      #   （glibc 2.36 容器）实跑：74 过、7 忽略（需 HFS 载体或外部夹具）、0 败，无需 --skip；只在 macOS
      #   编译的 1 条（half_close_during_large_frame_drain_observes_actual_eof）与各 macOS 专属分支由
      #   ci-macos.yml 作业覆盖。
      - name: cargo test — economic_session / session_transport / session_protocol 库测试（#1394 G-1）
        if: ${{ !cancelled() && matrix.group == 'economic' }}
        run: ../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session --lib --jobs 1 -- economic_session session_transport session_protocol

      # #1394/#1481：s_capture_native_testonly 特性下才编译的测试（2026-10-14 计：lib 26、S bin 174）此前从未编译、
      #   从未执行（state.rs 测试调用漏传 cfg 参数，开特性即 E0061）。只跑「开特性后新增」的测试，其余同名同体测试
      #   已在 rust-test-s-session 各分片执行；新增集合为空即失败。拆前 CI 实测 15.4 分钟（run 39358379553）。
      - name: cargo test — s_capture_native_testonly 特性新增的测试（#1394）
        if: ${{ !cancelled() && matrix.group == 'native' }}
        run: ../.github/scripts/run-cargo-with-telemetry.sh ../.github/scripts/test-feature-delta.sh s_capture_native_testonly

      # #1640：生产增量构建的编译期模式、`/2` 资源档与出生锁在无测试钩子 feature 下另跑一遍（env 选择臂只在 testonly）。
      - name: cargo test — s_incremental 生产增量构建（#1640）
        if: ${{ !cancelled() && matrix.group == 'native' }}
        run: '../.github/scripts/run-cargo-with-telemetry.sh cargo test --locked --features s_session,s_incremental --bin s_structure_session --jobs 1 -- s_allocation:: s3_serve incremental_build_full_branch_only_at_birth build_profile'

      # #1640 §2.3 第 3 层（产物机检）：不 strip 的生产增量 release 构建，nm 子串与禁串（固定＋自动抽取清单）零命中。
      #   复用本作业 rust/target；Cargo.toml 的 release profile 不设 strip，符号表保留。
      - name: 生产增量 release 产物无测试钩子（#1640）
        if: ${{ !cancelled() && matrix.group == 'native' }}
