# #1875 probe branch only: which node does each runner class put on PATH?
name: CI
'on':
  workflow_dispatch: null
jobs:
  node-version:
    strategy:
      matrix:
        runner: [ubuntu-latest, 'boat-large/from=hc-gate-base']
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          for n in $(type -ap node) /usr/local/bin/node /usr/bin/node; do [ -x "$n" ] && echo "$n -> $(readlink -f $n) $($n --version) sha=$(sha256sum $(readlink -f $n) | cut -c1-16)"; done
          echo "PATH=$PATH"
          grep -m1 "model name" /proc/cpuinfo; ldd --version | head -1
