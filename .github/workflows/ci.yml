name: CI

on:
  push:
    branches: [main-rewritten]
  pull_request:
    branches: [main-rewritten]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Grep gate — window-binding artifacts banned (G1)
        run: '! grep -rn "P101_TAG\|P101_MULTI\|cert_bsp_tag" rust/src/theta_v0/'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest -m "not slow" --tb=short -q --cov=newchan --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # #438：`cargo check --all-targets` 对 `required-features = ["backtest_bin"]`
  # 的 9 个 bin 是静默跳过（不报错不警告），曾造成合并后终态验证"全绿"却掩盖
  # 3×E0432 真实编译错误（#295 修复从未到达 main 即为一例）。本 job 补上被跳过
  # 的那一半验收面，使"required-features 的 bin 未被任何标准命令编译过"这类
  # 假绿在结构上不可再发生——无需人记得多带一个 flag。
  #
  # 覆盖边界（诚实披露，非本 job 职责；#458 于 2026-07-27 复验）：
  #   - 本 job 只保证「会被编译」，不保证「编译通过」。
  #   - 当前实测阻断：
  #     1) `p108_interval_probe::main` 读取 `OwnerRef::{start_index,end_index}`，
  #        但当前类型无这两个字段，产生 2×E0609（#470）。
  #     2) `econ_oddeven_diagnosis::collect_signals` 沿用旧 `LevelState` 初始化与
  #        `Rc<Vec<_>>` 访问方式，产生 E0277、2×E0308、E0063（#471）。
  #     3) `pi_bsp_timing_cli_args_tests` 被当作独立 bin crate 编译，crate 根的
  #        `use super::{parse_cli_args, CliArgs}` 产生 E0433，且缺 `main` 产生 E0601；
  #        这是 default-targets 级阻断（#468）。
  #   - 历史阻断（仍列出以闭合披露谱系，当前已修复）：
  #     4) `pure_bsp_timing::main` 对 `LevelState::bsp` 的旧迭代方式曾产生 E0277
  #        （#311，已修复，复验不再出现）。
  #     5) `pi_theta_fill_loop_overlay` 消费的 `coverage::TwStepCtx` re-export
  #        曾被误标 `#[cfg(test)]`，产生 E0422（#452，已修复，复验不再出现）。
  #   - 因此当前本 job 预期仅因 #470、#471、#468 为红：把已经存在的破损从
  #     "静默跳过"变成"可见地失败"，并让修复状态随复验同步更新。
  rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + target（backtest_bin 拉 nautilus 系依赖较重）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check — default targets（required-features 未启用的 bin 不在内）
        run: cargo check --all-targets

      - name: cargo check — backtest_bin feature（#438：闭合 required-features 盲区）
        run: cargo check --all-targets --features backtest_bin
