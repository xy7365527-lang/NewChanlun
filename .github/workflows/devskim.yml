# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '36 18 * * 1'

# #1875：同一 PR 推新 head 时取消旧 head 的扫描（与 ci.yml 同一写法）；push main 与定时任务按 run_id 各自成组，
#   不互相取消。扫描曾卡死并跑满 6 小时默认时限、占住托管 runner；成功运行实测最长 889 s（近 24 次，中位 725 s），
#   故设 30 分钟上限。扫描内容、零发现门与误报清单不变。
concurrency:
  group: devskim-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build reproducible DevSkim scanner image
        id: build_scanner
        # #1111 fix: self-managed scanner runtime. microsoft/DevSkim-Action@<commit>
        # is commit-pinned, but its own Dockerfile pins neither the base image
        # (mutable `sdk:8.0`) nor the CLI (`dotnet tool install` without --version),
        # so the action commit does not pin what actually scans. .github/devskim/
        # pins both axes: base image digest 306301580f... and CLI 1.0.90 (SARIF
        # driver 1.0.90+fb2d676ce4). The gate re-asserts that identity fail-loud.
        shell: bash
        run: |
          docker build \
            --tag devskim-scanner:1.0.90 \
            --file .github/devskim/Dockerfile \
            .github/devskim

      - name: Run DevSkim scanner
        id: devskim
        # Every ignore-glob has path-specific provenance in the #1111 baseline report.
        # The zero-findings gate remains unchanged; this removes only derived fixtures,
        # ignored tmp material, and byte-identical/upstream-locked third-party skills.
        # #1588: no directory-level exclusion for the review archive or test data
        # (user decision 2026-10-21, consistent with #1474 "no pass by directory alone").
        # Existing findings in .chanlun/review-results/** and
        # s_session/tests/fixtures/**/*.json{,l} are appended to
        # .github/devskim-baseline.json as exact rule|path|line keys; files written
        # there later are still scanned. Evidence and full-population credential scan:
        # .chanlun/review-results/eng-debt-20261020/devskim/DEVSKIM-TRIAGE.md
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            devskim-scanner:1.0.90 \
            /workspace \
            /workspace/devskim-results.sarif \
            "**/.git/**,**/bin/**,**/.chanlun/block-topology/concept_registry.json,**/.chanlun/block-topology/morse_landscape.json,**/.chanlun/block-topology/meta.json,**/.chanlun/concept_registry.json,**/skills-lock.json,**/chanlun/review-results/treasury-reverify-t1-armR-trades-golden-20260727.json,**/tmp/**,**/.claude/skills/brainstorming/**,**/.agents/skills/diagnosing-bugs/**,**/.claude/skills/diagnosing-bugs/**"

      - name: Upload DevSkim SARIF as an ordinary Actions artifact
        id: upload_devskim_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devskim-sarif
          path: devskim-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce zero-findings gate and write summary
        if: always()
        shell: bash
        run: |
          scripts/devskim_sarif_gate.sh \
            --sarif devskim-results.sarif \
            --scanner-outcome '${{ steps.devskim.outcome }}' \
            --artifact-name devskim-sarif \
            --artifact-outcome '${{ steps.upload_devskim_artifact.outcome }}' \
            --retention-days 14 \
            --expected-tool-name 'devskim' \
            --expected-tool-version '1.0.90+fb2d676ce4' \
            --baseline .github/devskim-baseline.json \
            --false-positives .github/devskim-reviewed-1488.json \
            --source-root "$GITHUB_WORKSPACE" \
            --summary "$GITHUB_STEP_SUMMARY"
