# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '36 18 * * 1'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run DevSkim scanner
        id: devskim
        uses: microsoft/DevSkim-Action@v1

      - name: Upload DevSkim SARIF as an ordinary Actions artifact
        id: upload_devskim_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devskim-sarif
          path: devskim-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce zero-findings gate and write summary
        if: always()
        shell: bash
        run: |
          scripts/devskim_sarif_gate.sh \
            --sarif devskim-results.sarif \
            --scanner-outcome '${{ steps.devskim.outcome }}' \
            --artifact-name devskim-sarif \
            --artifact-outcome '${{ steps.upload_devskim_artifact.outcome }}' \
            --retention-days 14 \
            --summary "$GITHUB_STEP_SUMMARY"
