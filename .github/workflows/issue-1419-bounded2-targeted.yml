name: issue-1419 bounded2 targeted
on:
  push:
    branches: [codex/1419-p2-clean32a]
permissions:
  contents: read
jobs:
  bounded2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-job-setup
      - name: Format changed Rust files and retain patch
        run: |
          set -o pipefail
          mkdir -p ../bounded2-evidence
          git diff --name-only 411db6035fd974e269ccef0a2d8f39ce6ed22110 HEAD -- '*.rs' | while read -r path; do
            rustfmt --edition 2021 --config skip_children=true "../$path"
          done
          git diff -- '*.rs' > ../bounded2-evidence/rustfmt.patch
      - name: Upload Linux formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: issue-1419-format-${{ github.sha }}
          path: bounded2-evidence/rustfmt.patch
          retention-days: 7
      - name: Exact bounded2 behavior locks
        run: |
          set -o pipefail
          cargo test --locked --release --features s_session --bin s_structure_session --jobs 1 --no-run 2>&1 | tee ../bounded2-evidence/compile.log
          failed=0
          while read -r test; do
            log="../bounded2-evidence/${test//::/_}.log"
            if ! cargo test --locked --release --features s_session --bin s_structure_session --jobs 1 -- --ignored --exact "$test" --nocapture 2>&1 | tee "$log"; then failed=1; fi
            if ! grep -F 'test result: ok. 1 passed;' "$log"; then failed=1; fi
          done <<'TESTS'
          v3::financial_session::tests::w2_prefix_cost_probe
          TESTS
          exit "$failed"
      - name: Build formal binary
        run: cargo build --locked --release --features s_session --bin s_structure_session --jobs 1
      - name: Require submitted source formatting
        run: test ! -s ../bounded2-evidence/rustfmt.patch
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1419-bounded2-${{ github.sha }}
          path: |
            bounded2-evidence/
            rust/target/release/s_structure_session
          retention-days: 7
