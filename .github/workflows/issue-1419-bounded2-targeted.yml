name: issue-1419 bounded2 targeted
on:
  push:
    branches: [codex/1419-p2-clean32a]
permissions:
  contents: read
jobs:
  bounded2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-job-setup
      - name: Format changed Rust files and retain patch
        run: |
          set -o pipefail
          mkdir -p ../bounded2-evidence
          git diff --name-only 411db6035fd974e269ccef0a2d8f39ce6ed22110 HEAD -- '*.rs' | while read -r path; do
            rustfmt --edition 2021 --config skip_children=true "../$path"
          done
          git diff -- '*.rs' > ../bounded2-evidence/rustfmt.patch
      - name: Upload Linux formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: issue-1419-format-${{ github.sha }}
          path: bounded2-evidence/rustfmt.patch
          retention-days: 7
      - name: Writer lifecycle and archive integrity locks
        run: |
          set -euo pipefail
          python3 ../.github/scripts/test-w2-runtime-process.py -v 2>&1 | tee ../bounded2-evidence/process-locks.log
      - name: Material pool semantics and fixed resource locks
        run: |
          set -euo pipefail
          cargo test --locked --release --features s_session --bin s_structure_session --jobs 1 -- v3::ordinary_materials::tests --nocapture 2>&1 | tee ../bounded2-evidence/material-locks.log
          grep -F 'test result: ok. 11 passed;' ../bounded2-evidence/material-locks.log
      - name: Original strict bounded2 behavior locks
        run: |
          set -euo pipefail
          for test in v3::generation::tests::bounded2_crosswalk_rejects_non_w_subject_and_fractal_changes v3::generation::tests::w_semantics_layout_neutral_between_layout1_and_bounded; do
            log="../bounded2-evidence/${test//::/_}.log"
            cargo test --locked --release --features s_session,s_capture_native_testonly,s_allocation_json_testonly --bin s_structure_session --jobs 1 -- --exact "$test" --nocapture 2>&1 | tee "$log"
            grep -F 'test result: ok. 1 passed;' "$log"
          done
      - name: Build formal binary
        run: cargo build --locked --release --features s_session --bin s_structure_session --jobs 1
      - name: Require submitted source formatting
        run: test ! -s ../bounded2-evidence/rustfmt.patch
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1419-bounded2-${{ github.sha }}
          path: |
            bounded2-evidence/*.log
            bounded2-evidence/rustfmt.patch
            rust/target/release/s_structure_session
          retention-days: 7
