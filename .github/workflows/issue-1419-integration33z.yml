name: issue-1419 integration33z
on:
  push:
    branches: [codex/1419-audit-proof33x]
permissions:
  contents: read
jobs:
  owned-three:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-D warnings"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-job-setup
      - name: Development previous-unit and adjacent contracts
        run: |
          set -o pipefail
          mkdir -p ../owned34p
          git rev-parse HEAD | tee ../owned34p/head.txt
          cargo test --locked --features s_session,s_allocation_json_testonly --bin s_structure_session --no-run
          cargo test --locked --features s_session,s_allocation_json_testonly --bin s_structure_session -- development_tests --test-threads 1 --nocapture 2>&1 | tee ../owned34p/development35a.log
          grep -q '6 passed; 0 failed' ../owned34p/development35a.log
          cargo test --locked --features s_session,s_allocation_json_testonly --bin s_structure_session -- v3::source_audit::tests::local_some_keeps_sql_f_budget_error_order_and_deadline_before_sql --exact --test-threads 1 --nocapture 2>&1 | tee ../owned34p/some.log
          grep -q 'running 1 test' ../owned34p/some.log
          cargo test --locked --features s_session,s_allocation_json_testonly --lib -- s_content::sqlite_audit::tests --test-threads 1 --nocapture 2>&1 | tee ../owned34p/sqlite-base.log
      - name: Strict affected feature compilation
        if: always()
        run: |
          set -o pipefail
          failed=0
          for features in s_session s_session,s_incremental s_session,s_capture_native_testonly,s_allocation_json_testonly; do
            cargo check --locked --tests --lib --bin s_structure_session --features "$features" 2>&1 | tee "../owned34p/check-$features.log" || failed=1
          done
          exit "$failed"
      - name: Record Linux formatting
        if: always()
        run: |
          git diff --name-only 0476045d3f033f8adb2b5fc892b4492a98e6b762 HEAD -- '*.rs' | while read -r path; do
            rustfmt --edition 2021 --config skip_children=true "../$path"
          done
          git diff -- '*.rs' > ../owned34p/rustfmt.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned34p-${{ github.sha }}
          path: owned34p/
