name: issue-1419 integration33z
on:
  push:
    branches: [codex/1419-audit-proof33x]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        features: [s_session, "s_session,s_incremental", "s_session,s_capture_native_testonly,s_allocation_json_testonly"]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-job-setup
      - name: Check combined interfaces
        run: |
          set -o pipefail
          mkdir -p ../integration33z
          cargo check --locked --tests --bin s_structure_session --features '${{ matrix.features }}' --message-format=json 2>../integration33z/stderr.log | tee ../integration33z/check.jsonl
      - name: Run targeted combined contracts
        run: |
          set -o pipefail
          features='${{ matrix.features }}'
          if [ "$features" = s_session ]; then
            filters=''
          elif [ "$features" = s_session,s_incremental ]; then
            filters='structure_fact_real_budget_preserves_origin_through_bi_error w_prior_real_budget_preserves_origin_to_publication_verdict withdrawal_target_real_budget_preserves_origin_to_publication_verdict publication_origin_survives_clone_and_two_contexts publication_same_text_without_origin_rejects structure_rule_ ordinary_proof_ ordinary_material_whole_readonly_audit_heap_releases'
          else
            filters='structure_domain_wires_versions_knowledge_axes_and_rejects_foreign_prior structure_fact_real_budget_preserves_origin_through_bi_error ordinary_source::tests structure_value::tests native_cut_projection_gate_ bounded2_crosswalk_rejects_non_w_subject_and_fractal_changes'
          fi
          failed=0
          for filter in $filters; do
            cargo test --locked --bin s_structure_session --features "$features" "$filter" -- --nocapture --test-threads=1 2>&1 | tee -a ../integration33z/tests.log || failed=1
          done
          exit "$failed"
      - name: Record Linux formatting
        if: always()
        run: |
          git diff --name-only c200ce2999e97596b8cd1f24d1873decb6fedbb3 HEAD -- '*.rs' | while read -r path; do
            rustfmt --edition 2021 --config skip_children=true "../$path"
          done
          git diff -- '*.rs' > ../integration33z/rustfmt.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration33z-${{ matrix.features }}
          path: integration33z/

  origin-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: Reproduce old resource-origin erasure
        run: |
          python3 .github/scripts/reproduce-1419-origin33z.py
          mkdir -p origin-red
          cd rust
          for filter in w_prior_real_budget_preserves_origin_to_publication_verdict withdrawal_target_real_budget_preserves_origin_to_publication_verdict; do
            if cargo test --locked --bin s_structure_session --features s_session,s_incremental "$filter" -- --nocapture --test-threads=1 > "../origin-red/$filter.log" 2>&1; then
              echo "old erasure unexpectedly passed $filter"
              exit 1
            fi
            grep -F "test result: FAILED. 0 passed; 1 failed;" "../origin-red/$filter.log"
            grep -F "trace.only_resource() && trace.bridges(error)" "../origin-red/$filter.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: origin-red
          path: origin-red/
