# #1419 W2×H1 集成线只测量诊断（stack_diag46y）：定位
#   v3::audit_owner::construction_tests::h1_admission_driver_cold_recover_rebuilds_ledger_bitwise
#   在 debug（features s_session,s_capture_native_testonly）下栈溢出的增长来源。
#   只在 codex/1419-stack-diag46y* 诊断分支上运行；不改 ci.yml、不改 Rust 源码。
#   RUST_MIN_STACK 只作测量。
name: issue-1419-stack-diag46y

on:
  push:
    branches: ['codex/1419-stack-diag46y**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      FEATURES: s_session,s_capture_native_testonly
      TEST_NAME: v3::audit_owner::construction_tests::h1_admission_driver_cold_recover_rebuilds_ledger_bitwise
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-job-setup

      - name: Build debug test binary (same features/profile as failing step)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diag"
          echo "head=$(git rev-parse HEAD) parent=$(git rev-parse HEAD^)" | tee "$RUNNER_TEMP/diag/head.txt"
          cargo test --locked --features "$FEATURES" --bin s_structure_session --jobs 2 --no-run \
            --message-format=json-render-diagnostics >"$RUNNER_TEMP/diag/build.json"
          bin=$(python3 - "$RUNNER_TEMP/diag/build.json" <<'PY'
          import json, sys
          exe = None
          for line in open(sys.argv[1]):
              try:
                  m = json.loads(line)
              except Exception:
                  continue
              if m.get("reason") == "compiler-artifact" and m.get("target", {}).get("name") == "s_structure_session" \
                      and m.get("profile", {}).get("test") and m.get("executable"):
                  exe = m["executable"]
          print(exe)
          PY
          )
          echo "BIN=$bin" | tee -a "$GITHUB_ENV" "$RUNNER_TEMP/diag/head.txt"
          ls -l "$bin"
          "$bin" --list --exact "$TEST_NAME" | tee "$RUNNER_TEMP/diag/list.txt"
          grep -Fx "$TEST_NAME: test" "$RUNNER_TEMP/diag/list.txt"

      - name: Reproduce CI form (default stack, captured output)
        run: |
          set +e
          start=$(date +%s)
          timeout 1800 "$BIN" --exact "$TEST_NAME" --test-threads 1 >"$RUNNER_TEMP/diag/ci-form-default.log" 2>&1
          rc=$?
          echo "ci_form_default rc=$rc secs=$(( $(date +%s) - start ))" | tee "$RUNNER_TEMP/diag/ci-form.txt"
          tail -n 20 "$RUNNER_TEMP/diag/ci-form-default.log"
          exit 0

      - name: RUST_MIN_STACK scan + bisect (nocapture, probes visible)
        run: |
          set +e
          out="$RUNNER_TEMP/diag"
          res="$out/results.tsv"
          printf 'stack_bytes\tverdict\trc\tsecs\tlast_probe\n' >"$res"
          run() {
            local s="$1" log="$out/run-$1.log" rc start verdict
            start=$(date +%s)
            if [ "$s" = default ]; then
              env -u RUST_MIN_STACK timeout 1800 "$BIN" --exact "$TEST_NAME" --test-threads 1 --nocapture >"$log" 2>&1
            else
              RUST_MIN_STACK="$s" timeout 1800 "$BIN" --exact "$TEST_NAME" --test-threads 1 --nocapture >"$log" 2>&1
            fi
            rc=$?
            if grep -q 'has overflowed its stack' "$log"; then verdict=overflow
            elif [ $rc -eq 0 ] && grep -q 'test result: ok. 1 passed' "$log"; then verdict=pass
            else verdict=other; fi
            last=$(grep -o 'H1_STACK_PROBE [^ ]* used=[0-9]*' "$log" | tail -n 1 | tr ' ' '_')
            printf '%s\t%s\t%s\t%s\t%s\n' "$s" "$verdict" "$rc" "$(( $(date +%s) - start ))" "$last" | tee -a "$res"
            RUN_VERDICT=$verdict
          }
          run default
          MiB=1048576
          lo=0; hi=0
          for m in 2 3 4 6 8 12 16 24 32 48 64; do
            run $(( m * MiB ))
            if [ "$RUN_VERDICT" = pass ]; then hi=$(( m * MiB )); break; fi
            if [ "$RUN_VERDICT" = overflow ]; then lo=$(( m * MiB )); fi
          done
          echo "coarse lo(overflow)=$lo hi(pass)=$hi"
          if [ "$hi" -gt 0 ]; then
            while [ $(( hi - lo )) -gt 65536 ]; do
              mid=$(( (lo + hi) / 2 / 65536 * 65536 ))
              [ "$mid" -le "$lo" ] && mid=$(( lo + 65536 ))
              run "$mid"
              if [ "$RUN_VERDICT" = pass ]; then hi=$mid; elif [ "$RUN_VERDICT" = overflow ]; then lo=$mid; else echo "non-binary verdict at $mid"; break; fi
            done
          fi
          echo "min_pass_stack_bytes=$hi max_overflow_stack_bytes=$lo" | tee "$out/min-stack.txt"
          exit 0

      - name: Probe readings at large stack
        run: |
          set +e
          RUST_MIN_STACK=$(( 256 * 1048576 )) timeout 1800 "$BIN" --exact "$TEST_NAME" --test-threads 1 --nocapture \
            >"$RUNNER_TEMP/diag/probe-256MiB.log" 2>&1
          echo "rc=$?"
          grep 'H1_STACK_PROBE' "$RUNNER_TEMP/diag/probe-256MiB.log" | tee "$RUNNER_TEMP/diag/probe-256MiB.txt"
          exit 0

      - name: Per-function frame sizes from the same binary (objdump prologue)
        run: |
          set +e
          cat >"$RUNNER_TEMP/frames.py" <<'PY'
          import re, sys
          head = re.compile(r'^[0-9a-f]+ <(.*)>:$')
          sub = re.compile(r'\bsub\s+\$0x([0-9a-f]+),%(rsp|r11)\b')
          rows = []
          name = None; n = 0; r11 = 0; rsps = []; done = False
          def flush():
              if name is not None:
                  total = (r11 + sum(rsps) - 0x1000) if r11 else sum(rsps)
                  if total > 0:
                      rows.append((total, r11, sum(rsps), re.sub(r'::h[0-9a-f]{16}$', '', name)))
          for line in sys.stdin:
              m = head.match(line)
              if m:
                  flush(); name = m.group(1); n = 0; r11 = 0; rsps = []; done = False
                  continue
              if name is None or done:
                  continue
              n += 1
              if n > 24 or re.search(r'\tcall', line):
                  done = True
                  continue
              s = sub.search(line)
              if s:
                  v = int(s.group(1), 16)
                  if s.group(2) == 'r11':
                      r11 = max(r11, v)
                  else:
                      rsps.append(v)
          flush()
          rows.sort(reverse=True)
          with open(sys.argv[1], 'w') as f:
              f.write('frame_bytes\tprobe_r11\tsub_rsp\tsymbol\n')
              for t in rows:
                  if t[0] >= 1024:
                      f.write('%d\t%d\t%d\t%s\n' % t)
          print('functions_with_frame>=1KiB', sum(1 for t in rows if t[0] >= 1024))
          PY
          objdump -d -C --no-show-raw-insn "$BIN" | python3 "$RUNNER_TEMP/frames.py" "$RUNNER_TEMP/diag/frames.tsv"
          head -n 60 "$RUNNER_TEMP/diag/frames.tsv"
          exit 0

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stack-diag46y-${{ github.ref_name }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: error
          retention-days: 14
