name: "#1640 1a diagnostic fixture 39g"
# #1640 1a（gates policy1640-diagnostic）：TestOnly 诊断场所入口的真实 launcher/4 C4 拒绝回执，
#   与生产增量构建零变化的机检。只在本候选分支推送时运行；检查步骤逐条照搬 ci.yml rust-check /
#   release-locks 既有命令，不新增政策。
on:
  push:
    branches: [codex/1640-diagnostic39g]
  workflow_dispatch:
jobs:
  testonly-launcher4-rejection:
    name: "TestOnly 写者经真实 launcher/4 被拒（C4 回执）"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: Build testonly writer (s_session,s_capture_native_testonly)
        working-directory: rust
        run: cargo build --locked --features s_session,s_capture_native_testonly --bin s_structure_session --jobs 4
      - name: Diagnostic fixture locks (switch parse, Ready tagging, advance refused)
        working-directory: rust
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/issue1640-evidence"
          cargo test --locked --features s_session,s_capture_native_testonly --bin s_structure_session --jobs 4 -- --test-threads 1 --exact \
            v3::writer_cli::tests::diagnostic_fixture_switch_accepts_only_the_fixture_record_id \
            v3::writer_cli::tests::diagnostic_fixture_tags_only_ready_inside_hashed_payload \
            v3::driver::tests::diagnostic_fixture_serve_entry_reaches_ready_but_refuses_every_advance \
            2>&1 | tee "$RUNNER_TEMP/issue1640-evidence/rust-locks.log"
          grep -F "test result: ok. 3 passed" "$RUNNER_TEMP/issue1640-evidence/rust-locks.log"
      - name: Real launcher/4 start_s with the testonly writer (fixture / unset / invalid)
        working-directory: s_session/tests
        env:
          ISSUE1640_TESTONLY_BINARY: ${{ github.workspace }}/rust/target/debug/s_structure_session
          ISSUE1640_EVIDENCE_DIR: ${{ runner.temp }}/issue1640-evidence
        run: |
          set -o pipefail
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD | tee "$ISSUE1640_EVIDENCE_DIR/head.txt"
          python -B -m unittest -v test_issue1640_diagnostic_fixture 2>&1 | tee "$ISSUE1640_EVIDENCE_DIR/launcher4-unittest.log"
          grep -E "^Ran 4 tests" "$ISSUE1640_EVIDENCE_DIR/launcher4-unittest.log"
          grep -E "^OK \(skipped=1\)$" "$ISSUE1640_EVIDENCE_DIR/launcher4-unittest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1640-diagnostic39g-launcher4
          path: ${{ runner.temp }}/issue1640-evidence/
          if-no-files-found: error

  production-zero-change:
    name: "生产增量构建零变化（源码机检 + release 产物禁串 + 开关不生效）"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: 生产增量构建无测试钩子（ci.yml rust-check 同命令）
        run: python3 .github/scripts/check-prod-no-test-hooks.py
      - name: 产物禁串清单与源码一致（ci.yml rust-check 同命令）
        run: python3 .github/scripts/gen-prod-banned-literals.py --check .
      - name: 检查器单测（ci.yml rust-check 同命令）
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_prod_no_test_hooks*.py'
      - name: cargo fmt --check（ci.yml rust-check 同命令）
        working-directory: rust
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: cargo check 生产增量构建 -D warnings（ci.yml rust-check 同命令）
        working-directory: rust
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets --features s_session,s_incremental
      - name: cargo check testonly 对照臂 -D warnings（ci.yml rust-check 同命令）
        working-directory: rust
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets --features s_session,s_capture_native_testonly
      - name: 生产增量 release 产物无测试钩子（ci.yml release-locks 同命令）
        working-directory: rust
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/issue1640-evidence"
          cargo build --release --locked --features s_session,s_incremental --bin s_structure_session --jobs 4 2>&1 | tee "$RUNNER_TEMP/issue1640-evidence/release-build.log"
          ../.github/scripts/check-prod-artifact-hooks.sh target/release/s_structure_session 2>&1 | tee "$RUNNER_TEMP/issue1640-evidence/release-artifact-check.log"
          grep -c S_DIAGNOSTIC_FIXTURE_TESTONLY ../.github/prod-banned-literals.txt | tee "$RUNNER_TEMP/issue1640-evidence/banned-literal-present.txt"
      - name: 生产 release 二进制带开关经真实 launcher/4 仍于 Ready 前因 AwaitingPolicy 退出
        working-directory: s_session/tests
        env:
          ISSUE1640_PRODUCTION_BINARY: ${{ github.workspace }}/rust/target/release/s_structure_session
          ISSUE1640_EVIDENCE_DIR: ${{ runner.temp }}/issue1640-evidence
        run: |
          set -o pipefail
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD | tee "$ISSUE1640_EVIDENCE_DIR/head.txt"
          python -B -m unittest -v test_issue1640_diagnostic_fixture 2>&1 | tee "$ISSUE1640_EVIDENCE_DIR/production-unittest.log"
          grep -E "^Ran 4 tests" "$ISSUE1640_EVIDENCE_DIR/production-unittest.log"
          grep -E "^OK \(skipped=3\)$" "$ISSUE1640_EVIDENCE_DIR/production-unittest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1640-diagnostic39g-production
          path: ${{ runner.temp }}/issue1640-evidence/
          if-no-files-found: error
