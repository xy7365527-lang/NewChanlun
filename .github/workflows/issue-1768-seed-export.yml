name: '#1768 TestOnly pre-W oracle seed export'

# 冻结 44fe pre-W 旧规则 oracle 重建夹具；仅本分支 push 触发，不进 main。
on:
  push:
    branches: [codex/1768-testonly-seed-29ax, codex/1768-frozen-helper30p]

permissions:
  contents: read

concurrency:
  group: issue-1768-seed-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-job-setup
      - name: Export (cfg(test), ignored tests run by exact name)
        working-directory: rust
        shell: bash
        env:
          S1768_SEED_EXPORT_DIR: ${{ runner.temp }}/evidence/seed
        run: |
          set +e
          mkdir -p "$S1768_SEED_EXPORT_DIR" "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/checkout-head.txt"
          failed=0
          for t in issue1768_seed_export_production_advance issue1768_seed_export_fixture_advance; do
            cargo test --locked --features s_session --bin s_structure_session -- --ignored --exact "issue1768_seed_export::$t" --nocapture \
              >"$RUNNER_TEMP/evidence/$t.log" 2>&1
            rc=$?
            printf '%s exit=%s\n' "$t" "$rc" | tee -a "$RUNNER_TEMP/evidence/export-exit.txt"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          tail -40 "$RUNNER_TEMP/evidence/"*.log || true
          exit "$failed"
      - name: Release default build keeps legacy write unreachable
        if: always()
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cargo build --locked --release --features s_session --bin s_structure_session >"$RUNNER_TEMP/evidence/release-build.log" 2>&1
          printf 'release_build_exit=0\n' > "$RUNNER_TEMP/evidence/release-build-exit.txt"
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.14.6'
      - name: Original public validator on frozen copies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r s_session/tests/requirements-tb02c.txt >"$RUNNER_TEMP/evidence/python-dependencies.log" 2>&1
          set +e
          python s_session/tests/issue1768_seed_validate.py "$RUNNER_TEMP/evidence/seed/fixture-advance-testonly-policy-records" \
            >"$RUNNER_TEMP/evidence/validator.json" 2>"$RUNNER_TEMP/evidence/validator.err"
          rc=$?
          printf 'validator_exit=%s\n' "$rc" | tee "$RUNNER_TEMP/evidence/validator-exit.txt"
          cat "$RUNNER_TEMP/evidence/validator.json"; tail -30 "$RUNNER_TEMP/evidence/validator.err"
          exit "$rc"
      - name: Release accepts resources but rejects retired legacy writers
        if: always()
        shell: bash
        run: |
          set +e
          python s_session/tests/issue1768_release_lock.py rust/target/release/s_structure_session \
            "$RUNNER_TEMP/evidence/seed/fixture-advance-testonly-policy-records" \
            >"$RUNNER_TEMP/evidence/release-lock.jsonl" 2>"$RUNNER_TEMP/evidence/release-lock.err"
          rc=$?
          printf 'release_lock_exit=%s\n' "$rc" | tee "$RUNNER_TEMP/evidence/release-lock-exit.txt"
          cat "$RUNNER_TEMP/evidence/release-lock.jsonl"; cat "$RUNNER_TEMP/evidence/release-lock.err"
          exit "$rc"
      - name: Frozen originals carry no sidecars
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          frozen="$RUNNER_TEMP/evidence/seed/fixture-advance-testonly-policy-records/frozen"
          test -d "$frozen"
          found=$(find "$frozen" -type f \( -name '*-shm' -o -name '*-wal' -o -name '*-journal' \) | sort)
          if [ -n "$found" ]; then
            printf 'frozen_sidecar_exit=1\n%s\n' "$found" | tee "$RUNNER_TEMP/evidence/frozen-sidecar-exit.txt"
            exit 1
          fi
          printf 'frozen_sidecar_exit=0\n' | tee "$RUNNER_TEMP/evidence/frozen-sidecar-exit.txt"
      - name: Checkout exact Python component commit
        if: always() && github.ref == 'refs/heads/codex/1768-frozen-helper30p'
        uses: actions/checkout@v4
        with:
          ref: dbcbcf72d03fa3c4052490fd5e7a5bdda198ab80
          path: py-component
          persist-credentials: false
      - name: Component arm consumes frozen cfg(test) producer (exact Python commit)
        if: always() && github.ref == 'refs/heads/codex/1768-frozen-helper30p'
        shell: bash
        env:
          PY_COMMIT: dbcbcf72d03fa3c4052490fd5e7a5bdda198ab80
        run: |
          set +e
          ev="$RUNNER_TEMP/evidence/component"
          mkdir -p "$ev"
          git rev-parse HEAD > "$ev/producer-checkout-head.txt"
          git rev-parse HEAD^{tree} > "$ev/producer-tree.txt"
          git rev-parse HEAD^ > "$ev/producer-base.txt"
          (cd rust && cargo test --locked --features s_session --bin s_structure_session --no-run --message-format=json \
            > "$ev/producer-build.jsonl" 2> "$ev/producer-build.err")
          printf 'producer_build_exit=%s\n' "$?" | tee "$ev/producer-build-exit.txt"
          producer=$(python -c 'import json,sys
          for l in open(sys.argv[1]):
              m=json.loads(l)
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="s_structure_session" and m["profile"]["test"]: print(m["executable"])' "$ev/producer-build.jsonl" | tail -1)
          printf '%s\n' "$producer" | tee "$ev/producer-binary.txt"
          sha256sum "$producer" | tee "$ev/producer-binary.sha256"
          git -C "$GITHUB_WORKSPACE/py-component" rev-parse HEAD | tee "$ev/python-checkout-head.txt"
          cd "$GITHUB_WORKSPACE/py-component"
          python -m pip install pytest==9.0.2 -r s_session/tests/requirements-tb02c.txt > "$ev/python-dependencies.log" 2>&1
          python -V | tee "$ev/python-version.txt"
          S1768_PRODUCER_BINARY="$producer" S1768_PRODUCER_EVIDENCE="$ev/producer" \
          python -m pytest -q -p no:cacheprovider \
            "s_session/tests/test_tb02d_projection_cache.py::ProjectionCacheTests::test_old_token_survives_fresh_capture_and_new_commit" \
            "s_session/tests/test_tb02d_projection_cache.py::ProjectionCacheTests::test_projection_old_token_new_commit_and_modes" \
            "s_session/tests/test_tb02d_projection_cache.py::ProjectionCacheTests::test_slow_client_gap_is_local_and_new_valid_cursor_can_catch_up" \
            --junitxml="$ev/component.xml" > "$ev/component.log" 2>&1
          rc=$?
          printf 'component_pytest_exit=%s\n' "$rc" | tee "$ev/component-exit.txt"
          tail -60 "$ev/component.log"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1768-seed-export-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
