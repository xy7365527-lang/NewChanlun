name: Issue 1393 necessary validation (prepared, not authorized)

on:
  push:
    branches: [codex/1393-validate-once-20261018]

permissions:
  contents: read

concurrency:
  group: issue1393-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  # 唯一执行开关。根先固定 False 准备提交，再独立审核仅此一行的变化。
  ISSUE1393_EXECUTE: 'True'
  CARGO_INCREMENTAL: '0'

jobs:
  necessary-validation:
    name: '#1393 Rust exact + Lean single + fixture (shared 60 minutes)'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Reject the prepared False gate
        if: env.ISSUE1393_EXECUTE != 'True'
        run: |
          echo 'PREPARED_NOT_AUTHORIZED: 所有真实验证 NOT_RUN'
          exit 1

      # 首个执行步骤记录单一窗口，包含 checkout/安装/所有验证/回收/上传。
      - name: Start the shared deadline
        if: env.ISSUE1393_EXECUTE == 'True'
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'])
          start = {'monotonic': time.monotonic(), 'wall': time.time(), 'total_seconds': 3600}
          (p / 'issue1393-start.json').write_text(json.dumps(start))
          PY

      - uses: actions/checkout@v4
        if: env.ISSUE1393_EXECUTE == 'True'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Rust 使用既有 CI 的 runner 工具链；elan 官方安装位于 runner 内，
      # 经 source/hash 准入后才执行，并共用同一截止。没有另起 60 分钟的步骤。
      - name: Run the bound validation once
        if: env.ISSUE1393_EXECUTE == 'True'
        run: >-
          python3 .github/scripts/issue1393_validate.py
          --start "$RUNNER_TEMP/issue1393-start.json"
          --output "$RUNNER_TEMP/issue1393-evidence"

      # checkout/启动失败可能没有 runner 原件；只能登记未运行，不能由上传成功推断验证成功。
      - name: Record missing evidence and remaining upload budget
        id: archive-eligibility
        if: always() && env.ISSUE1393_EXECUTE == 'True'
        run: |
          python3 - <<'PYCODE'
          import json, os, time
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'])
          out = p / 'issue1393-evidence'
          out.mkdir(exist_ok=True)
          if not (out / 'result.json').exists():
              result = {'status': 'FAILED', 'reason': 'runner 原件缺失：启动未完成或遭外部终止；不得推断成功'}
              (out / 'result.json').write_text(json.dumps(result, ensure_ascii=False))
              if not (out / 'steps.json').exists():
                  names = ['install-elan', 'rust-version', 'cargo-version', 'lean-version',
                           'lib-build', 'lib-list', *['lib-exact-' + str(i) for i in range(7)],
                           's-build', 's-list', *['s-exact-' + str(i) for i in range(2)], 'lean-single', 'fixture']
                  rows = [{'name': n, 'status': 'NOT_RUN', 'reason': '无执行原件，不推断已执行'} for n in names]
                  (out / 'steps.json').write_text(json.dumps(rows, ensure_ascii=False))
              (out / 'PACKAGE.json').write_text(json.dumps({'status': 'FAILED', 'reason': '无完整 runner 结果'}))
          try:
              start = json.loads((p / 'issue1393-start.json').read_text())
              remaining = min(start['monotonic'] + 3600 - time.monotonic(), start['wall'] + 3600 - time.time())
          except Exception:
              remaining = 0
          allowed = remaining > 0
          (out / 'UPLOAD.json').write_text(json.dumps({
              'status': 'REQUESTED' if allowed else 'NOT_RUN', 'remaining_seconds': remaining,
              'result_authority': 'GitHub upload-artifact 步骤实际 conclusion；REQUESTED 不等于上传成功'}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('allowed=' + str(allowed).lower() + '\n')
          PYCODE

      - name: Upload original evidence even on failure
        if: always() && env.ISSUE1393_EXECUTE == 'True' && steps.archive-eligibility.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: issue1393-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          # 不上传 target 编译目录；只上传原件与封包收据。
          path: |
            ${{ runner.temp }}/issue1393-start.json
            ${{ runner.temp }}/issue1393-evidence/*.json
            ${{ runner.temp }}/issue1393-evidence/*.stdout
            ${{ runner.temp }}/issue1393-evidence/*.stderr
            ${{ runner.temp }}/issue1393-evidence/*.exit
            ${{ runner.temp }}/issue1393-evidence/*.zip
