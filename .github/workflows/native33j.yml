name: Native wire comparison 33j
on:
  push:
    branches: [codex/1640-native33j-diagnostic]
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-job-setup
      - name: Original snapshot order exact wire
        id: original
        continue-on-error: true
        run: |
          git show 92865bbcffcf2ef56e51602789c0707060efb703:rust/src/bin/s_session_v3/admission_private/mod.rs > src/bin/s_session_v3/admission_private/mod.rs
          cargo test --locked --features s_session,s_capture_native_testonly --bin s_structure_session --jobs 1 ordinary_material_multicut_wire_comparison_keeps_same_proofs_and_all_cuts -- --nocapture

      - name: Fixed snapshot order exact wire
        id: fixed
        continue-on-error: true
        run: |
          git show HEAD:rust/src/bin/s_session_v3/admission_private/mod.rs > src/bin/s_session_v3/admission_private/mod.rs
          cargo test --locked --features s_session,s_capture_native_testonly --bin s_structure_session --jobs 1 ordinary_material_multicut_wire_comparison_keeps_same_proofs_and_all_cuts -- --nocapture
      - name: Preserve both observed outcomes
        if: always()
        env:
          ORIGINAL: ${{ steps.original.outcome }}
          FIXED: ${{ steps.fixed.outcome }}
        run: |
          printf 'original=%s fixed=%s\n' "$ORIGINAL" "$FIXED"
          test "$ORIGINAL" = success && test "$FIXED" = success
