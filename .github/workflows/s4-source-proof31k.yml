name: S4 source proof 31k targeted
on:
  push:
    branches: [codex/1640-s4-source-proof31k, codex/1640-p57-origin33d]
  workflow_dispatch:
jobs:
  targeted:
    if: github.ref != 'refs/heads/codex/1640-p57-origin33d'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: Build release test
        id: build
        run: cargo test --release --locked --features s_session,s_incremental --no-run --bin s_structure_session --jobs 4
      - name: Check bounded ordinary original reuse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --locked --features s_session,s_incremental --bin s_structure_session ordinary_material -- --test-threads 1 --nocapture
      - name: Check ordinary owner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --locked --features s_session,s_incremental --bin s_structure_session ordinary_proof_owner_ -- --test-threads 1 --nocapture
      - name: Check ordinary projection
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --locked --features s_session,s_incremental --bin s_structure_session ordinary_proof_publication_ -- --test-threads 1 --nocapture
      - name: Check ordinary multicut outputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --release --locked --features s_session,s_incremental --bin s_structure_session ordinary_proof_multicut_ -- --test-threads 1 --nocapture
      - name: Check local descent and caller contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo test --release --locked --features s_session,s_incremental --lib s4_local_descent -- --test-threads 1
          cargo test --release --locked --features s_session,s_incremental --test s_content_path --test s_content_key_subset --test s_content_array_scan -- --test-threads 1
      - name: Check manifest coverage and source audit locks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo test --release --locked --features s_session,s_incremental --bin s_structure_session history_public_coverage -- --test-threads 1
          cargo test --release --locked --features s_session,s_incremental --bin s_structure_session manifest_template_coverage -- --test-threads 1
          cargo test --release --locked --features s_session,s_incremental --bin s_structure_session committed_history_binds_manifest_source_public_roots_without_writes -- --test-threads 1
          cargo test --release --locked --features s_session,s_incremental --bin s_structure_session valid_but_substituted_snapshot_is_rejected_against_manifest -- --test-threads 1
          cargo test --release --locked --features s_session,s_incremental --bin s_structure_session v3::source_audit:: -- --test-threads 1 --nocapture
      - name: Check ordinary build without incremental feature
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo check --locked --features s_session --bin s_structure_session --jobs 4
  p57:
    if: github.ref == 'refs/heads/codex/1640-p57-origin33d'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: P57 来源合同
        run: cargo test --locked --features s_session,s_incremental --bin s_structure_session publication_degrade_verdict_tests --jobs 4 -- --test-threads 1 --nocapture

      - name: P57 原发布六锁
        run: |
          for lock in publication_candidate_budget_shortfall_degrades_and_keeps_admitting publication_real_tail_failure_still_rejects_without_degrade publication_real_error_after_budget_failure_rejects_without_degrade publication_source_append_allocation_failure_degrades publication_prepare_wrapped_allocation_failure_degrades publication_ledger_after_budget_failure_rejects_without_degrade; do
            cargo test --locked --features s_session,s_incremental --bin s_structure_session "$lock" --jobs 4 -- --test-threads 1 --nocapture
          done
      - name: P57 formatter artifact
        if: always()
        run: |
          cargo fmt --all
          git diff --binary > /tmp/p57-fmt.patch
          test ! -s /tmp/p57-fmt.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p57-fmt
          path: /tmp/p57-fmt.patch

  p57-strict:
    if: github.ref == 'refs/heads/codex/1640-p57-origin33d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ['', backtest_bin, s_session, 's_session,s_incremental', 's_session,s_capture_native_testonly', 's_session,s_allocation_json_testonly']
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: 严格编译（原五档及受影响 Owned 兼容入口）
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo check --locked --all-targets --features "$FEATURES" --jobs 4
          else
            cargo check --locked --all-targets --jobs 4
          fi
      - name: Owned 原错误展示及资源合同
        if: matrix.features == 's_session,s_allocation_json_testonly'
        run: cargo test --locked --features s_session,s_allocation_json_testonly --bin s_structure_session --jobs 4 -- owned_aux_public_sets_sequence_keys_growth_one_byte_short_preserves_roots_and_discard_releases actual_catalog_sql_and_scalar_owners_share_live_capture_and_refuse_before_mutation sequence_keys_empty_sync_freezes_actual_mode_and_same_ledger_until_discard delta_sequence_foreign_budget_and_allocation_failure_preserve_binding fixed_candidate_owned_scalar_refusal_releases_all_local_owners_without_fallback owned_source_single_field_borrowed_navigation_roles_failure_and_layout_refusal owned_publication_same_real_indexed_template_roots_and_f --test-threads 1
  p57-mutations:
    if: github.ref == 'refs/heads/codex/1640-p57-origin33d'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mutation: [0072_a, 0072_b, N57_no_bridges_0072_c, 0072_d, 0072_e, 0072_f, N57_typed_count_only]
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: 变异前来源组必须绿（包含 testonly 真值表行）
        working-directory: rust
        run: cargo test --locked --features s_session,s_capture_native_testonly --bin s_structure_session publication_degrade_verdict_tests --jobs 4 -- --test-threads 1
      - name: 真实断言红（编译失败不算）
        env:
          MUTATION: ${{ matrix.mutation }}
        run: python3 .github/scripts/run-p57-mutations.py --mutation "$MUTATION" --output /tmp/p57-mutations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p57-mutation-${{ matrix.mutation }}
          path: /tmp/p57-mutations
  p57-production:
    if: github.ref == 'refs/heads/codex/1640-p57-origin33d'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-job-setup
      - name: 变异回执检查器单测
        run: python3 .github/scripts/test_run_p57_mutations.py -v
      - name: 来源码无测试钩子及禁串清单
        run: |
          python3 .github/scripts/check-prod-no-test-hooks.py
          python3 .github/scripts/gen-prod-banned-literals.py --check .
      - name: 生产增量 release
        working-directory: rust
        run: cargo build --release --locked --features s_session,s_incremental --bin s_structure_session --jobs 4
      - name: 生产产物无钩子或禁串
        run: .github/scripts/check-prod-artifact-hooks.sh rust/target/release/s_structure_session
