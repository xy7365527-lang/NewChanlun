name = "Formal"
defaultTargets = ["Formal", "Phase2Claims", "Tlayers", "Strict", "Foundation"]

# 真完全分类形式化（task #27, 603 范式）
# 不依赖 Mathlib：构造子穷尽证明是纯归纳 cases/decide，不需要外部库。
# 这保证 lake build 自包含、快速、可复现（认识论 L0：定义内蕴）。

# Phase 1 脊柱 + solo Phase 2（Formal/ 目录）：codex 多轮 PASS 的权威源。
[[lean_lib]]
name = "Formal"
globs = ["Formal", "Formal.+"]

# teammate Phase 2 独立形式化（Phase2/ 目录）= Option A 交叉验证源。
# 包含 claim5(元素阶梯自包含)/claim6(动作类型层π_op)/claim9(中枢位置三态)/claim10(线段v1)。
# ★不包含 Claim7（与 solo Formal/DivergenceNesting 字节相同、同命名空间 Formal.DivergenceNesting，
#   双份会命名空间碰撞——claim7 单一权威=solo Formal/，避免双份漂移，编排者"统一单一权威源"裁定）。
[[lean_lib]]
name = "Phase2Claims"
srcDir = "Phase2"
roots = ["Claim5_ConstitutiveLadder", "Claim6_OperationalSemantics", "Claim9_CenterPosition", "Claim10_SegmentV1"]

# T-framework E-set 形式化（Tlayers/ 目录）：5 层（Signal/Operational/Accounting/Spiral/Payoff）。
# teammate 各自 lake env lean 验证过（无 sorry/admit/axiom，真 codex）。
# Operational/Payoff import Phase1（Formal.*）——跨 lib 引用，已解析。
[[lean_lib]]
name = "Tlayers"
srcDir = "Tlayers"
roots = ["Signal", "Operational", "Accounting", "Spiral", "Payoff", "Dynamics"]

# 严格完全分类·标准内核库（task #57, RTAS T-kernel 工位）：codex 异质审计七结构 +
# Classification.lean（Classifies/SemanticQuotient/DecompositionSystem/OnlineSystem/
# CausalOnlineSystem/RecursiveKernel/OpenTailSystem/Strategy+StrictAction）。
# 所有 Layer2 工位的共享内核——纯 Prop/Type 定义，认识论 L0，无 sorry/admit/axiom。
[[lean_lib]]
name = "Strict"
# srcDir="." + 前缀 roots（clean-rebuildable 一致前缀方案，2026-06-26）：
#   Strict 文件物理在 Strict/ 目录，模块名=Strict.X 对应 ./Strict/X.lean。
#   配合所有 import 统一为 `import Strict.X` 前缀风格（消除裸名/前缀混用——
#   混用导致 lake clean 后 `unknown module prefix 'Strict'`，是禁用 lake clean 的根因）。
srcDir = "."
# Classification = 共享内核；Trend/Recursive/Decomp/BSP/Causal/OpenTail/Op = 各 Layer2 工位
# canonical 实例化（import Strict.Classification[+Formal.*]，依赖单向 Strict→{Formal,Tlayers}，无环）。
# OpenTail（task #65 t-opentail）：标准第5部分 OpenTailSystem 实例化——未完成走势→当下状态 +
#   未来延伸 Ext(h)=⊔ⱼBⱼ(h) 互斥穷尽分支（branch_total/disjoint/sound + current_unique）。
# Op（task #67 t-op）：标准第6部分 Strategy 实例化（πₗ:Sₗ→A 完全应对）。
# HybridStep（全定义策略装配，codex R1=B/R2，2026-06-26）：单一闭环 S_Θ+hybridStep+T——
#   吸收 GPT 全定义策略的「装配/闭环」优势。把 Chain 的 C_Θ∧π_Θ 并列合取升级为闭环复合
#   （π̄∘C 真读分类 + T 真写回完整 x_t）。import Strict.Chain，依赖单向无环。
# HybridAssembly（抽象接口具体化，task #86，cc-hybrid-assembly）：把 HybridStep 的抽象
#   HybridComponents 用已证组件（Dynamics.State micro + 新建 LedgerComp R=Π-A-W + Fugue/
#   RiskProj 确定选择器）实例化为单一闭环 assembly；新建闭环 T 保 R=Π-A-W（补账户因果洞）。
#   import Strict.HybridStep + Fugue + RiskProj + Tlayers.Dynamics，依赖单向无环。
roots = ["Strict.Classification", "Strict.Trend", "Strict.Recursive", "Strict.Decomp", "Strict.BSP", "Strict.Causal", "Strict.OpenTail", "Strict.Op", "Strict.Center", "Strict.StrategyFamily", "Strict.ClassificationFamily", "Strict.Parse", "Strict.LevelState", "Strict.Nest", "Strict.Fugue", "Strict.RiskProj", "Strict.Chain", "Strict.HybridStep", "Strict.HybridAssembly"]

# ★Foundation（完全分类严格推导地基，编排者「从一开始的完全分类的严格推导出发」，2026-06-26）：
#   GPT「推导完全分类」的形式化原样移入作严格地基（build on，非 absorb）——我们的起点不如它严格。
#   - CompleteClassification：完全分类 = 构造 I:X→P（不变性+完备性+可实现性 ⟹ X/∼≅P 双射）+
#     递归级唯一(recSpec_complete_unique/recAt_causal) + 优先级互斥穷尽 + π 流水线存在唯一。
#   - HybridStateMachine：行为等价商(BehEquiv/最小完全分类) + 10级动作优先级 + 资本阶段 + 风险模式 +
#     镜像等变 + 动态闭合 + 完整 Rec→Class→Intent→Risk→Schedule→T 单步存在唯一(hybrid_step_complete_unique)。
#   命名空间 NewChanlun/NewChanlunHybrid，与 Strict/Formal 无碰撞；纯 Prop/Type 无 Mathlib 无 sorry/admit/axiom。
#   两文件在本仓 lake env 验证编译通过。后续：用缠论具体(笔/线段/中枢)忠实实例化其抽象参数 + 全定义策略建在其上。
#   - ChanlunInstantiation（缠论具体实例化，task #87，cc-foundation-inst）：用已证缠论具体结构忠实
#     实例化 CompleteClassification 抽象参数——LevelRecursion ← Strict.Recursive 走势递归（canStep
#     逐级 compose）；Priority ← Strict.Op 动作优先级（持仓×信号 6 类）；GlobalVoice ← Strict.Trend
#     走势分类器（trend_classifies 五件套导出 ExistsUnique）；Strategy ← 分类→应对流水线（函数图）。
#     import CompleteClassification + Strict.{Recursive,Trend,Op}，依赖单向无环。全 L0（已证结构填入
#     已证抽象定理，不冒充经验有效性）；完备性是缠论公理给定，忠实编码不评级。
[[lean_lib]]
name = "Foundation"
srcDir = "Foundation"
roots = ["CompleteClassification", "HybridStateMachine", "ChanlunInstantiation"]
