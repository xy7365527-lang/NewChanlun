[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newchan"
version = "0.1.0"
description = "缠论量化分析工具"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "pyarrow",
    "matplotlib",
    "python-dotenv",
    "ib_insync",
    "lightweight-charts",
    "databento",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "google-genai>=1.64",
    "anthropic>=0.40",
    "openai>=2.0",
    "mcp>=1.0",
    "networkx>=3.0",
    "persim>=0.3",
    "akshare>=1.14",
    "ccxt>=4.0",
    "ripser>=0.6.14",
    "scipy>=1.10",
]

[project.scripts]
newchan = "newchan.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=6.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as fast isolated unit tests",
    "integration: marks tests as integration tests",
]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
