[package]
name = "newchan_rust"
version = "0.1.0"
edition = "2021"
description = "缠论核心引擎的 Rust 重写（逐位等价于 Python 版）"

[lib]
name = "newchan_rust"
# cdylib: maturin 构建 Python 扩展模块；rlib: 让纯 Rust 单元测试可以 cargo test
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module 作为 optional feature：
#   - maturin build 时启用（见 pyproject.toml [tool.maturin] features）
#   - cargo test 时不启用（否则链接 libpython 失败）
pyo3 = { version = "0.23" }
# strict_nest_check 与 backtest CLI 共用严格 JSON 解码；生产二进制必须可直接构建。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nautilus Trader Rust-native 引擎（goal acceptance[5] ②③⑥：真实 BacktestEngine 驱动 S_Θ）。
#   optional + 仅 backtest_bin/nautilus feature 启用 ⟹ cdylib（Python 扩展）构建零膨胀。
#   default-features=false：避 nautilus 的 pyo3 feature 与本 crate pyo3 0.23 冲突（#5a 实测可拉）。
#   ★0.62.0（#1310，2026-08-21 上游；原钉 0.60.0）：0.60→0.62 breaking 已核——pyo3 仍是 optional
#   （default-features=false 不拉，0.62 的 pyo3 req 升至 ^0.29.2，仅 python/extension-module
#   feature 启用），nautilus feature 与本 crate pyo3 0.23 冲突规避仍有效；theta_strategy/
#   backtest_engine/theta_pi_strategy 三文件 0.62 API 直编译绿。
nautilus-model = { version = "0.62.0", default-features = false, optional = true }
nautilus-common = { version = "0.62.0", default-features = false, optional = true }
nautilus-trading = { version = "0.62.0", default-features = false, optional = true }
nautilus-backtest = { version = "0.62.0", default-features = false, optional = true }
# nautilus 集成的直接依赖（trait 返回 anyhow::Result、PortfolioApi 返回 rust_decimal::Decimal、
#   Bar/instrument 用 nautilus_core::UnixNanos、CurrencyPair 字段用 dec! 字面量）。
anyhow = { version = "1", optional = true }
rust_decimal = { version = "1", optional = true }
rust_decimal_macros = { version = "1", optional = true }
nautilus-core = { version = "0.62.0", default-features = false, optional = true }
# venue 费率 datum 的 sha256 版本哈希（#360，theta_v0::venue_fee::load_datum）。optional：
#   与 backtest 同门控（test 走 dev-dependency；CLI 走 backtest_bin feature）⟹ 默认 cdylib
#   （Python 扩展）构建不含，零依赖膨胀。纯 Rust 标准实现（sidecar 可用 `shasum -a 256 -c` 复核）。
sha2 = { version = "0.10", optional = true }
# #1370 TB-01-A：正式结构会话 S 的独立 SQLite 单写者（C09）。bundled = 编译期自带 SQLite
#   3.53.2（≥ C09 要求的 3.51.3 WAL-reset 修复），不依赖宿主 libsqlite3；optional + 仅
#   `s_session` feature 启用 ⟹ 默认 cdylib（Python 扩展）构建零膨胀（沿 backtest_bin/lav_seal 先例）。
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
# Nautilus 集成 feature：激活 theta_v0::nautilus 真实类型适配（②③）+ CLI BacktestEngine（⑥）。
nautilus = ["dep:nautilus-model", "dep:nautilus-common", "dep:nautilus-trading", "dep:nautilus-backtest", "dep:nautilus-core", "dep:anyhow", "dep:rust_decimal", "dep:rust_decimal_macros"]
# CLI 生产入口：解 theta_v0::backtest 的 #[cfg(test)] 门控为公开 API，链接 run_theta_v0_pi/load_by_symbol。
#   含 nautilus：CLI ⑥ 用真实 BacktestEngine（task#8 acceptance[5]）。
backtest_bin = ["nautilus", "dep:sha2"]
# #1087 Rust 生产输出 + 逐段 sink → Lean 独立重算逐字段对拍。只打开只读诊断面；普通构建不编译。
issue1087_parity = []

# LAV 旁路排序器证据封存层（S1 #1167，ADR 0025）：启用 sha2（JCS+SHA-256 内容寻址）。
# 与 backtest_bin 同门控——默认 cdylib（Python 扩展）构建不含，零依赖膨胀。
lav_seal = ["dep:sha2"]
# #1370 TB-01-A：正式结构会话 S 二进制（s_structure_session）——sha2（payload_hash 规范字节）
#   + rusqlite（S 自有 SQLite/WAL 单写者）。
s_session = ["dep:sha2", "dep:rusqlite"]

# ── CLI 生产入口（goal acceptance[5]：CLI 能驱动 S_Θ 产回测结果）。 ──
# required-features：默认 cargo build 不编译它（cdylib 构建不受影响）。
#   构建/运行：cargo run --features backtest_bin --bin theta_backtest -- <symbol>
[[bin]]
name = "theta_backtest"
path = "src/bin/theta_backtest.rs"
required-features = ["backtest_bin"]

# #1370 TB-01-A：正式结构会话 S（唯一结构核，独立 SQLite/WAL 单写者 + ReadCatalog/Snapshot）。
#   required-features = ["s_session"]（sha2 + rusqlite 门控，默认 cdylib 构建零膨胀）。
#   构建/运行：cargo run --features s_session --bin s_structure_session -- <subcommand>
[[bin]]
name = "s_structure_session"
path = "src/bin/s_structure_session.rs"
required-features = ["s_session"]

# #938 探针：绑定中枢开放性 / seed_moved 谱系构成。两者都 use theta_v0::backtest，
#   而该模块挂 #[cfg(any(test, feature="backtest_bin"))] ⟹ 必须声明 required-features，
#   否则 CI 的「cargo check — default targets」会因找不到 backtest 而红（2026-08-08 实撞）。
[[bin]]
name = "p938_bound_center_openness"
path = "src/bin/p938_bound_center_openness.rs"
required-features = ["backtest_bin"]

[[bin]]
name = "p938_seed_moved_composition"
path = "src/bin/p938_seed_moved_composition.rs"
required-features = ["backtest_bin"]

# #977 探针同款：use theta_v0::backtest（cfg 门控模块）⟹ 必须声明 required-features，
# 否则 CI「cargo check — default targets」红（上方 #938 注释记载的 2026-08-08 实撞同型；
# p977 于 2026-08-16 镜像追推后第二次实撞）。
[[bin]]
name = "p977_force_def_validation"
path = "src/bin/p977_force_def_validation.rs"
required-features = ["backtest_bin"]

# #985 探针同款（TV 末端钝化对照，use theta_v0::backtest）。
[[bin]]
name = "p985_tv_endpoint_blunt"
path = "src/bin/p985_tv_endpoint_blunt.rs"
required-features = ["backtest_bin"]

# #992 探针同款（ForceL vs MacdArea 差集，use theta_v0::backtest）——
# 第三次同型实撞（#468 → p977 注释 → 本处），教训已三撞：凡 use theta_v0::backtest 的新 bin
# 必须 Cargo.toml 声明 required-features，否则 CI default-targets check 必红。
[[bin]]
name = "p992_gauge_diff"
path = "src/bin/p992_gauge_diff.rs"
required-features = ["backtest_bin"]

# #1035 探针同款（一类点提前量普查，use theta_v0::backtest）——required-features 同上。
[[bin]]
name = "p1035_type1_lead"
path = "src/bin/p1035_type1_lead.rs"
required-features = ["backtest_bin"]

# 纯买卖点择时隔离实验（goal #5 最根本问题：缠论买卖点择时本身有无 alpha）。
# 离散事件状态机（仓位∈{+1,0,-1}），不做 π_Θ 覆盖/净额——只在买卖点切换仓位。
[[bin]]
name = "pure_bsp_timing"
path = "src/bin/pure_bsp_timing.rs"
required-features = ["backtest_bin"]

[[bin]]
name = "pi_bsp_timing"
path = "src/bin/pi_bsp_timing.rs"
required-features = ["backtest_bin"]

# 任务 #100：nest 证书 × 现有买卖点全量对账（只读探针，CERT 读 P92_DUMP，BSP 走生产因果塔）。
[[bin]]
name = "p100_cert_bsp_recon"
path = "src/bin/p100_cert_bsp_recon.rs"
required-features = ["backtest_bin"]

# 任务 #101：证书 → 就近 BSP 打标物化（只读探针，不进判据层；cert-bsp-binding-ruling DRAFT 的可执行镜像）。
[[bin]]
name = "p101_cert_bsp_tag"
path = "src/bin/p101_cert_bsp_tag.rs"
required-features = ["backtest_bin"]

# 任务 #107：nest exec/top ↔ classifier lvl 级别标定探针（只读，不进判据层）。
[[bin]]
name = "p107_level_calib"
path = "src/bin/p107_level_calib.rs"
required-features = ["backtest_bin"]

# 任务 #108：区间套收敛探针——嵌套收缩/lvl0 极值 bar 收敛/破例归类（只读，不进判据层）。
[[bin]]
name = "p108_interval_probe"
path = "src/bin/p108_interval_probe.rs"
required-features = ["backtest_bin"]

# 任务 #105：nest 证书级别谱统计（只读探针；CERT 读 P92_DUMP，BSP 走生产因果塔，
# 身份连接用 terminal_bits_new 同构查法，nest 级 k == classifier lvl k）。
[[bin]]
name = "p105_cert_level_spectrum"
path = "src/bin/p105_cert_level_spectrum.rs"
required-features = ["backtest_bin"]

# ★M5 声部执行层跑批（多空对冲.pdf p16 关卡10）：run_theta_v0_pi_overlay ΔN 守恒 + 逐声部 pnl_v 归因。
[[bin]]
name = "theta_overlay"
path = "src/bin/theta_overlay.rs"
required-features = ["backtest_bin"]

# #1305 ①件：生产 π 回路历史回放 driver（Dataset→ThetaPiStream::push_bar + 排序 dump + env 钉死
#   + 同输入双跑自检）。use theta_v0::backtest::data（cfg 门控）⟹ 声明 required-features。
[[bin]]
name = "theta_replay"
path = "src/bin/theta_replay.rs"
required-features = ["backtest_bin"]

# #1308 第二批：生产路径历史回放验收报告器（theta_replay + theta_pi_diff 一键组装 + 多品种
#   批跑汇总，对接 #1279 检查单 B 组）。use theta_v0::backtest（cfg 门控）⟹ required-features。
[[bin]]
name = "theta_accept"
path = "src/bin/theta_accept.rs"
required-features = ["backtest_bin"]

# #1317 M1 最终实验：生产引擎 7 期货回放 + 预注册 7/7 判据（theta_m1_dual——run_theta_v0_pi
#   生产 runner 交易流上的双开百分位测量 + 双跑逐位自检 + 前后对照入档）。
#   use theta_v0::backtest（cfg 门控）⟹ required-features。
[[bin]]
name = "theta_m1_dual"
path = "src/bin/theta_m1_dual.rs"
required-features = ["backtest_bin"]

[[bin]]
name = "p856_ed_dominance"
path = "src/bin/p856_ed_dominance.rs"
required-features = ["backtest_bin"]

# #1167 S1：封存固定历史样本集（30 样本 × bundle + Comparison Set Manifest + Lead 基线）。
[[bin]]
name = "lav_seal_samples"
path = "src/bin/lav_seal_samples.rs"
required-features = ["lav_seal"]

# 票 #907 成本门探针（乙类可复用）：逐级买卖点间波幅 ÷（成本+误差）读数。
[[bin]]
name = "p907_cost_gate_level"
path = "src/bin/p907_cost_gate_level.rs"
required-features = ["backtest_bin"]

# 票 #915 容量/频率探针（乙类可复用）：逐级波幅阶梯 A_ℓ + 信号频率 + 日波动率/日成交额。
[[bin]]
name = "p915_capacity_frequency"
path = "src/bin/p915_capacity_frequency.rs"
required-features = ["backtest_bin"]

# #1087 重型真实签收（3×200k trades，l_max=8；显式命令运行，不进普通 CI）。
# 无数据的 ID/event/c_p/cache negative 锁在 formal/Origin/ScanAssemblyNegative.lean，
# 已列入 Origin default root，CI `lake build` 每次真实执行。
[[test]]
name = "issue1087_scan_lean_parity"
path = "tests/issue1087_scan_lean_parity.rs"
required-features = ["issue1087_parity"]

# 仅测试期依赖：T 回测全量 runner 读取 analysis/data_cache/*.json（8 标的 OHLC）。
# 放 dev-dependencies ⇒ cdylib（Python 扩展）构建不受影响，零运行时依赖膨胀。
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# venue 费率 datum 的 sha256 校验（#360）：cargo test 下 `cfg(test)` 解 venue_fee::datum_io 门控。
sha2 = "0.10"

[profile.release]
# 逐位等价硬约束：禁止任何会改变浮点约简顺序的优化。
# Rust 默认不开启 fast-math（不存在 -ffast-math 等价），LLVM 的浮点重排
# 受 IEEE-754 语义保护——但显式声明意图，并禁用可能影响的 codegen。
opt-level = 3
lto = false
codegen-units = 16
