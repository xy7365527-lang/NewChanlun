[package]
name = "newchan_rust"
version = "0.1.0"
edition = "2021"
description = "缠论核心引擎的 Rust 重写（逐位等价于 Python 版）"

[lib]
name = "newchan_rust"
# cdylib: maturin 构建 Python 扩展模块；rlib: 让纯 Rust 单元测试可以 cargo test
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module 作为 optional feature：
#   - maturin build 时启用（见 pyproject.toml [tool.maturin] features）
#   - cargo test 时不启用（否则链接 libpython 失败）
pyo3 = { version = "0.23" }
# strict_nest_check 与 backtest CLI 共用严格 JSON 解码；生产二进制必须可直接构建。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nautilus Trader Rust-native 引擎（goal acceptance[5] ②③⑥：真实 BacktestEngine 驱动 S_Θ）。
#   optional + 仅 backtest_bin/nautilus feature 启用 ⟹ cdylib（Python 扩展）构建零膨胀。
#   default-features=false：避 nautilus 的 pyo3 feature 与本 crate pyo3 0.23 冲突（#5a 实测可拉）。
nautilus-model = { version = "0.60.0", default-features = false, optional = true }
nautilus-common = { version = "0.60.0", default-features = false, optional = true }
nautilus-trading = { version = "0.60.0", default-features = false, optional = true }
nautilus-backtest = { version = "0.60.0", default-features = false, optional = true }
# nautilus 集成的直接依赖（trait 返回 anyhow::Result、PortfolioApi 返回 rust_decimal::Decimal、
#   Bar/instrument 用 nautilus_core::UnixNanos、CurrencyPair 字段用 dec! 字面量）。
anyhow = { version = "1", optional = true }
rust_decimal = { version = "1", optional = true }
rust_decimal_macros = { version = "1", optional = true }
nautilus-core = { version = "0.60.0", default-features = false, optional = true }
# venue 费率 datum 的 sha256 版本哈希（#360，theta_v0::venue_fee::load_datum）。optional：
#   与 backtest 同门控（test 走 dev-dependency；CLI 走 backtest_bin feature）⟹ 默认 cdylib
#   （Python 扩展）构建不含，零依赖膨胀。纯 Rust 标准实现（sidecar 可用 `shasum -a 256 -c` 复核）。
sha2 = { version = "0.10", optional = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
# Nautilus 集成 feature：激活 theta_v0::nautilus 真实类型适配（②③）+ CLI BacktestEngine（⑥）。
nautilus = ["dep:nautilus-model", "dep:nautilus-common", "dep:nautilus-trading", "dep:nautilus-backtest", "dep:nautilus-core", "dep:anyhow", "dep:rust_decimal", "dep:rust_decimal_macros"]
# CLI 生产入口：解 theta_v0::backtest 的 #[cfg(test)] 门控为公开 API，链接 run_theta_v0_pi/load_by_symbol。
#   含 nautilus：CLI ⑥ 用真实 BacktestEngine（task#8 acceptance[5]）。
backtest_bin = ["nautilus", "dep:sha2"]

# ── CLI 生产入口（goal acceptance[5]：CLI 能驱动 S_Θ 产回测结果）。 ──
# required-features：默认 cargo build 不编译它（cdylib 构建不受影响）。
#   构建/运行：cargo run --features backtest_bin --bin theta_backtest -- <symbol>
[[bin]]
name = "theta_backtest"
path = "src/bin/theta_backtest.rs"
required-features = ["backtest_bin"]

# 纯买卖点择时隔离实验（goal #5 最根本问题：缠论买卖点择时本身有无 alpha）。
# 离散事件状态机（仓位∈{+1,0,-1}），不做 π_Θ 覆盖/净额——只在买卖点切换仓位。
[[bin]]
name = "pure_bsp_timing"
path = "src/bin/pure_bsp_timing.rs"
required-features = ["backtest_bin"]

[[bin]]
name = "pi_bsp_timing"
path = "src/bin/pi_bsp_timing.rs"
required-features = ["backtest_bin"]

# 任务 #100：nest 证书 × 现有买卖点全量对账（只读探针，CERT 读 P92_DUMP，BSP 走生产因果塔）。
[[bin]]
name = "p100_cert_bsp_recon"
path = "src/bin/p100_cert_bsp_recon.rs"
required-features = ["backtest_bin"]

# 任务 #101：证书 → 就近 BSP 打标物化（只读探针，不进判据层；cert-bsp-binding-ruling DRAFT 的可执行镜像）。
[[bin]]
name = "p101_cert_bsp_tag"
path = "src/bin/p101_cert_bsp_tag.rs"
required-features = ["backtest_bin"]

# 任务 #107：nest exec/top ↔ classifier lvl 级别标定探针（只读，不进判据层）。
[[bin]]
name = "p107_level_calib"
path = "src/bin/p107_level_calib.rs"
required-features = ["backtest_bin"]

# 任务 #108：区间套收敛探针——嵌套收缩/lvl0 极值 bar 收敛/破例归类（只读，不进判据层）。
[[bin]]
name = "p108_interval_probe"
path = "src/bin/p108_interval_probe.rs"
required-features = ["backtest_bin"]

# 任务 #105：nest 证书级别谱统计（只读探针；CERT 读 P92_DUMP，BSP 走生产因果塔，
# 身份连接用 terminal_bits_new 同构查法，nest 级 k == classifier lvl k）。
[[bin]]
name = "p105_cert_level_spectrum"
path = "src/bin/p105_cert_level_spectrum.rs"
required-features = ["backtest_bin"]

# ★M5 声部执行层跑批（多空对冲.pdf p16 关卡10）：run_theta_v0_pi_overlay ΔN 守恒 + 逐声部 pnl_v 归因。
[[bin]]
name = "theta_overlay"
path = "src/bin/theta_overlay.rs"
required-features = ["backtest_bin"]

[[bin]]
name = "p856_ed_dominance"
path = "src/bin/p856_ed_dominance.rs"
required-features = ["backtest_bin"]

# 票 #907 成本门探针（乙类可复用）：逐级买卖点间波幅 ÷（成本+误差）读数。
[[bin]]
name = "p907_cost_gate_level"
path = "src/bin/p907_cost_gate_level.rs"
required-features = ["backtest_bin"]

# 票 #915 容量/频率探针（乙类可复用）：逐级波幅阶梯 A_ℓ + 信号频率 + 日波动率/日成交额。
[[bin]]
name = "p915_capacity_frequency"
path = "src/bin/p915_capacity_frequency.rs"
required-features = ["backtest_bin"]

# 仅测试期依赖：T 回测全量 runner 读取 analysis/data_cache/*.json（8 标的 OHLC）。
# 放 dev-dependencies ⇒ cdylib（Python 扩展）构建不受影响，零运行时依赖膨胀。
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# venue 费率 datum 的 sha256 校验（#360）：cargo test 下 `cfg(test)` 解 venue_fee::datum_io 门控。
sha2 = "0.10"

[profile.release]
# 逐位等价硬约束：禁止任何会改变浮点约简顺序的优化。
# Rust 默认不开启 fast-math（不存在 -ffast-math 等价），LLVM 的浮点重排
# 受 IEEE-754 语义保护——但显式声明意图，并禁用可能影响的 codegen。
opt-level = 3
lto = false
codegen-units = 16
