<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>S 正式结构会话 · 只读观察（#1370 TB-01-A）</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  main { padding:20px; max-width:1180px; margin:0 auto; }
  section { margin-bottom:28px; }
  h2 { font-size:15px; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .kv { display:grid; grid-template-columns:200px 1fr; gap:4px 12px; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; word-break:break-all; }
  table { border-collapse:collapse; width:100%; }
  th,td { border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:normal; }
  .pill { display:inline-block; padding:0 7px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
  .impl { color:var(--ok); border-color:var(--ok); }
  .notimpl { color:var(--warn); border-color:var(--warn); }
  .run { color:var(--accent); border-color:var(--accent); }
  .err-box { border:1px solid var(--err); color:var(--err); padding:12px 16px; border-radius:6px; }
  .warn-box { border:1px solid var(--warn); color:var(--warn); padding:12px 16px; border-radius:6px; }
  details { margin:6px 0; border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  summary { cursor:pointer; }
  .branch { font-weight:bold; }
  .branch.RISING { color:#7ee787; }
  .branch.TOP { color:#ffa657; }
  .branch.BOTTOM { color:#79c0ff; }
  .branch.FALLING { color:#ff7b72; }
  .cmp-held { color:var(--ok); }
  .cmp-fail { color:var(--err); }
  .price { color:#a5d6ff; }
  .controls { margin:8px 0; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line); padding:4px 10px; border-radius:6px; cursor:pointer; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>S 正式结构会话 · 只读观察</h1>
  <div class="muted">#1370 TB-01-A · CC-006 local_shape · 同源 API（只读已提交 cut，不补判结构、不推算经济资格）</div>
</header>
<main>
  <section id="status-section"></section>

  <section id="meta-section">
    <h2>会话 / 快照元数据（按服务返回值呈现）</h2>
    <dl class="kv" id="meta-kv"><dd class="muted">加载中…</dd></dl>
  </section>

  <section>
    <h2>CC-006 local_shape 对象（四分支 + 两次方向 + 四个严格比较 + 三根 raw/merged 见证）</h2>
    <div id="objects"></div>
  </section>

  <section id="observations-section">
    <h2>知识不足 / 域不满足 / 无实例（分别显示，不混作 PASS）</h2>
    <div id="observations"></div>
  </section>

  <section>
    <h2>结构目录（已签目录 62 CC / 44 ST / 10 LC；未实现条目不隐藏）</h2>
    <div class="controls">
      <label><input type="checkbox" id="show-unimpl" checked> 显示未实现条目</label>
      <span class="muted" id="catalog-counts"></span>
    </div>
    <table id="catalog-table">
      <thead><tr><th>id</th><th>kind</th><th>标题</th><th>域</th><th>实现</th><th>证明</th><th>运行</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script>
"use strict";
// 精确整数纪律：所有价格/时间戳以字符串呈现（textContent），本页面不使用 Number()/parseFloat 处理价格。
function esc(s) { const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }
function renderStatus(text, cls) {
  const el = document.getElementById("status-section");
  el.innerHTML = text ? `<div class="${cls}">${esc(text)}</div>` : "";
}
function renderMeta(snap, cat) {
  const kv = [
    ["session_id", snap.session_id],
    ["generation", snap.generation],
    ["structure_cut", snap.structure_cut],
    ["catalog_revision", snap.catalog_revision],
    ["scope", JSON.stringify(snap.scope)],
    ["index_frontier", snap.index_frontier],
    ["profile_id", snap.profile_id],
    ["profile_hash", snap.profile_hash],
    ["objects", (snap.objects || []).length],
    ["witnesses", (snap.witnesses || []).length],
    ["relations", (snap.relations || []).length],
    ["catalog_items", (cat.items || []).length],
  ];
  document.getElementById("meta-kv").innerHTML = kv.map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
}
function renderObjects(snap) {
  const objects = snap.objects || [];
  const witnesses = snap.witnesses || [];
  const byObj = {};
  for (const w of witnesses) { (byObj[w.object_id] = byObj[w.object_id] || []).push(w); }
  const el = document.getElementById("objects");
  el.innerHTML = objects.map(o => {
    const ws = (byObj[o.object_id] || []).sort((a, b) => a.slot - b.slot);
    const cmpRows = (o.comparisons || []).map(c =>
      `<tr><td>${esc(c.pair)}</td><td>${esc(c.axis)}</td><td class="price">${esc(c.prev)}</td>` +
      `<td class="price">${esc(c.cur)}</td><td>${c.strict_up ? "&gt;" : "&lt;"}</td>` +
      `<td class="${c.held ? "cmp-held" : "cmp-fail"}">${c.held}</td></tr>`).join("");
    const refRows = (o.input_refs || []).map(g => {
      const inner = (g.raw_refs || []).map(r =>
        `<li>identity=${esc(r.identity_key)} event_id=${esc(r.event_id)} ` +
        `接纳序 seq=${esc(r.seq)} 源坐标 source_coord=${esc(r.source_coord)} ` +
        `输入修订 input_revision=${esc(r.input_revision)} 对象修订 revision=${esc(r.revision)} ` +
        `收据 receipt_id=${esc(r.receipt_id)} payload_hash=${esc(r.payload_hash)}</li>`).join("");
      return `<li>merged_index=${esc(g.merged_index)}<ul>${inner}</ul></li>`;
    }).join("");
    const wit = ws.map(w => {
      const raws = (w.raw_bars || []).map(r =>
        `<li>接纳序 seq=${esc(r.seq)} 源坐标 source_coord=${esc(r.source_coord)} ` +
        `identity=${esc(r.identity_key)} event_id=${esc(r.event_id)} ` +
        `revision=${esc(r.revision)} received_at=${esc(r.received_at)} ` +
        `receipt_id=${esc(r.receipt_id)} raw_text=${esc(r.raw_text)} ` +
        `price=<span class="price">${esc(r.price)}</span> ts=${esc(r.ts)} volume=${esc(r.volume)}</li>`).join("");
      return `<details><summary>slot ${esc(w.slot)} · merged source_index=${esc(w.merged_source_index)} ` +
        `O=${esc(w.merged_open)} H=<span class="price">${esc(w.merged_high)}</span> L=<span class="price">${esc(w.merged_low)}</span> C=${esc(w.merged_close)}</summary>` +
        `<ul>${raws || "<li class='muted'>（无原始成员）</li>"}</ul></details>`;
    }).join("");
    return `<details open><summary><span class="branch ${esc(o.branch)}">${esc(o.branch)}</span> · ` +
      `窗口 merged[${esc(o.window_start)},${esc(o.window_mid)},${esc(o.window_end)}] · ` +
      `dir(a,b)=${esc(o.dir_ab)} dir(b,c)=${esc(o.dir_bc)} · object_id=${esc(o.object_id)} · batch=${esc(o.batch_id)}</summary>` +
      `<table><thead><tr><th>pair</th><th>axis</th><th>prev</th><th>cur</th><th>关系</th><th>held</th></tr></thead>` +
      `<tbody>${cmpRows}</tbody></table>` +
      `<details><summary>input_refs（对象绑定输入身份/修订/收据）</summary><ul>${refRows || "<li class='muted'>（无）</li>"}</ul></details>` +
      `${wit}</details>`;
  }).join("");
}
function renderObservations(snap) {
  const obs = snap.observations || [];
  const objects = snap.objects || [];
  const el = document.getElementById("observations");
  const rows = [];
  const insuff = obs.filter(o => o.kind === "insufficient_knowledge");
  const domain = obs.filter(o => o.kind === "domain_not_satisfied");
  if (objects.length > 0) {
    rows.push(`<div class="muted">已发布 ${objects.length} 个 CC-006 分类对象（非空实例）。</div>`);
  }
  if (insuff.length > 0) {
    rows.push(`<div class="warn-box">知识不足：${insuff.map(o => `${esc(o.reason)}（merged_bars=${esc(o.detail && o.detail.merged_bars)}）`).join("；")}</div>`);
  }
  if (domain.length > 0) {
    rows.push(`<div class="warn-box">域不满足：${domain.map(o => `窗口[${esc(o.window_start)},${esc(o.window_mid)},${esc(o.window_end)}] ${esc(o.reason)}`).join("；")}（不造第五 Other 分型）</div>`);
  }
  if (objects.length === 0 && insuff.length === 0 && domain.length === 0) {
    rows.push(`<div class="muted">当前无 CC-006 实例（实例集合为空，不是 PASS）。</div>`);
  }
  el.innerHTML = rows.join("");
}
function renderCatalog(cat) {
  const showUnimpl = document.getElementById("show-unimpl").checked;
  const counts = cat.counts || {};
  document.getElementById("catalog-counts").textContent =
    `已实现 ${counts.implemented} / 未实现 ${counts.not_implemented} · run ${counts.run} / not_run ${counts.not_run}`;
  const rows = (cat.items || []).filter(r => showUnimpl || r.implementation_status === "implemented");
  document.querySelector("#catalog-table tbody").innerHTML = rows.map(r => {
    const impl = r.implementation_status === "implemented"
      ? `<span class="pill impl">implemented</span>` : `<span class="pill notimpl">not_implemented</span>`;
    const run = r.run_status === "run" ? `<span class="pill run">run</span>` : `<span class="pill notimpl">${esc(r.run_status)}</span>`;
    return `<tr><td>${esc(r.id)}</td><td>${esc(r.kind)}</td><td>${esc(r.title)}</td>` +
      `<td class="muted">${esc(r.domain)}</td><td>${impl}</td><td>${esc(r.proof_status)}</td><td>${run}</td></tr>`;
  }).join("");
}
async function fetchJson(url) {
  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    throw new Error("网络错误：" + e);
  }
  let body;
  try {
    body = await res.json();
  } catch (e) {
    throw new Error("响应非 JSON（HTTP " + res.status + "）");
  }
  if (!res.ok || body.ok === false) {
    throw new Error((body && body.error) || ("HTTP " + res.status));
  }
  return body;
}
async function load() {
  renderStatus("", "");
  try {
    const state = await fetchJson("/api/state");
    const cat = state.catalog;
    const snap = state.snapshot;
    // 核同一 cut 版本（不跨请求拼接状态）。
    if (cat.catalog_revision !== snap.catalog_revision ||
        cat.structure_cut !== snap.structure_cut ||
        cat.generation !== snap.generation) {
      renderStatus("cut 版本不一致（catalog/snapshot 不属于同一已提交 cut），请刷新", "err-box");
    }
    renderMeta(snap, cat);
    renderObjects(snap);
    renderObservations(snap);
    renderCatalog(cat);
  } catch (e) {
    // M3：错误状态清楚显示，不覆盖为成功空集。
    renderStatus("读取失败：" + e, "err-box");
    document.getElementById("meta-kv").innerHTML = `<dd class="muted">—</dd>`;
    document.getElementById("objects").innerHTML = `<div class="muted">未渲染（读取失败，不把失败当空实例）。</div>`;
    document.getElementById("observations").innerHTML = "";
  }
}
document.getElementById("show-unimpl").addEventListener("change", () => {
  load().then(() => {}).catch(() => {});
});
load();
</script>
</body>
</html>
